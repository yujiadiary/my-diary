# PagesCMS 配置
# 文档:https://pagescms.org/docs/
#
# 这个文件告诉 PagesCMS:
#   - 哪个目录是"文章"集合(posts/)
#   - 每篇文章有哪些字段、字段类型、可选值
#   - 图片附件存哪
# 配好之后,在 https://pagescms.org 添加仓库 yujiadiary/my-diary 就能直接
# 用图形界面发帖/编辑,改完它会作为 .md 文件 commit 到 posts/ 目录,
# Cloudflare Pages 检测到推送 → 跑 build.js → 前台刷新同步。

media:
  input: assets/uploads
  output: /uploads

content:
  - name: posts
    label: 文章
    path: posts
    type: collection
    create: true
    # 文件名按「日期-标题」自动生成,日期由系统填(永远正确)。
    # field: create 让你新建时能看到并修改文件名。
    # ⚠️ 请先填好标题再保存,否则文件名里标题段会是空的。
    filename:
      template: "{year}-{month}-{day}-{primary}.md"
      field: create
    view:
      fields: [title, author, category]
      primary: title
      sort: title
      default: descending
    fields:
      - name: title
        label: 标题
        type: string
        required: true
        description: ⚠️ 请先填写标题再保存,文件名会自动带标题

      - name: author
        label: 作者
        type: string
        required: true
        default: yu
        description: 直接输入作者 id:yu / jiang / zhou / archive

      - name: category
        label: 分类
        type: string
        required: true
        default: daily
        description: 直接输入分类 id:daily / long / photo / code / music / backup

      - name: tags
        label: 标签
        type: string
        list: true

      - name: images
        label: 图片外链
        type: string
        list: true
        description: 每行一个图片 URL(图床 / GitHub raw / R2 公共链接)

      - name: pinned
        label: 置顶
        type: boolean
        default: false
        description: 勾选后该篇会排在所有列表的最前

      - name: hidden
        label: 隐藏
        type: boolean
        default: false
        description: 勾选后前台不会显示这篇

      - name: draft
        label: 草稿
        type: boolean
        default: false
        description: 勾选后前台不会显示这篇

      # 日期字段已从 CMS 移除!
      # 之前 Pages CMS 日期选择器会把月份写成 35/04/58/49 等乱码,
      # 现在日期完全由文件名决定(系统生成的 {year}-{month}-{day} 永远正确),
      # build.js 构建时以文件名日期为准,不需要 frontmatter 里有 createdAt。

      - name: body
        label: 正文
        type: rich-text
        description: 支持换行、> 引用、```代码块```、图片链接

  # ---------- 评论集合 ----------
  - name: comments
    label: 评论
    path: comments
    type: collection
    create: true
    filename:
      template: "{year}-{month}-{day}-{primary}.md"
      field: create
    view:
      fields: [postId, author]
      primary: postId
      sort: postId
      default: descending
    fields:
      - name: postId
        label: 关联文章 ID
        type: string
        required: true
        description: 对应文章的文件名(不含 .md),例如 2026-09-13-jiang-xxx

      - name: author
        label: 评论人
        type: string
        required: true
        default: 加加
        description: 评论人名字,如:加加 / 江予朔 / 周叙

      # 日期字段已从 CMS 移除,同文章一样由文件名决定

      - name: body
        label: 评论正文
        type: rich-text
        description: Markdown 格式,支持换行、引用、加粗
