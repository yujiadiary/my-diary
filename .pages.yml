# PagesCMS 配置
# 文档:https://pagescms.org/docs/
#
# 这个文件告诉 PagesCMS:
#   - 哪个目录是"文章"集合(posts/)
#   - 每篇文章有哪些字段、字段类型、可选值
#   - 图片附件存哪
# 配好之后,在 https://pagescms.org 添加仓库 yujiadiary/my-diary 就能直接
# 用图形界面发帖/编辑,改完它会作为 .md 文件 commit 到 posts/ 目录,
# Cloudflare Pages 检测到推送 → 跑 build.js → 前台刷新同步。

media:
  input: assets/uploads
  output: /uploads

content:
  - name: posts
    label: 文章
    path: posts
    type: collection
    create: true
    # 文件名自动按「日期-作者-标题」生成,创建时可手动改。
    # 避免出现 2026-09-14-.md(标题没填就保存)这类空标题文件名。
    filename:
      template: "{year}-{month}-{day}-{author}-{title}.md"
      field: create
    view:
      fields: [title, author, category, createdAt]
      primary: title
      sort: createdAt
      default: descending
    fields:
      - name: title
        label: 标题
        type: string
        required: true

      - name: author
        label: 作者
        type: string
        required: true
        default: yu
        description: 直接输入作者 id:yu / jiang / zhou / archive

      - name: category
        label: 分类
        type: string
        required: true
        default: daily
        description: 直接输入分类 id:daily / long / photo / code / music / backup

      - name: tags
        label: 标签
        type: string
        list: true

      - name: images
        label: 图片外链
        type: string
        list: true
        description: 每行一个图片 URL(图床 / GitHub raw / R2 公共链接)

      - name: pinned
        label: 置顶
        type: boolean
        default: false
        description: 勾选后该篇会排在所有列表的最前

      - name: hidden
        label: 隐藏
        type: boolean
        default: false
        description: 勾选后前台不会显示这篇

      - name: draft
        label: 草稿
        type: boolean
        default: false
        description: 勾选后前台不会显示这篇

      - name: createdAt
        label: 创建时间
        type: date
        required: true
        readonly: true
        description: 自动填入当天日期,无需手动修改
        options:
          time: true
          format: yyyy-mm-dd

      - name: updatedAt
        label: 更新时间
        type: date
        readonly: true
        description: 自动填入当天日期,无需手动修改
        options:
          time: true
          format: yyyy-mm-dd

      - name: body
        label: 正文
        type: rich-text
        description: 支持换行、> 引用、```代码块```、图片链接

  # ---------- 评论集合 ----------
  # 评论文件名建议:<postId>-<时间戳或序号>.md
  # postId 填对应文章的文件名(不含 .md),例如 2026-09-13-jiang-xxx
  - name: comments
    label: 评论
    path: comments
    type: collection
    create: true
    view:
      fields: [postId, author, date]
      primary: postId
      sort: date
      default: descending
    fields:
      - name: postId
        label: 关联文章 ID
        type: string
        required: true
        description: 对应文章的文件名(不含 .md),例如 2026-09-13-jiang-xxx

      - name: author
        label: 评论人
        type: string
        required: true
        default: 于加
        description: 评论人名字,如:于加 / 江予朔 / 周叙

      - name: date
        label: 评论日期
        type: date
        required: true
        readonly: true
        description: 自动填入当天日期,无需手动修改
        options:
          time: true
          format: yyyy-mm-dd

      - name: body
        label: 评论正文
        type: rich-text
        description: Markdown 格式,支持换行、引用、加粗

# 如果以后要加别的集合(比如「关于页」内容也走 CMS 管理),可以再加:
#  - name: pages
#    label: 单页
#    path: pages
#    type: file
#    fields: [...]
