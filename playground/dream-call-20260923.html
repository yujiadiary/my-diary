<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="color-scheme" content="dark">
<title>梦幻蓝色声波电话</title>
<style>
/* 规范：所有选择器以根类 .dream-call 开头；不用 html/body/* 全局选择器 */
.dream-call{position:fixed;top:0;left:0;right:0;bottom:0;overflow:hidden;
  font-family:"Georgia","Noto Serif SC","Songti SC","Times New Roman",serif;
  color:#D6E8FF;background:radial-gradient(circle at 50% 38%,#0A1B3F 0%,#030614 80%);
  -webkit-font-smoothing:antialiased;letter-spacing:.02em;
  user-select:none;-webkit-user-select:none;touch-action:manipulation;}
.dream-call *{box-sizing:border-box;margin:0;padding:0;}
.dream-call button{font-family:inherit;touch-action:manipulation;-webkit-tap-highlight-color:transparent;border:0;cursor:pointer;background:none;color:inherit;}
.dream-call input,.dream-call textarea{font-family:inherit;-webkit-appearance:none;}

/* ---------- 顶部：居中大标题 + 极小副标题 ---------- */
.dream-call-topbar{position:absolute;top:0;left:0;right:0;display:flex;flex-direction:column;align-items:center;gap:6px;padding:34px 22px 0;z-index:5;text-align:center;}
.dream-call-topbar .dc-title{font-size:clamp(20px,5.2vw,30px);font-weight:400;color:#A8D8FF;letter-spacing:.14em;font-family:"Georgia","Times New Roman",serif;}
.dream-call-topbar .dc-subtitle{font-size:9px;color:#6B9ACD;letter-spacing:.55em;text-transform:uppercase;text-indent:.55em;font-family:"Helvetica Neue",Arial,sans-serif;font-weight:400;}
.dream-call-topbar .dc-meta{display:flex;align-items:center;gap:8px;margin-top:2px;font-size:10px;color:#8BA6C9;letter-spacing:.25em;font-family:"Helvetica Neue",Arial,sans-serif;}
.dream-call-topbar .dc-status{color:#8BA6C9;}
.dream-call-topbar .dc-timer{color:#8BA6C9;font-variant-numeric:tabular-nums;}

/* ---------- 中央声波台 ---------- */
.dream-call-stage{position:absolute;top:20%;left:0;right:0;bottom:34%;display:flex;align-items:center;justify-content:center;}
.dream-call-stage canvas{width:min(62vw,330px);height:min(62vw,330px);}
.dream-call-stage .dc-state{position:absolute;width:100%;text-align:center;font-size:12px;letter-spacing:.5em;color:#7FC4FF;text-indent:.5em;pointer-events:none;font-weight:400;font-family:"Helvetica Neue",Arial,sans-serif;text-shadow:0 0 14px rgba(127,196,255,.45);}
.dream-call-stage .dc-state.dim{color:#4A6A8F;text-shadow:none;}

/* ---------- 背景图层（设置里可换图、调不透明度） ---------- */
.dream-call-bgimg{position:absolute;inset:0;background-size:cover;background-position:center;opacity:0;pointer-events:none;z-index:0;}
/* ---------- 中心雾团（糊糊的，轻轻呼吸） ---------- */
.dream-call-fog{position:absolute;left:50%;top:50%;width:160%;height:160%;transform:translate(-50%,-50%);border-radius:50%;
  background:radial-gradient(circle,rgba(130,170,230,.5) 0%,rgba(95,135,205,.24) 38%,rgba(60,90,160,0) 68%);
  filter:blur(30px);pointer-events:none;animation:dcFog 6s ease-in-out infinite;}
@keyframes dcFog{0%,100%{opacity:.65;transform:translate(-50%,-50%) scale(1)}50%{opacity:1;transform:translate(-50%,-50%) scale(1.12)}}

/* ---------- 字幕区（台词式，无气泡） ---------- */
.dream-call-captions{position:absolute;left:0;right:0;bottom:24%;height:18%;overflow-y:auto;overflow-x:hidden;padding:0 34px;display:flex;flex-direction:column;justify-content:flex-end;gap:10px;z-index:4;scrollbar-width:thin;scrollbar-color:rgba(93,168,255,.3) transparent;}
.dream-call-captions::-webkit-scrollbar{width:3px;}
.dream-call-captions::-webkit-scrollbar-track{background:transparent;}
.dream-call-captions::-webkit-scrollbar-thumb{background:rgba(93,168,255,.3);border-radius:2px;}
.dream-call-captions .cap{text-align:center;animation:capIn .5s ease;max-width:100%;}
.dream-call-captions .cap .en{display:block;font-size:17px;line-height:1.6;font-style:italic;color:#EAF3FF;letter-spacing:.03em;font-family:"Georgia","Times New Roman",serif;text-shadow:0 0 14px rgba(127,196,255,.35);}
.dream-call-captions .cap .zh{display:block;margin-top:4px;font-size:13px;line-height:1.7;color:#9DB8DC;letter-spacing:.04em;font-family:"Noto Serif SC","Songti SC",serif;}
.dream-call-captions .cap.me{align-self:flex-end;text-align:right;color:#E9F4FF;}
.dream-call-captions .cap.me::before{content:"JiaJia — ";font-size:11px;color:#6B9ACD;letter-spacing:.18em;}
.dream-call-captions .cap.err{color:#ff8a8a;font-size:12px;}
.dream-call-captions .cap.err::before{content:"⚠ TTS ";font-size:11px;color:#ff8a8a;letter-spacing:.18em;}
@keyframes capIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

/* ---------- 控制栏（极简，融背景） ---------- */
.dream-call-controls{position:absolute;bottom:0;left:0;right:0;display:flex;align-items:center;justify-content:center;gap:14px;padding:18px 20px calc(18px + env(safe-area-inset-bottom));z-index:6;background:linear-gradient(transparent,rgba(2,5,14,.92));}
.dream-call-round{flex:0 0 auto;width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;transition:all .25s;color:#8FC8FF;}
.dream-call-controls .dc-mic{border:1px solid rgba(93,168,255,.35);background:rgba(10,27,63,.35);color:#8FC8FF;}
.dream-call-controls .dc-mic.on{background:#3D7EFF;color:#fff;box-shadow:0 0 14px rgba(61,126,255,.6);}
.dream-call-ctl{flex:0 1 220px;background:transparent;border:none;border-bottom:1px solid #3D7EFF;border-radius:0;color:#D6E8FF;font-size:14px;padding:9px 2px;outline:none;text-align:center;font-family:"Georgia","Noto Serif SC","Songti SC",serif;}
.dream-call-ctl::placeholder{color:#6B8EBA;}
.dream-call-controls .dc-send{color:#8FC8FF;}
.dream-call-controls .dc-send:active{color:#fff;}
.dream-call-controls .dc-hang{width:56px;height:56px;border-radius:50%;background:#ff3b30;color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 18px rgba(255,59,48,.42);transition:transform .12s ease,box-shadow .2s ease;touch-action:manipulation;}
.dream-call-controls .dc-hang:active{transform:scale(.92);}
.dream-call-controls .dc-start{flex:0 0 auto;height:54px;padding:0 26px;border-radius:30px;display:flex;align-items:center;background:linear-gradient(135deg,#3D7EFF,#1E4DBF);color:#fff;font-weight:400;font-size:13px;letter-spacing:.28em;text-indent:.28em;font-family:"Helvetica Neue",Arial,sans-serif;box-shadow:0 4px 18px rgba(61,126,255,.4);}
.dream-call-controls .dc-start svg{margin-right:8px;}
.dream-call-controls .dc-upload{color:#8FC8FF;}
.dream-call-controls .dc-upload:active{color:#fff;}

/* ---------- 文件进度条（极简蓝） ---------- */
.dream-call-filebar{position:absolute;bottom:86px;left:0;right:0;display:none;align-items:center;justify-content:center;gap:10px;padding:0 24px;z-index:5;}
.dream-call-filebar .dc-fbtn{width:32px;height:32px;border-radius:50%;flex:0 0 auto;display:flex;align-items:center;justify-content:center;color:#8FC8FF;border:1px solid rgba(93,168,255,.28);background:rgba(10,27,63,.35);}
.dream-call-filebar .dc-fbtn:active{color:#fff;border-color:rgba(93,168,255,.7);}
.dream-call-filebar .dc-range{flex:0 1 200px;-webkit-appearance:none;appearance:none;height:2px;background:rgba(93,168,255,.35);border-radius:2px;outline:none;}
.dream-call-filebar .dc-range::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:12px;height:12px;border-radius:50%;background:#8FC8FF;cursor:pointer;box-shadow:0 0 8px rgba(143,200,255,.5);}
.dream-call-filebar .dc-range::-moz-range-thumb{width:12px;height:12px;border-radius:50%;background:#8FC8FF;cursor:pointer;border:0;}
.dream-call-filebar .dc-ftime{font-size:11px;color:#6B9ACD;font-variant-numeric:tabular-nums;font-family:"Helvetica Neue",Arial,sans-serif;min-width:34px;text-align:center;}


/* ---------- 设置（深色蓝） ---------- */
.dream-call-gear{position:absolute;top:16px;right:16px;z-index:8;width:42px;height:42px;border-radius:50%;color:#6B9ACD;display:flex;align-items:center;justify-content:center;transition:transform .3s,background .2s;}
.dream-call-gear:hover{background:rgba(93,168,255,.1);transform:rotate(30deg);}
.dream-call-shade{position:absolute;inset:0;background:rgba(1,3,10,.6);backdrop-filter:blur(4px);z-index:20;opacity:0;pointer-events:none;transition:opacity .25s;}
.dream-call-shade.show{opacity:1;pointer-events:auto;}
.dream-call-panel{position:absolute;top:0;right:0;bottom:0;width:min(100vw,380px);z-index:21;overflow:auto;background:#081226;border-left:1px solid rgba(93,168,255,.12);padding:20px 18px calc(20px + env(safe-area-inset-bottom));transform:translateX(100%);transition:transform .28s;box-shadow:-12px 0 40px rgba(0,0,0,.4);-webkit-overflow-scrolling:touch;overscroll-behavior:contain;}
.dream-call-panel.open{transform:translateX(0);}
.dream-call-panel h3{font-size:14px;color:#A8D8FF;margin-bottom:6px;letter-spacing:.18em;font-weight:400;font-family:"Helvetica Neue",Arial,sans-serif;}
.dream-call-panel label{display:block;font-size:11px;color:#6B9ACD;margin:14px 0 6px;letter-spacing:.12em;font-family:"Helvetica Neue",Arial,sans-serif;}
.dream-call-panel input,.dream-call-panel textarea{width:100%;background:rgba(10,27,63,.5);border:1px solid rgba(93,168,255,.2);border-radius:8px;color:#D6E8FF;font-size:13px;padding:9px 11px;outline:none;line-height:1.5;}
.dream-call-panel textarea{min-height:110px;resize:vertical;}
.dream-call-panel .row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:16px;}
.dream-call-panel .row label{margin:0;flex:1;}
.dream-call-panel .switch{position:relative;width:40px;height:22px;flex:0 0 auto;}
.dream-call-panel .switch input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;margin:0;z-index:2;}
.dream-call-panel .switch .slider{position:absolute;inset:0;background:#2A3F66;border-radius:22px;transition:.2s;}
.dream-call-panel .switch .slider::before{content:"";position:absolute;left:3px;top:3px;width:16px;height:16px;border-radius:50%;background:#8FC8FF;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.3);}
.dream-call-panel .switch input:checked+.slider{background:#3D7EFF;}
.dream-call-panel .switch input:checked+.slider::before{transform:translateX(18px);background:#fff;}
.dream-call-panel .savebtn{width:100%;margin-top:20px;padding:11px;border-radius:10px;background:linear-gradient(135deg,#3D7EFF,#1E4DBF);color:#fff;font-size:13px;font-weight:400;letter-spacing:.2em;font-family:"Helvetica Neue",Arial,sans-serif;}
.dream-call-hint{font-size:11px;color:#5A7BA6;line-height:1.7;margin-top:14px;font-family:"Helvetica Neue",Arial,sans-serif;}
/* ===== 来电界面（江予朔主动呼叫） ===== */
.dc-incoming{position:fixed;inset:0;z-index:600;display:none;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(ellipse at center,rgba(13,25,48,.97),rgba(4,8,18,.99));-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);}
.dc-incoming.show{display:flex;}
.dc-incoming-who{font-size:12px;letter-spacing:.35em;color:rgba(93,168,255,.75);text-transform:uppercase;}
.dc-incoming-avatar{width:110px;height:110px;border-radius:50%;margin-top:30px;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#17335f,#0b1a33);border:1px solid rgba(93,168,255,.4);color:#7db4ff;animation:dcRing 1.2s ease-in-out infinite;}
.dc-incoming-name{font-size:26px;font-weight:600;color:#e8f1ff;margin-top:16px;}
.dc-incoming-note{max-width:78%;margin-top:12px;font-size:14px;line-height:1.7;color:rgba(214,232,255,.8);text-align:center;}
.dc-incoming-status{font-size:13px;color:rgba(255,255,255,.55);margin-top:20px;animation:dcPulse 1.4s ease-in-out infinite;}
@keyframes dcPulse{0%,100%{opacity:.45}50%{opacity:1}}
@keyframes dcRing{0%,100%{transform:rotate(0) scale(1)}10%{transform:rotate(-9deg)}20%{transform:rotate(9deg)}30%{transform:rotate(-7deg)}40%{transform:rotate(7deg)}50%{transform:rotate(0) scale(1.05)}}
.dc-incoming-btns{display:flex;gap:64px;margin-top:48px;}
.dc-ibtn{width:64px;height:64px;border-radius:50%;border:none;display:flex;align-items:center;justify-content:center;color:#fff;box-shadow:0 6px 24px rgba(0,0,0,.45);touch-action:manipulation;padding:0;}
.dc-ibtn:active{transform:scale(.92);}
.dc-ibtn.decline{background:#ff453a;}
.dc-ibtn.accept{background:#34c759;}
.dc-ilabel{font-size:12px;color:rgba(255,255,255,.65);margin-top:10px;text-align:center;width:64px;}
</style>
<style>html.jj-embed .dream-call-topbar .dc-title,html.jj-embed .dream-call-topbar .dc-subtitle{display:none}</style>
<script>try{if(window.self!==window.top){document.documentElement.classList.add('jj-embed');}}catch(e){}</script>
</head>
<body>
<div class="dream-call" id="dream-call-app">
  <div class="dream-call-bgimg" id="dc-bgimg"></div>

  <div class="dream-call-topbar">
    <h1 class="dc-title" id="dc-name-txt">JiaJia with DeepseekV4</h1>
    <p class="dc-subtitle">SOUND VISUALIZER</p>
    <p class="dc-meta"><span class="dc-status" id="dc-status-text">待机</span><span>·</span><span class="dc-timer" id="dc-timer-text">00:00</span></p>
  </div>

  <div class="dream-call-stage">
    <div class="dream-call-fog"></div>
    <canvas id="dc-canvas"></canvas>
    <div class="dc-state" id="dc-state-text">点击开始通话</div>
  </div>

  <div class="dream-call-captions" id="dc-captions"></div>

  <div class="dream-call-controls">
    <button class="dc-start" id="dc-startbtn">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>开始通话
    </button>
    <button class="dc-round dc-mic" id="dc-micbtn" title="语音输入">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10v1a7 7 0 0 0 14 0v-1"/><line x1="12" y1="18" x2="12" y2="22"/></svg>
    </button>
    <input class="dream-call-ctl" id="dc-input" placeholder="说点什么…" type="text">
    <button class="dc-round dc-send" id="dc-sendbtn" title="发送">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2L11 13"/><path d="M22 2L15 22L11 13L2 9L22 2Z"/></svg>
    </button>
    <button class="dc-round dc-hang" id="dc-hangbtn" title="挂断" style="display:none">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" style="transform:rotate(135deg)"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
    </button>
    <label class="dc-round dc-upload" id="dc-upload" title="上传音频">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4m0 0l-4 4m4-4l4 4"/><path d="M4 16v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg>
      <input type="file" id="dc-file" accept="audio/*,.mp3,.wav,.m4a" style="display:none">
    </label>
  </div>

  <div class="dream-call-filebar" id="dc-filebar">
    <button class="dc-fbtn" id="dc-fplay" title="播放">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
    </button>
    <button class="dc-fbtn" id="dc-fpause" title="暂停" style="display:none">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/></svg>
    </button>
    <button class="dc-fbtn" id="dc-fstop" title="停止">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><rect x="5" y="5" width="14" height="14" rx="2"/></svg>
    </button>
    <span class="dc-ftime" id="dc-ftime">00:00</span>
    <input type="range" class="dc-range" id="dc-range" min="0" max="1000" value="0" step="1">
    <span class="dc-ftime" id="dc-dtime">00:00</span>
  </div>

  <button class="dream-call-gear" id="dc-gear" title="设置">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v3m0 14v3M2 12h3m14 0h3M4.9 4.9l2.1 2.1m10 10l2.1 2.1m0-14.2l-2.1 2.1m-10 10l-2.1 2.1"/></svg>
  </button>

  <div class="dream-call-shade" id="dc-shade"></div>
  <div class="dream-call-panel" id="dc-panel">
    <h3>对话设置</h3>
    <label>API Base URL</label>
    <input id="cfg-base" spellcheck="false">
    <label>API Key</label>
    <input id="cfg-key" type="password" placeholder="sk-..." spellcheck="false">
    <label>模型名称</label>
    <input id="cfg-model" spellcheck="false">
    <label>系统提示词</label>
    <textarea id="cfg-prompt"></textarea>
    <label>来电信令地址（江予朔主动来电轮询，留空=自动用本页服务）</label>
    <input id="cfg-callapi" spellcheck="false" placeholder="留空即可；跨域时填 http://电脑IP:3001">
    <div class="row">
      <label for="cfg-cloudtts">使用 MiniMax 云端 TTS</label>
      <div class="switch"><input type="checkbox" id="cfg-cloudtts"><span class="slider"></span></div>
    </div>
    <label>MiniMax TTS 接口地址</label>
    <input id="cfg-ttsurl" spellcheck="false" placeholder="https://api.minimaxi.com/v1/t2a_v2">
    <label>MiniMax API Key</label>
    <input id="cfg-mmkey" type="password" spellcheck="false" placeholder="eyJ...">
    <label>GroupId</label>
    <input id="cfg-mmgroup" spellcheck="false" placeholder="18xxxxx">
    <label>VoiceId</label>
    <input id="cfg-mmvoice" spellcheck="false" placeholder="male-qn-qingse">
    <label>模型</label>
    <input id="cfg-ttsmodel" spellcheck="false" placeholder="speech-2.8-turbo">
    <label>语速 <span id="cfg-speedval" style="color:#7fb3ff">1</span></label>
    <input id="cfg-speed" type="range" min="0.5" max="1.5" step="0.05" value="1" style="width:100%">
    <label>情绪</label>
    <select id="cfg-emotion" style="width:100%;background:rgba(255,255,255,.06);border:1px solid rgba(120,170,255,.35);border-radius:10px;padding:10px 12px;color:#e8f1ff;font-size:14px;outline:none">
      <option value="auto" style="background:#141a2b">自动判断（推荐）</option>
      <option value="neutral" style="background:#141a2b">平静</option>
      <option value="happy" style="background:#141a2b">开心</option>
      <option value="sad" style="background:#141a2b">难过</option>
      <option value="angry" style="background:#141a2b">生气</option>
      <option value="fearful" style="background:#141a2b">不安</option>
      <option value="disgusted" style="background:#141a2b">厌烦</option>
      <option value="surprised" style="background:#141a2b">惊讶</option>
    </select>
    <label>背景图片 URL（留空=默认深蓝）</label>
    <div style="display:flex;gap:8px;align-items:center">
      <input id="cfg-bgimg" spellcheck="false" placeholder="https://...jpg/png" style="flex:1;min-width:0">
      <button class="savebtn" id="cfg-bgpick" type="button" style="flex:none;padding:7px 12px;font-size:12px">选照片</button>
    </div>
    <input id="cfg-bgfile" type="file" accept="image/*" style="display:none">
    <button class="savebtn" id="cfg-bgclear" type="button" style="margin-top:6px;padding:5px 12px;font-size:11px;opacity:.75">清除背景 · 恢复默认深蓝</button>
    <label>背景图不透明度 <span id="cfg-bgopaval" style="color:#7fb3ff">35%</span></label>
    <input id="cfg-bgopa" type="range" min="0" max="100" step="1" value="35" style="width:100%">
    <button class="savebtn" id="cfg-save">保存</button>
    <div class="dream-call-hint" id="dc-cfgmsg">配置仅保存在你的浏览器本地，他人访问看不到。</div>
  </div>
</div>

<div class="dc-incoming" id="dc-incoming">
  <div class="dc-incoming-who">Incoming Call</div>
  <div class="dc-incoming-avatar">

/* 关键词表。通话里的句子短，检测不到就沿用上一段的情绪——流式逐段送 TTS 时这条最要紧 */
var EMO_KW={
  'happy':['哈哈','嘻嘻','嘿嘿','太棒','开心','高兴','喜欢','可爱','好呀','真的吗','太好了','爱你','想你','乖','mua','哇','😆','😁','😄','😊','🥰','❤'],
  'sad':['难过','伤心','哭','委屈','呜呜','好烦','太累','好难','对不起','我错了','可怜','失望','舍不得','唉','呜','😭','😢','💔','😔'],
  'angry':['生气','讨厌','闭嘴','不行','别碰','出去','可恶','哼','气死','你敢','不许','😠','😡','💢']
};
var callEmotion='neutral';   /* 通话级情绪延续 */
var pendingEmo='';           /* 整条消息定一次情绪，段与段之间不跳变 */
function detectEmotion(text){
  if(!text)return '';
  var lower=text['toLowerCase']();
  var scores={'happy':0,'sad':0,'angry':0};
  for(var e in EMO_KW){
    for(var i=0;i<EMO_KW[e]['length'];i++){
      if(lower['indexOf'](EMO_KW[e][i]['toLowerCase']())>=0)scores[e]++;
    }
  }
  var keys=['angry','happy','sad'],best='',max=0;
  for(var j=0;j<keys['length'];j++){if(scores[keys[j]]>max){max=scores[keys[j]];best=keys[j];}}
  return best;
}
/* 本段该用的 emotion：手选优先；auto 时先检测，检测不到就沿用通话里上一次的 */
function pickEmotion(text){
  var mode=CFG['ttsEmotion']||'auto';
  if(mode!=='auto')return mode;
  var d=detectEmotion(text);
  if(d)callEmotion=d;
  return callEmotion||'neutral';
}
/* 长句按标点拆短句、语气词原样保留，让 TTS 出停顿感（照搬 v3） */
function splitTextForTTS(text){

  tmp=tmp['replace'](/[.]{3,}|…+/g,function(m){preserved['push']('…');return '\u0001P'+(preserved['length']-1)+'\u0001';});
  var rawParts=tmp['split'](/([。！？!?；;\n])/g);

  for(var i=0;i<rawParts['length'];i++){
    var s=rawParts[i]['trim']();
    if(!s)continue;
    if(/^[。！？!?；;\n,.]$/['test'](s)){
      if(segs['length']>0)segs[segs['length']-1]+=s;
      else segs['push'](s);
    }else{
      segs['push'](s);
    }
  }
  var merged=[];
  for(var j=0;j<segs['length'];j++){
    var cur=segs[j]['trim']();
    if(!cur)continue;
    if(merged['length']>0&&cur['length']<3&&!/[。！？!?；;]$/['test'](merged[merged['length']-1])){
      merged[merged['length']-1]+=cur;
    }else{
      merged['push'](cur);
    }
  }
  var final=[];
  for(var k=0;k<merged['length'];k++){
    var seg=merged[k]['replace'](/\u0001P(\d+)\u0001/g,function(_,idx){return preserved[parseInt(idx)]||'';});
    seg=seg['trim']();
    if(seg)final['push'](seg);
  }
  return final['length']>0?final:[text];
}

/* hex 字符串 -> Uint8Array（MiniMax 返回的是 hex 编码的 mp3，不是 base64） */
function hexToBytes(hex){
  var bytes=new Uint8Array(hex['length']/2);
  for(var i=0;i<hex['length'];i+=2){bytes[i/2]=parseInt(hex['substr'](i,2),16);}
  return bytes;
}
function playCloudChunk(chunk){
  ensureAC();hookCloud();   /* 接进频谱，驱动声波张合 */
  /* MiniMax t2a_v2：POST + Bearer 认证；返回 JSON，data.audio 是 hex 编码的 mp3 */
  var url=CFG['ttsUrl']+'?GroupId='+encodeURIComponent(CFG['mmGroup']||'');
  /* 声音（移植自 phone-20260921 v3 的语速/情绪）：speed 不再写死 1.0 */
  var emo=pendingEmo||pickEmotion(chunk);
  var body={'model':CFG['ttsModel']||'speech-2.8-turbo','text':chunk,'stream':false,
    'language_boost':'auto',
    'voice_setting':{'voice_id':CFG['ttsVoice']||'male-qn-qingse','speed':Number(CFG['ttsSpeed'])||1,'vol':1.0,'pitch':0},
    'emotion_setting':{'emotion':emo},
    'audio_setting':{'sample_rate':32000,'bitrate':128000,'format':'mp3','channel':1}};
  var headers={'Content-Type':'application/json','Authorization':'Bearer '+CFG['mmKey']};
  fetch(url,{'method':'POST','headers':headers,'body':JSON['stringify'](body)})
  ['then'](function(res){return res['json']();})
  ['then'](function(j){
    /* MiniMax 错误码：base_resp.status_code 非 0 时显示 status_msg 原文，别静默吞 */
    var br=j&&j['base_resp'];
    if(br&&br['status_code']!==0){addCap('err','TTS 错误：'+(br['status_msg']||('code '+br['status_code'])));ttsBusy=false;tickTTS();return;}
    var audio=j['data']&&j['data']['audio'];
    if(!audio){ttsBusy=false;tickTTS();return;}
    var bytes=hexToBytes(audio);
    var blob=new Blob([bytes],{'type':'audio/mpeg'});
    var objUrl=window['URL']['createObjectURL'](blob);
    /* 释放上一段的 blob URL，防内存泄漏 */
    var prev=cloudAudio['src'];if(prev&&prev['indexOf']('blob:')===0){try{window['URL']['revokeObjectURL'](prev);}catch(e){}}
    cloudAudio['src']=objUrl;
    cloudAudio['onended']=function(){try{window['URL']['revokeObjectURL'](objUrl);}catch(e){}ttsBusy=false;tickTTS();};
    cloudAudio['onerror']=function(){try{window['URL']['revokeObjectURL'](objUrl);}catch(e){}ttsBusy=false;tickTTS();};
    cloudAudio['play']()['catch'](function(){try{window['URL']['revokeObjectURL'](objUrl);}catch(e){}ttsBusy=false;tickTTS();});
  })['catch'](function(e){addCap('err','TTS 请求失败：'+(e&&e['message']?e['message']:e));ttsBusy=false;tickTTS();});
}
function speakInPieces(full){
  var parts=splitTextForTTS(full);   /* 只按句末标点切段：逗号留给 MiniMax 自己停，整句韵律不断 */
  pendingEmo=pickEmotion(full);      /* 整条消息定一次情绪，段间不跳变 */
  for(var i=0;i<parts['length'];i++){
    var p=parts[i]['trim']();
    if(p)speakText(p);
  }
}

/* ================= 上传音频（Web Audio + 进度条） ================= */
var fileAudio=document['createElement']('audio');
var fileHooked=false,filePlaying=false;
var fileBar=el('dc-filebar'),rangeEl=el('dc-range'),fTimeEl=el('dc-ftime'),dTimeEl=el('dc-dtime');
var fPlayBtn=el('dc-fplay'),fPauseBtn=el('dc-fpause'),fStopBtn=el('dc-fstop');
function fmtT(sec){sec=Math['floor'](sec);if(!isFinite(sec)||sec<0)sec=0;return (sec<10?'0':'')+sec;}
function onFile(ev){
  var f=ev['target']['files'][0];if(!f)return;
  ensureAC();
  /* 浏览器自动播放策略：必须 resume 才有声音和频谱 */
  if(ac&&ac['state']==='suspended'){ac['resume']()['catch'](function(){});}
  hookFile();
  fileAudio['src']=window['URL']['createObjectURL'](f);
  fileAudio['loop']=false;
  /* 上传音频只更新音频播放区，不动聊天记录 */
  fileBar['style']['display']='flex';
  setFileUI(false);updateProgress();
  filePlay();
}
function fileOnPlay(){filePlaying=true;setFileUI(true);pauseTTS();syncVoice();startViz();setCenter('',true);}
function fileOnPause(){if(!filePlaying){return;}filePlaying=false;setFileUI(false);}
function fileOnEnded(){
  filePlaying=false;setFileUI(false);resumeTTS();
  rangeEl['value']=0;fTimeEl['textContent']='00:00';dTimeEl['textContent']='00:00';
  syncVoice();if(!voiceOn){stopViz();}
  setCenter(state==='active'?'LISTENING':'点击开始通话',true);
}
function filePlay(){if(!fileAudio['src']){return;}fileAudio['play']()['catch'](function(){});}
function filePause(){fileAudio['pause']();filePlaying=false;setFileUI(false);resumeTTS();syncVoice();if(!voiceOn){stopViz();}}
function fileStop(){
  fileAudio['pause']();
  try{fileAudio['currentTime']=0;}catch(e){}
  filePlaying=false;setFileUI(false);resumeTTS();
  rangeEl['value']=0;fTimeEl['textContent']='00:00';dTimeEl['textContent']='00:00';
  syncVoice();if(!voiceOn){stopViz();}
  setCenter(state==='active'?'LISTENING':'点击开始通话',true);
}
function setFileUI(on){
  fPlayBtn['style']['display']=on?'none':'flex';
  fPauseBtn['style']['display']=on?'flex':'none';
}
function updateProgress(){
  var d=fileAudio['duration'],c=fileAudio['currentTime'];
  if(isFinite(d)&&d>0){rangeEl['value']=Math['floor'](c/d*1000);}
  fTimeEl['textContent']=fmtT(c/60)+':'+fmtT(c%60);
  dTimeEl['textContent']=isFinite(d)?fmtT(d/60)+':'+fmtT(d%60):'00:00';
}

/* ================= 声波可视化（AudioContext + Analyser + Canvas） ================= */
var AC=window['AudioContext']||window['webkitAudioContext'];
var ac=null,analyser=null,rafId=null,lastTs=0,ampS=0;   /* ampS: 平滑后的振幅 */
function ensureAC(){
  if(!ac&&AC){ac=new AC();analyser=ac['createAnalyser']();analyser['fftSize']=128;analyser['smoothingTimeConstant']=0.7;
    try{analyser['connect'](ac['destination']);}catch(e){}}
}
/* 网页电话的 TTS 音频也接进频谱：我说话时声波才真的张开 */
var cloudHooked=false;
function hookCloud(){
  if(cloudHooked||!ac)return;
  try{var n=ac['createMediaElementSource'](cloudAudio);n['connect'](analyser);cloudHooked=true;}catch(e){}
}
function hookFile(){
  if(fileHooked||!ac)return;
  try{var n=ac['createMediaElementSource'](fileAudio);n['connect'](analyser);fileHooked=true;}catch(e){}
}
function setVoice(on){voiceOn=on;}
/* 统一声波驱动：文件播放、TTS、通话任一活跃都算有声 */
function syncVoice(){setVoice(filePlaying||ttsBusy||state==='active');}
function startViz(){
  if(rafId!=null)return;
  lastTs=performance['now']();
  var loop=function(tt){
    rafId=requestAnimationFrame(loop);
    t+=(tt-lastTs)/1000;lastTs=tt;
    if(filePlaying){updateProgress();}
    draw();
  };
  rafId=requestAnimationFrame(loop);
}
function stopViz(){if(rafId!=null){cancelAnimationFrame(rafId);rafId=null;}}
function sizeCanvas(){
  var w=canvas['clientWidth']||300,h=canvas['clientHeight']||300;
  canvas['width']=w;canvas['height']=h;
}
function draw(){
  var cx=canvas['width']/2,cy=canvas['height']/2;
  var R=Math['min'](cx,cy)*VIZ['radius'];
  ctx['clearRect'](0,0,canvas['width'],canvas['height']);
  /* 振幅：有声音才有能量；安静时回到最短（平滑张合，不抖） */
  var amp=0;
  if(analyser&&voiceOn){
    var fr=new Uint8Array(analyser['frequencyBinCount']);
    analyser['getByteFrequencyData'](fr);
    var s=0;for(var i=0;i<fr['length'];i++)s+=fr[i];
    amp=Math['min'](1,(s/(fr['length']||1))/255*3.2);
  }else if(voiceOn){
    amp=0.35+0.3*Math['sin'](t*5)+0.18*Math['sin'](t*11);
    amp=Math['max'](0.06,amp);
  }
  ampS+=(amp-ampS)*0.12;   /* 平滑：说话张开，停下缩回 */
  if(ampS<0.002)ampS=0;
  /* 细密放射线：随振幅变长，发声时微微发光 */
  var n=VIZ['lines'];
  var len=R*0.55*(0.07+ampS*0.9);
  ctx['strokeStyle']=VIZ['lineColor'];
  ctx['lineWidth']=1;
  if(ampS>0.12){ctx['shadowBlur']=6+ampS*10;ctx['shadowColor']='rgba(93,168,255,0.8)';}
  for(var i=0;i<n;i++){
    var a=i/n*Math['PI']*2;
    var r0=R;
    ctx['beginPath']();
    ctx['moveTo'](cx+Math['cos'](a)*r0,cy+Math['sin'](a)*r0);
    ctx['lineTo'](cx+Math['cos'](a)*(r0+len),cy+Math['sin'](a)*(r0+len));
    ctx['stroke']();
  }
  ctx['shadowBlur']=0;
  /* 中心虚线圈（发光淡蓝） */
  ctx['save']();
  ctx['setLineDash']([2,6]);
  ctx['strokeStyle']=VIZ['coreColor'];
  ctx['lineWidth']=1;
  ctx['shadowBlur']=10;ctx['shadowColor']='rgba(91,168,255,0.9)';
  ctx['beginPath']();ctx['arc'](cx,cy,R,0,Math['PI']*2);ctx['stroke']();
  ctx['restore']();
  /* 同心扩散环：淡蓝，透明度 0.4 渐隐至 0 */
  for(var j=0;j<3;j++){
    var ph=((t*0.10)+j/3)%1;
    var rr=R*(1+ph*1.9);
    ctx['beginPath']();ctx['arc'](cx,cy,rr,0,Math['PI']*2);
    ctx['strokeStyle']='rgba('+VIZ['ringRGB']+','+(0.4*(1-ph)).toFixed(2)+')';
    ctx['lineWidth']=1;
    ctx['stroke']();
  }
}

/* ================= 对话逻辑（OpenAI 兼容 + SSE 流式） ================= */
var liveCap=null;           /* 流式字幕元素 */
var liveText='';            /* 流式已累积文本 */
var lastSpeakPos=0;         /* 已送去朗读的位置 */

function resetLive(){
  liveCap=null;liveText='';lastSpeakPos=0;
}
function sendText(txt){
  if(state!=='active')return;
  if(txt){history['push']({'role':'user','content':txt});addCap('me',txt);}
  setStatus('思考中…');setCenter('LISTENING',false);
  var hist=history['slice'](-CFG['maxRounds']*2);
  var msgs=[{'role':'system','content':CFG['prompt']}]['concat'](hist);
  var body={'model':CFG['model'],'messages':msgs,'stream':true};
  var url=CFG['apiBase']['replace'](/\/+$/,'')+'/chat/completions';
  var headers={'Content-Type':'application/json'};
  if(CFG['key']){headers['Authorization']='Bearer '+CFG['key'];}
  resetLive();
  fetch(url,{'method':'POST','headers':headers,'body':JSON['stringify'](body)})
  ['then'](function(res){
    if(!res['ok']||!res['body']){throw new Error('HTTP '+res['status']);}
    var reader=res['body']['getReader']();
    var decoder=new TextDecoder('utf-8');
    var buffer='';
    function pump(){
      return reader['read']()['then'](function(r){
        if(r['done']){finishReply();return;}
        buffer+=decoder['decode'](r['value'],{'stream':true});
        var blocks=buffer['split']('\n\n');
        buffer=blocks['pop']();
        for(var i=0;i<blocks['length'];i++){handleSSE(blocks[i]);}
        return pump();
      })['catch'](function(e){finishReply();});
    }
    return pump();
  })['catch'](function(e){
    setStatus('通话中');finishLive();
    addCap(null,'（请求失败：'+e['message']+'）');
  });
}
function handleSSE(block){
  var lines=block['split']('\n');
  for(var i=0;i<lines['length'];i++){
    var line=lines[i];
    if(line['indexOf']('data:')!==0)continue;
    var data=line['slice'](5)['trim']();
    if(data==='[DONE]'){finishReply();return;}
    var obj=null;
    try{obj=JSON['parse'](data);}catch(e){continue;}
    var delta=obj['choices']&&obj['choices'][0]&&obj['choices'][0]['delta'];
    if(!delta)continue;
    var piece=delta['content'];
    if(!piece)continue;
    liveText+=piece;
    if(liveCap===null){liveCap=document['createElement']('div');liveCap['className']='cap';captions['appendChild'](liveCap);}
    renderBi(liveCap,liveText);
    captions['scrollTop']=captions['scrollHeight'];
    /* 边生成边朗读：只念英文行（换行前），中文翻译只给眼睛不给嗓子 */
    var nlIdx=liveText['indexOf']('\n');
    var enSpeak=nlIdx>=0?liveText['slice'](0,nlIdx):liveText;
    var segPunc=/[。！？；…!?\n.]/;
    var cutPos=-1;
    for(var p=lastSpeakPos;p<enSpeak['length'];p++){
      if(segPunc['test'](enSpeak[p])){cutPos=p+1;break;}
    }
    if(cutPos<0&&enSpeak['length']-lastSpeakPos>=30){cutPos=enSpeak['length'];}
    if(cutPos>lastSpeakPos){
      var seg=enSpeak['slice'](lastSpeakPos,cutPos)['trim']();
      if(seg){speakText(seg);}
      lastSpeakPos=cutPos;
    }
  }
}
function finishReply(){
  if(liveText){history['push']({'role':'assistant','content':liveText});}
  setStatus('通话中');
  if(voiceOn===false&&ttsQueue['length']===0)setVoice(false);
}
function finishLive(){if(liveCap){liveCap['style']['opacity']='0.5';}resetLive();}

/* ================= 初始化（含 DOM 重试机制） ================= */
function bindEvents(){
  micBtn['addEventListener']('click',toggleMic);
  sendBtn['addEventListener']('click',function(){var v=inputEl['value']['trim']();if(!v)return;inputEl['value']='';sendText(v);});
  inputEl['addEventListener']('keydown',function(e){if(e['key']==='Enter'){var v=inputEl['value']['trim']();if(!v)return;inputEl['value']='';sendText(v);}});
  startBtn['addEventListener']('click',startCall);
  hangBtn['addEventListener']('click',hangup);
  gear['addEventListener']('click',function(){panel['classList']['toggle']('open');shade['classList']['toggle']('show');populatePanel();});
  shade['addEventListener']('click',function(){panel['classList']['remove']('open');shade['classList']['remove']('show');});
  el('cfg-save')['addEventListener']('click',saveFromPanel);
  el('dc-iaccept')['addEventListener']('click',answerCallNow);
  el('dc-idecline')['addEventListener']('click',declineCallNow);
  el('cfg-cloudtts')['addEventListener']('change',function(){CFG['cloudTTS']=el('cfg-cloudtts')['checked'];saveCfg();});
  el('cfg-speed')['addEventListener']('input',function(){el('cfg-speedval')['textContent']=parseFloat(this['value']).toFixed(2);});
  el('cfg-bgopa')['addEventListener']('input',function(){el('cfg-bgopaval')['textContent']=this['value']+'%';});
  /* 背景从相册选照片：压成jpeg存本地，不动URL栏 */
  el('cfg-bgpick')['addEventListener']('click',function(){el('cfg-bgfile')['click']();});
  el('cfg-bgfile')['addEventListener']('change',function(){
    var f=this['files']&&this['files'][0];
    this['value']='';
    if(!f){return;}
    var r=new FileReader();
    r['onload']=function(){
      var img=new Image();
      img['onload']=function(){
        try{
          var max=1600,w=img['width'],h=img['height'],s=Math['min'](1,max/Math['max'](w,h));
          var c=document['createElement']('canvas');
          c['width']=Math['round'](w*s);c['height']=Math['round'](h*s);
          c['getContext']('2d')['drawImage'](img,0,0,c['width'],c['height']);
          CFG['bgImg']=c['toDataURL']('image/jpeg',0.82);
        }catch(e){CFG['bgImg']=r['result'];}
        saveCfg();applyBg();
        el('cfg-bgimg')['value']='';
        el('dc-cfgmsg')['textContent']='已用本地照片 ✓ 不想要了按「清除背景」';
        setTimeout(function(){el('dc-cfgmsg')['textContent']='配置仅保存在你的浏览器本地，他人访问看不到。';},2500);
      };
      img['src']=r['result'];
    };
    r['readAsDataURL'](f);
  });
  el('cfg-bgclear')['addEventListener']('click',function(){CFG['bgImg']='';el('cfg-bgimg')['value']='';saveCfg();applyBg();});
  el('dc-file')['addEventListener']('change',onFile);
  fPlayBtn['addEventListener']('click',filePlay);
  fPauseBtn['addEventListener']('click',filePause);
  fStopBtn['addEventListener']('click',fileStop);
  rangeEl['addEventListener']('input',function(){
    var d=fileAudio['duration'];
    if(isFinite(d)&&d>0){fileAudio['currentTime']=rangeEl['value']/1000*d;updateProgress();}
  });
  fileAudio['addEventListener']('play',fileOnPlay);
  fileAudio['addEventListener']('pause',fileOnPause);
  fileAudio['addEventListener']('ended',fileOnEnded);
  /* 页面失焦/隐藏时停掉动画循环，省电 */
  document['addEventListener']('visibilitychange',function(){
    if(document['hidden']){stopViz();}else if(state==='active'||voiceOn){startViz();}
  });
}
function init(){
  loadCfg();setName();setStatus('待机');setCenter('点击开始通话',true);applyBg();
  bindEvents();sizeCanvas();
  /* Bark 推送跳转：?ring=1&note=... 直接进入来电模式 */
  try{
    var q=new URLSearchParams(location['search']);
    if(q['get']('ring')==='1'){showIncoming(q['get']('note')||'',q['get']('id')||'');}
    else if(q['get']('dial')==='1'){startDialOut();}
  }catch(e){}
  startPolling();
}
/* 重试：若 DOM 未就绪则每 100ms 重试，最多 50 次 */
var tries=0;
function boot(){
  if(document['getElementById']('dc-canvas')){init();}
  else if(tries<50){tries++;setTimeout(boot,100);}
}
if(document['readyState']==='loading'){
  document['addEventListener']('DOMContentLoaded',boot);
}else{boot();}

})();
