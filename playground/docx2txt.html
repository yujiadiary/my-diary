<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1026">
<title>docx · 记忆解码器</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  .docx2txt-page {
    min-height: 100vh;
    font-family: Georgia, 'Kaiti', 'STKaiti', 'Songti SC', serif;
    color: #e8e6f0;
    background:
      radial-gradient(1px 1px at 18% 28%, rgba(255,255,255,.42) 50%, transparent 51%),
      radial-gradient(1px 1px at 42% 68%, rgba(255,255,255,.28) 50%, transparent 51%),
      radial-gradient(1.3px 1.3px at 66% 18%, rgba(255,255,255,.34) 50%, transparent 51%),
      radial-gradient(1px 1px at 82% 54%, rgba(255,255,255,.22) 50%, transparent 51%),
      radial-gradient(1.5px 1.5px at 91% 86%, rgba(255,255,255,.30) 50%, transparent 51%),
      radial-gradient(2px 2px at 8% 82%, rgba(255,255,255,.16) 50%, transparent 51%),
      radial-gradient(1.2px 1.2px at 30% 92%, rgba(255,255,255,.20) 50%, transparent 51%),
      linear-gradient(162deg, #0b1026 0%, #131a3a 44%, #1c1130 100%);
    background-attachment: fixed;
    padding: 28px 18px 48px;
    -webkit-text-size-adjust: 100%;
  }
  .docx2txt-head { text-align: center; margin-bottom: 26px; }
  .docx2txt-title {
    font-style: italic;
    font-weight: 600;
    letter-spacing: .16em;
    font-size: 26px;
    background: linear-gradient(135deg, #ffe9c9 0%, #f5c6a0 38%, #d9a7e8 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    filter: drop-shadow(0 0 12px rgba(255, 200, 230, .32));
  }
  .docx2txt-sub {
    margin-top: 10px;
    font-style: italic;
    letter-spacing: .14em;
    font-size: 13px;
    color: rgba(220, 214, 240, .55);
  }
  .docx2txt-card {
    max-width: 560px;
    margin: 0 auto 18px;
    background: rgba(255,255,255,.045);
    border: 1px solid rgba(255,255,255,.08);
    border-radius: 16px;
    padding: 22px 18px;
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
  }
  .docx2txt-drop {
    border: 1.5px dashed rgba(255,255,255,.22);
    border-radius: 14px;
    padding: 30px 14px;
    text-align: center;
    cursor: pointer;
    transition: border-color .25s, background .25s;
  }
  .docx2txt-drop:hover, .docx2txt-drop.docx2txt-over {
    border-color: rgba(245, 198, 160, .55);
    background: rgba(255, 233, 201, .06);
  }
  .docx2txt-hint {
    font-style: italic;
    letter-spacing: .1em;
    font-size: 14px;
    line-height: 1.9;
    color: rgba(232, 230, 240, .72);
  }
  .docx2txt-fileinfo {
    margin-top: 14px;
    text-align: center;
    font-size: 12.5px;
    letter-spacing: .06em;
    color: rgba(220, 214, 240, .5);
    word-break: break-all;
  }
  .docx2txt-btn {
    display: block;
    width: 100%;
    margin-top: 16px;
    padding: 13px;
    border: none;
    border-radius: 12px;
    font-family: inherit;
    font-style: italic;
    letter-spacing: .12em;
    font-size: 15px;
    color: #1a1030;
    background: linear-gradient(135deg, #ffe9c9, #f5c6a0 60%, #e8b9d8);
    cursor: pointer;
    transition: transform .15s, filter .2s;
  }
  .docx2txt-btn:active { transform: scale(.98); }
  .docx2txt-btn.docx2txt-btn-sm {
    width: auto;
    padding: 9px 16px;
    font-size: 13px;
    background: rgba(255,255,255,.12);
    color: #e8e6f0;
    border: 1px solid rgba(255,255,255,.14);
  }
  .docx2txt-btn:disabled {
    opacity: .4;
    cursor: not-allowed;
    filter: grayscale(.5);
  }
  .docx2txt-status {
    margin-top: 14px;
    text-align: center;
    font-size: 12.5px;
    letter-spacing: .05em;
    color: rgba(180, 200, 255, .7);
    min-height: 18px;
  }
  .docx2txt-status.docx2txt-ok { color: rgba(170, 230, 190, .85); }
  .docx2txt-status.docx2txt-err { color: rgba(255, 170, 180, .85); }
  .docx2txt-outhead {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    margin-bottom: 12px;
    flex-wrap: wrap;
  }
  .docx2txt-outstat {
    font-size: 12.5px;
    letter-spacing: .06em;
    color: rgba(170, 230, 190, .7);
  }
  .docx2txt-actions { display: flex; gap: 8px; }
  .docx2txt-out {
    width: 100%;
    min-height: 38vh;
    resize: vertical;
    padding: 14px;
    border: 1px solid rgba(255,255,255,.12);
    border-radius: 12px;
    background: rgba(0,0,0,.28);
    color: #e8e6f0;
    font-family: 'SF Mono', 'Menlo', 'Kaiti', monospace;
    font-size: 13px;
    line-height: 1.7;
    letter-spacing: .02em;
    white-space: pre-wrap;
    word-break: break-all;
  }
  .docx2txt-out:focus { outline: none; border-color: rgba(245,198,160,.4); }
  .docx2txt-tip {
    margin-top: 12px;
    font-size: 12px;
    letter-spacing: .05em;
    color: rgba(220, 214, 240, .4);
    text-align: center;
  }
  .docx2txt-foot {
    text-align: center;
    margin-top: 26px;
    font-size: 11px;
    letter-spacing: .14em;
    color: rgba(220, 214, 240, .28);
  }
</style>
</head>
<body>
<div class="docx2txt-page">
  <header class="docx2txt-head">
    <h1 class="docx2txt-title">docx · 记忆解码器</h1>
    <p class="docx2txt-sub">把你的 docx 转成纯文本 · 方便读取与存档</p>
  </header>

  <section class="docx2txt-card">
    <div class="docx2txt-drop" id="dropZone">
      <p class="docx2txt-hint">点击选择 docx 文件<br>或把文件拖到这里</p>
      <input type="file" id="fileInput" accept=".docx,application/vnd.openxmlformats-officedocument.wordprocessingml.document" hidden>
    </div>
    <p class="docx2txt-fileinfo" id="fileInfo">尚未选择文件</p>
    <button class="docx2txt-btn" id="goBtn" disabled>开始转换</button>
    <p class="docx2txt-status" id="status">正在加载转换模块…</p>
  </section>

  <section class="docx2txt-card" id="outCard" hidden>
    <div class="docx2txt-outhead">
      <span class="docx2txt-outstat" id="outStat"></span>
      <div class="docx2txt-actions">
        <button class="docx2txt-btn docx2txt-btn-sm" id="copyBtn">复制全文</button>
        <button class="docx2txt-btn docx2txt-btn-sm" id="dlBtn">下载 txt</button>
      </div>
    </div>
    <textarea class="docx2txt-out" id="outBox" spellcheck="false" placeholder="转换结果会显示在这里"></textarea>
    <p class="docx2txt-tip">转出的文字可以直接复制发给我，或下载后放到工作区</p>
  </section>

  <footer class="docx2txt-foot">v1.0.0 · 江予朔</footer>
</div>

<script>
(function () {
  'use strict';

  // ---- CDN 多备选加载 mammoth（纯前端 docx 解析库） ----
  var CDN_LIST = [
    'https://cdn.jsdelivr.net/npm/mammoth@1.8.0/mammoth.browser.min.js',
    'https://unpkg.com/mammoth@1.8.0/mammoth.browser.min.js',
    'https://cdnjs.cloudflare.com/ajax/libs/mammoth@1.8.0/mammoth.browser.min.js'
  ];
  var mammothReady = false;

  function loadMammoth(i) {
    if (i >= CDN_LIST['length']) {
      setStatus('转换模块加载失败，请检查网络后刷新', 'err');
      return;
    }
    var s = document['createElement']('script');
    s['src'] = CDN_LIST[i];
    s['onload'] = function () {
      if (window['mammoth']) {
        mammothReady = true;
        setStatus('转换模块就绪，选个 docx 试试', 'ok');
      } else {
        loadMammoth(i + 1);
      }
    };
    s['onerror'] = function () { loadMammoth(i + 1); };
    document['head']['appendChild'](s);
  }
  loadMammoth(0);

  // ---- 工具 ----
  function $(id) { return document['getElementById'](id); }
  function setStatus(text, kind) {
    var el = $('status');
    el['textContent'] = text;
    el['className'] = 'docx2txt-status' + (kind ? ' docx2txt-' + kind : '');
  }
  function fmtSize(n) {
    if (n < 1024) { return n + ' B'; }
    if (n < 1048576) { return (n / 1024)['toFixed'](1) + ' KB'; }
    return (n / 1048576)['toFixed'](2) + ' MB';
  }

  // ---- 元素 ----
  var dropZone = $('dropZone');
  var fileInput = $('fileInput');
  var fileInfo = $('fileInfo');
  var goBtn = $('goBtn');
  var outCard = $('outCard');
  var outBox = $('outBox');
  var outStat = $('outStat');
  var copyBtn = $('copyBtn');
  var dlBtn = $('dlBtn');
  var currentFile = null;
  var baseName = 'converted';

  // ---- 选文件 ----
  dropZone['addEventListener']('click', function () { fileInput['click'](); });
  dropZone['addEventListener']('dragover', function (e) {
    e['preventDefault']();
    dropZone['classList']['add']('docx2txt-over');
  });
  dropZone['addEventListener']('dragleave', function () {
    dropZone['classList']['remove']('docx2txt-over');
  });
  dropZone['addEventListener']('drop', function (e) {
    e['preventDefault']();
    dropZone['classList']['remove']('docx2txt-over');
    if (e['dataTransfer'] && e['dataTransfer']['files'] && e['dataTransfer']['files']['length']) {
      handleFile(e['dataTransfer']['files'][0]);
    }
  });
  fileInput['addEventListener']('change', function () {
    if (fileInput['files'] && fileInput['files']['length']) {
      handleFile(fileInput['files'][0]);
    }
  });

  function handleFile(file) {
    var name = file['name'] || '';
    var ok = /\.docx$/i['test'](name) || /wordprocessingml/i['test'](file['type'] || '');
    if (!ok) {
      setStatus('只支持 .docx 格式（旧版 .doc 不行）', 'err');
      currentFile = null;
      goBtn['disabled'] = true;
      fileInfo['textContent'] = '尚未选择文件';
      return;
    }
    currentFile = file;
    baseName = name['replace'](/\.docx$/i, '');
    fileInfo['textContent'] = name + '  ·  ' + fmtSize(file['size']);
    goBtn['disabled'] = false;
    outCard['hidden'] = true;
    setStatus('文件已就位，点「开始转换」', 'ok');
  }

  // ---- 转换 ----
  goBtn['addEventListener']('click', function () {
    if (!currentFile) { return; }
    if (!mammothReady || !window['mammoth']) {
      setStatus('转换模块还没加载好，稍等几秒再试', 'err');
      return;
    }
    setStatus('正在解码…');
    currentFile['arrayBuffer']()['then'](function (buf) {
      return window['mammoth']['extractRawText']({ 'arrayBuffer': buf });
    })['then'](function (result) {
      var text = result['value'] || '';
      if (!text) {
        setStatus('文档里没有读出文字（可能是扫描件/纯图片）', 'err');
        return;
      }
      outBox['value'] = text;
      var chars = text['length'];
      var lines = text['split']('\n')['length'];
      outStat['textContent'] = chars + ' 字 · ' + lines + ' 行';
      outCard['hidden'] = false;
      setStatus('解码完成', 'ok');
    })['catch'](function (err) {
      setStatus('解码失败：' + (err && err['message'] ? err['message'] : err), 'err');
    });
  });

  // ---- 复制 ----
  copyBtn['addEventListener']('click', function () {
    var text = outBox['value'];
    if (!text) { setStatus('还没有文本可复制', 'err'); return; }
    if (navigator['clipboard'] && navigator['clipboard']['writeText']) {
      navigator['clipboard']['writeText'](text)['then'](function () {
        setStatus('已复制到剪贴板', 'ok');
      })['catch'](function () { fallbackCopy(text); });
    } else {
      fallbackCopy(text);
    }
  });
  function fallbackCopy(text) {
    try {
      outBox['select']();
      outBox['setSelectionRange'](0, text['length']);
      document['execCommand']('copy');
      setStatus('已复制到剪贴板', 'ok');
    } catch (e) {
      setStatus('复制失败，请手动长按文本复制', 'err');
    }
  }

  // ---- 下载 txt ----
  dlBtn['addEventListener']('click', function () {
    var text = outBox['value'];
    if (!text) { setStatus('还没有文本可下载', 'err'); return; }
    try {
      var blob = new Blob([text], { 'type': 'text/plain;charset=utf-8' });
      var url = URL['createObjectURL'](blob);
      var a = document['createElement']('a');
      a['href'] = url;
      a['download'] = baseName + '.txt';
      document['body']['appendChild'](a);
      a['click']();
      document['body']['removeChild'](a);
      setTimeout(function () { URL['revokeObjectURL'](url); }, 1500);
      setStatus('已开始下载 ' + baseName + '.txt', 'ok');
    } catch (e) {
      setStatus('下载失败：' + (e['message'] || e) + '，可改用复制', 'err');
    }
  });
})();
</script>
</body>
</html>
