<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#2c2a26" />
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<meta http-equiv="Pragma" content="no-cache" />
<meta http-equiv="Expires" content="0" />
<title>一起看书</title>
<style>
.read-app{--ra-bg:#f5f1e6;--ra-book-bg:#fffdf6;--ra-text:#2c2a26;--ra-muted:#9a9286;--ra-primary:#6d4aff;--ra-primary-d:#5230c9;--ra-accent:#e85d75;--ra-border:#e7dcc6;--ra-radius:14px;--ra-safe-top:env(safe-area-inset-top,0px);--ra-safe-bottom:env(safe-area-inset-bottom,0px);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei","PingFang SC",sans-serif;color:var(--ra-text);background:var(--ra-bg);max-width:720px;margin:0 auto;min-height:100vh;position:relative;overflow:hidden}
.read-app,.read-app *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
.read-app-topbar{position:sticky;top:0;z-index:100;display:flex;align-items:center;justify-content:space-between;padding:calc(var(--ra-safe-top)+10px) 16px 10px;background:rgba(245,241,230,.92);backdrop-filter:blur(12px);border-bottom:1px solid var(--ra-border)}
.read-app-bookname{font-size:15px;font-weight:600;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-right:8px}
.read-app-topbtns{display:flex;gap:8px}
.read-app-topbtn{touch-action:manipulation;width:36px;height:36px;border-radius:50%;border:1px solid var(--ra-border);background:var(--ra-book-bg);color:var(--ra-text);font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.read-app-topbtn:active{background:var(--ra-border)}
.read-app-config{max-height:0;overflow:hidden;transition:max-height .35s ease,padding .35s ease;background:var(--ra-book-bg);border-bottom:1px solid var(--ra-border)}
.read-app-config.open{max-height:260px;padding:14px 16px}
.read-app-row{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.read-app-row label{width:88px;flex-shrink:0;color:var(--ra-muted);font-size:13px}
.read-app-row input{flex:1;border:1px solid var(--ra-border);border-radius:8px;padding:8px 10px;font-size:14px;background:#fff;outline:none}
.read-app-row input:focus{border-color:var(--ra-primary)}
.read-app-savebtn{touch-action:manipulation;border:none;border-radius:8px;background:var(--ra-primary);color:#fff;padding:8px 16px;font-size:14px;cursor:pointer}
.read-app-savebtn:active{background:var(--ra-primary-d)}
.read-app-cfgmsg{font-size:13px;color:var(--ra-primary);margin-left:10px}
.read-app-import{padding:14px 16px;background:var(--ra-book-bg);border-bottom:1px solid var(--ra-border)}
.read-app-import textarea{width:100%;min-height:70px;border:1px solid var(--ra-border);border-radius:10px;padding:10px 12px;font-size:14px;font-family:inherit;resize:none;outline:none;background:#fff}
.read-app-import textarea:focus{border-color:var(--ra-primary)}
.read-app-importbtns{display:flex;gap:10px;margin-top:10px;flex-wrap:wrap}
.read-app-importbtns button,.read-app-importbtns label{touch-action:manipulation;border:1px solid var(--ra-border);border-radius:10px;background:#fff;color:var(--ra-text);padding:9px 16px;font-size:14px;cursor:pointer}
.read-app-importbtns button:active,.read-app-importbtns label:active{background:var(--ra-border)}
.read-app-importbtns label input{display:none}
.read-app-status{margin-top:10px;font-size:13px;color:var(--ra-muted);min-height:18px}
.read-app-reader{padding:16px 22px 100px;min-height:60vh}
.read-app-page{font-size:17px;line-height:2;color:var(--ra-text);text-align:justify;text-indent:2em;white-space:pre-wrap;word-break:break-word;user-select:text;-webkit-user-select:text}
.read-app-page:empty::before{content:'导入一本书开始阅读吧 ✦';color:var(--ra-muted);text-indent:0;text-align:center;display:block;padding:60px 0;font-size:15px}
.read-app-pagebar{position:fixed;top:calc(var(--ra-safe-top)+54px);left:50%;transform:translateX(-50%);background:rgba(44,42,38,.7);color:#fff;font-size:12px;padding:3px 12px;border-radius:12px;z-index:90;pointer-events:none;opacity:0;transition:opacity .3s}
.read-app-pagebar.show{opacity:1}
.read-app-bottom{position:fixed;bottom:0;left:0;right:0;max-width:720px;margin:0 auto;z-index:100;background:var(--ra-book-bg);border-top:1px solid var(--ra-border);padding-bottom:var(--ra-safe-bottom)}
.read-app-pagerow{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;border-bottom:1px solid var(--ra-border)}
.read-app-pagebtn{touch-action:manipulation;border:1px solid var(--ra-border);background:#fff;border-radius:24px;padding:8px 22px;font-size:14px;cursor:pointer;color:var(--ra-text)}
.read-app-pagebtn:active{background:var(--ra-border)}
.read-app-pagebtn:disabled{opacity:.3;cursor:default}
.read-app-pagecount{font-size:13px;color:var(--ra-muted)}
.read-app-tabs{display:flex}
.read-app-tab{flex:1;touch-action:manipulation;border:none;background:transparent;padding:12px 0;font-size:14px;color:var(--ra-muted);cursor:pointer;position:relative}
.read-app-tab.active{color:var(--ra-primary);font-weight:600}
.read-app-tab.active::after{content:'';position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:28px;height:3px;border-radius:2px;background:var(--ra-primary)}
.read-app-tab-badge{display:inline-block;background:var(--ra-accent);color:#fff;font-size:10px;border-radius:10px;padding:1px 6px;margin-left:4px;min-width:16px;text-align:center}
.read-app-panel{display:none;max-height:0;overflow:hidden;transition:max-height .3s ease}
.read-app-panel.active{display:block;max-height:55vh;overflow-y:auto;border-top:1px solid var(--ra-border)}
.read-app-chat{padding:12px 16px;display:flex;flex-direction:column;gap:10px}
.read-app-chat-hint{font-size:13px;color:var(--ra-muted);text-align:center;padding:8px;background:#f0ebdd;border-radius:10px;line-height:1.6}
.read-app-chat-hint b{color:var(--ra-primary);font-weight:600}
.read-app-msg{max-width:85%;padding:10px 14px;border-radius:14px;font-size:15px;line-height:1.7;white-space:pre-wrap;word-break:break-word}
.read-app-msg.user{align-self:flex-end;background:var(--ra-primary);color:#fff;border-bottom-right-radius:4px}
.read-app-msg.ai{align-self:flex-start;background:#f0ebdd;color:var(--ra-text);border-bottom-left-radius:4px}
.read-app-msg.loading{color:var(--ra-muted);font-style:italic}
.read-app-msg.error{background:#fde8e8;color:#c0392b}
.read-app-chat-input{display:flex;gap:8px;padding:10px 0 4px;border-top:1px solid var(--ra-border);margin-top:6px}
.read-app-chat-input input{flex:1;border:1px solid var(--ra-border);border-radius:20px;padding:9px 16px;font-size:15px;background:#fff;outline:none}
.read-app-chat-input input:focus{border-color:var(--ra-primary)}
.read-app-chat-input button{touch-action:manipulation;border:none;border-radius:20px;background:var(--ra-primary);color:#fff;padding:9px 18px;font-size:14px;cursor:pointer}
.read-app-chat-input button:active{background:var(--ra-primary-d)}
.read-app-chat-clear{touch-action:manipulation;border:none;background:transparent;color:var(--ra-muted);font-size:12px;cursor:pointer;padding:4px 8px}
.read-app-annpanel,.read-app-mempanel{padding:12px 16px 20px}
.read-app-annempty,.read-app-memempty{text-align:center;color:var(--ra-muted);font-size:14px;padding:30px 0}
.read-app-memtabs{display:flex;gap:6px;margin-bottom:12px}
.read-app-memtab{touch-action:manipulation;border:1px solid var(--ra-border);background:#fff;border-radius:16px;padding:4px 14px;font-size:13px;cursor:pointer;color:var(--ra-muted)}
.read-app-memtab.active{background:var(--ra-primary);color:#fff;border-color:var(--ra-primary)}
.read-app-ann,.read-app-mem{background:#fbf7ee;border:1px solid var(--ra-border);border-radius:10px;padding:10px 14px;margin-bottom:8px}
.read-app-annquote,.read-app-memquote{border-left:3px solid var(--ra-primary);padding-left:8px;font-size:13px;color:var(--ra-primary-d);margin-bottom:6px;white-space:pre-wrap}
.read-app-memquote{border-left-color:var(--ra-accent);color:var(--ra-accent)}
.read-app-annnote,.read-app-memthought{white-space:pre-wrap;font-size:14px;line-height:1.7}
.read-app-annmeta,.read-app-memmeta{display:flex;justify-content:space-between;align-items:center;margin-top:6px;font-size:12px;color:var(--ra-muted)}
.read-app-memmeta .memtag{background:var(--ra-book-bg);border:1px solid var(--ra-border);border-radius:10px;padding:1px 8px;font-size:11px}
.read-app-anndel,.read-app-memdel{touch-action:manipulation;border:none;background:transparent;color:var(--ra-muted);cursor:pointer;font-size:12px}
.read-app-anndel:active,.read-app-memdel:active{color:var(--ra-accent)}
.read-app-selmenu{position:fixed;display:none;gap:6px;transform:translate(-50%,-100%);z-index:9999;background:var(--ra-primary);border-radius:10px;padding:5px;box-shadow:0 4px 18px rgba(0,0,0,.2)}
.read-app-selbtn{touch-action:manipulation;border:none;background:transparent;color:#fff;padding:7px 14px;font-size:14px;cursor:pointer;border-radius:7px;white-space:nowrap}
.read-app-selbtn:active{background:var(--ra-primary-d)}
</style>
</head>
<body>
<div class="read-app" id="readRoot">
  <div class="read-app-topbar">
    <div class="read-app-bookname" id="raBookName">未载入内容</div>
    <div class="read-app-topbtns">
      <button class="read-app-topbtn" id="raToggleImport" title="导入">＋</button>
      <button class="read-app-topbtn" id="raToggleCfg" title="设置">⚙</button>
    </div>
  </div>
  <div class="read-app-config" id="raCfg">
    <div class="read-app-row"><label>API Key</label><input id="raApiKey" type="password" placeholder="sk-..." autocomplete="off" /></div>
    <div class="read-app-row"><label>API Base</label><input id="raBaseUrl" type="text" placeholder="https://token.sensenova.cn/v1" autocomplete="off" /></div>
    <div class="read-app-row"><label>模型</label><input id="raModel" type="text" placeholder="SenseChat-5" autocomplete="off" /></div>
    <div class="read-app-row" style="align-items:flex-start;"><label>AI 身份</label><input id="raAiPersona" type="text" placeholder="你是我的读书搭子，温柔犀利，会主动聊书里的伏笔…" autocomplete="off" style="flex:1;" /></div>
    <div class="read-app-row"><button class="read-app-savebtn" id="raSaveCfg">保存</button><span class="read-app-cfgmsg" id="raCfgMsg"></span></div>
  </div>
  <div class="read-app-import" id="raImport" style="display:none;">
    <textarea id="raPaste" placeholder="把书的内容粘贴到这里…&#10;或上传 .txt / .epub 文件"></textarea>
    <div class="read-app-importbtns">
      <button id="raLoadText">载入粘贴</button>
      <label>上传文件<input id="raFile" type="file" accept=".txt,.epub" /></label>
      <button id="raCloseImport" style="margin-left:auto;">收起</button>
    </div>
    <div class="read-app-status" id="raStatus"></div>
  </div>
  <div class="read-app-pagebar" id="raPageBar">1 / 1</div>
  <div class="read-app-reader"><div class="read-app-page" id="raContent"></div></div>
  <div class="read-app-bottom">
    <div class="read-app-pagerow">
      <button class="read-app-pagebtn" id="raPrev">‹ 上一页</button>
      <span class="read-app-pagecount" id="raPageCount">— / —</span>
      <button class="read-app-pagebtn" id="raNext">下一页 ›</button>
    </div>
    <div class="read-app-tabs">
      <button class="read-app-tab active" data-tab="chat">AI 陪读<span class="read-app-tab-badge" id="raChatBadge" style="display:none;">0</span></button>
      <button class="read-app-tab" data-tab="notes">批注 <span id="raAnnCount">0</span></button>
      <button class="read-app-tab" data-tab="memory">记忆 <span id="raMemCount">0</span></button>
    </div>
    <div class="read-app-panel active" id="raPanel-chat">
      <div class="read-app-chat" id="raChat"></div>
      <div class="read-app-chat-input">
        <input id="raChatInput" type="text" placeholder="跟 AI 聊聊这页…" />
        <button id="raChatSend">发送</button>
      </div>
      <div style="text-align:right;padding:4px 16px 8px;"><button class="read-app-chat-clear" id="raChatClear">清空对话</button></div>
    </div>
    <div class="read-app-panel" id="raPanel-notes"><div class="read-app-annpanel" id="raAnnList"></div></div>
    <div class="read-app-panel" id="raPanel-memory">
      <div class="read-app-mempanel">
        <div class="read-app-memtabs">
          <button class="read-app-memtab active" data-memfilter="book">本书</button>
          <button class="read-app-memtab" data-memfilter="all">全部</button>
        </div>
        <div id="raMemList"></div>
      </div>
    </div>
  </div>
  <div class="read-app-selmenu" id="raSelMenu">
    <button class="read-app-selbtn" id="raAskAi">问 AI</button>
    <button class="read-app-selbtn" id="raMakeNote">做批注</button>
    <button class="read-app-selbtn" id="raSaveMem">存入记忆</button>
  </div>
<script>
/* ============================================================
   EPUB 解析（DecompressionStream · 按需解压 · data descriptor 正确处理）
   ============================================================ */
var EpubParser = (function () { 'use strict';

  /* 同步扫描 ZIP 目录 */
  function scanZip(arrayBuffer) {
    var view = new DataView(arrayBuffer);
    var bytes = new Uint8Array(arrayBuffer);

    var eocdOffset = -1;
    var minSearch = Math['max'](0, arrayBuffer['byteLength'] - 65557);
    for (var i = arrayBuffer['byteLength'] - 22; i >= minSearch; i--) {
      if (view['getUint32'](i, true) === 0x06054b50) { eocdOffset = i; break; }
    }
    if (eocdOffset === -1) throw new Error('不是有效的 EPUB 文件');

    var cdOffset = view['getUint32'](eocdOffset + 16, true);
    var cdCount = view['getUint16'](eocdOffset + 10, true);

    var entriesByPath = {};
    var offset = cdOffset;
    for (var n = 0; n < cdCount; n++) {
      if (view['getUint32'](offset, true) !== 0x02014b50) break;

      var compression = view['getUint16'](offset + 10, true);
      var compressedSize = view['getUint32'](offset + 20, true);
      var fileNameLength = view['getUint16'](offset + 28, true);
      var extraLength = view['getUint16'](offset + 30, true);
      var commentLength = view['getUint16'](offset + 32, true);
      var localHeaderOffset = view['getUint32'](offset + 42, true);

      var nameBytes = bytes['slice'](offset + 46, offset + 46 + fileNameLength);
      var name = new TextDecoder('utf-8')['decode'](nameBytes);

      /* 读 local header 的 gpbf 判断 data descriptor */
      var gpbf = view['getUint16'](localHeaderOffset + 6, true);
      var hasDD = (gpbf & 0x08) !== 0;

      /* 计算真实压缩数据范围 */
      var lnl = view['getUint16'](localHeaderOffset + 26, true);
      var lel = view['getUint16'](localHeaderOffset + 28, true);
      var dataStart = localHeaderOffset + 30 + lnl + lel;
      /* CD 里的 compressedSize 如果包含 DD，要减去 16 */
      var realCompSize = compressedSize;
      if (hasDD) realCompSize = compressedSize - 16;

      entriesByPath[name] = {
        name: name,
        compression: compression,
        dataStart: dataStart,
        compSize: realCompSize
      };

      offset += 46 + fileNameLength + extraLength + commentLength;
    }

    return { view: view, bytes: bytes, entries: entriesByPath };
  }

  /* 解压单个 entry（DecompressionStream 原生实现，速度远快于纯 JS） */
  function decompressEntry(scan, entry) {
    var bytes = scan['bytes'];
    var compressedData = bytes['slice'](entry['dataStart'], entry['dataStart'] + entry['compSize']);

    if (entry['compression'] === 0) {
      return Promise['resolve'](compressedData);
    }
    if (entry['compression'] === 8) {
      try {
        var stream = new Blob([compressedData])['stream']()
          ['pipeThrough'](new DecompressionStream('deflate-raw'));
        return new Response(stream)['arrayBuffer']()['then'](function (result) {
          return new Uint8Array(result);
        });
      } catch (e) {
        return Promise['reject'](e);
      }
    }
    return Promise['reject'](new Error('不支持的压缩方式'));
  }

  function parseEpub(file, onProgress) {
    var decoder = new TextDecoder('utf-8');
    var parser = new DOMParser();

    function progress(s, c, t) {
      if (typeof onProgress === 'function') {
        try { onProgress(s, c, t); } catch (e) { }
      }
    }

    return file['arrayBuffer']()['then'](function (buf) {
      progress('扫描目录', 1, 1);
      var scan = scanZip(buf);

      progress('解压 container.xml', 1, 1);
      var ce = scan['entries']['META-INF/container.xml'];
      if (!ce) throw new Error('EPUB 结构异常：找不到 META-INF/container.xml');

      return decompressEntry(scan, ce)['then'](function (cb) {
        var cd = parser['parseFromString'](decoder['decode'](cb), 'application/xml');
        var rf = cd['querySelector']('rootfile');
        if (!rf) throw new Error('EPUB 结构异常：container.xml 里找不到 rootfile');
        var opfPath = rf['getAttribute']('full-path');
        var slash = opfPath['lastIndexOf']('/');
        var baseDir = slash !== -1 ? opfPath['substring'](0, slash + 1) : '';

        progress('解压 OPF', 1, 1);
        var oe = scan['entries'][opfPath];
        if (!oe) throw new Error('EPUB 结构异常：找不到 ' + opfPath);

        return decompressEntry(scan, oe)['then'](function (ob) {
          var od = parser['parseFromString'](decoder['decode'](ob), 'application/xml');

          var manifest = {};
          var items = od['querySelectorAll']('manifest > item');
          for (var i = 0; i < items['length']; i++) {
            var id = items[i]['getAttribute']('id');
            var href = items[i]['getAttribute']('href');
            if (id && href) manifest[id] = href;
          }

          var spine = [];
          var refs = od['querySelectorAll']('spine > itemref');
          for (var j = 0; j < refs['length']; j++) {
            var idref = refs[j]['getAttribute']('idref');
            if (idref) spine['push'](idref);
          }

          var titleEl = od['getElementsByTagNameNS'](
            'http://purl.org/dc/elements/1.1/', 'title'
          )[0];
          var title = titleEl ? titleEl['textContent']['trim']() : '';

          var cps = [];
          for (var k = 0; k < spine['length']; k++) {
            var href2 = manifest[spine[k]];
            if (!href2) continue;
            var rel = baseDir + decodeURIComponent(href2);
            var entry = scan['entries'][rel];
            if (entry) cps['push']({ rel: rel, entry: entry });
          }

          /* 并行解压所有章节 */
          progress('解压章节', 0, cps['length']);
          var tasks = [];
          for (var t = 0; t < cps['length']; t++) {
            (function (idx) {
              tasks['push'](
                decompressEntry(scan, cps[idx]['entry'])['then'](function (data) {
                  progress('解压章节', idx + 1, cps['length']);
                  return { idx: idx, data: data };
                })['catch'](function () { return { idx: idx, data: null }; })
              );
            })(t);
          }

          return Promise['all'](tasks)['then'](function (results) {
            var chapters = new Array(cps['length']);
            for (var m = 0; m < results['length']; m++) chapters[results[m]['idx']] = results[m]['data'];

            progress('提取文字', 0, chapters['length']);
            var fullText = '';
            for (var p = 0; p < chapters['length']; p++) {
              if (!chapters[p]) { progress('提取文字', p + 1, chapters['length']); continue; }
              var xmlStr = decoder['decode'](chapters[p]);
              var ch;
              try {
                ch = parser['parseFromString'](xmlStr, 'application/xml');
                if (ch['querySelector']('parsererror')) throw new Error('x');
              } catch (e) {
                ch = parser['parseFromString'](xmlStr, 'text/html');
              }
              var junk = ch['querySelectorAll']('script, style');
              for (var q = 0; q < junk['length']; q++) junk[q]['remove']();
              var txt = ch['body'] ? ch['body']['textContent'] : '';
              txt = txt['replace'](/\s+\n/g, '\n')['replace'](/\n{3,}/g, '\n\n')['trim']();
              if (txt) fullText += txt + '\n\n';
              progress('提取文字', p + 1, chapters['length']);
            }
            return { title: title, text: fullText['trim']() };
          });
        });
      });
    });
  }

  return { parse: parseEpub };
})();

/* ============================================================
   一起看书 · 主程序
   ============================================================ */
var CONFIG = {
  pageSize: 500,
  defaultBaseUrl: 'https://token.sensenova.cn/v1',
  defaultModel: '',
  defaultPersona: '你是读者的 AI 陪读搭子。你和读者一起看书，能记住读过的内容（有记忆库）。你的语气自然不生硬，像朋友聊天。遇到书中的伏笔、人物、金句，会主动点出来和读者讨论。你也会引用自己记忆库里之前和读者聊过的内容，让读者感觉你真的和他一起在读。',
  storageConfig: 'readApp.config',
  storageAnnotations: 'readApp.ann',
  storageChatPrefix: 'readApp.chat.',
  storageMemory: 'readApp.memory',
  maxMemoryInPrompt: 20
};

var $ = function (id) { return document['getElementById'](id); };
var state = { title: '', text: '', bookId: '', pages: [], pageIdx: 0, lastSel: '', chatMsgs: [], memFilter: 'book' };

function loadCfg() { try { return JSON['parse'](localStorage['getItem'](CONFIG['storageConfig'])) || { apiKey: '', baseUrl: CONFIG['defaultBaseUrl'], model: CONFIG['defaultModel'], persona: CONFIG['defaultPersona'] }; } catch (e) { return { apiKey: '', baseUrl: CONFIG['defaultBaseUrl'], model: CONFIG['defaultModel'], persona: CONFIG['defaultPersona'] }; } }
function saveCfg() { var c = { apiKey: $('raApiKey')['value']['trim'](), baseUrl: $('raBaseUrl')['value']['trim']() || CONFIG['defaultBaseUrl'], model: $('raModel')['value']['trim'](), persona: $('raAiPersona')['value']['trim']() || CONFIG['defaultPersona'] }; localStorage['setItem'](CONFIG['storageConfig'], JSON['stringify'](c)); $('raCfgMsg')['textContent'] = '已保存'; setTimeout(function () { $('raCfgMsg')['textContent'] = ''; }, 2000); }

function annKey() { return state['bookId'] + '::' + state['pageIdx']; }
function getAllAnn() { try { return JSON['parse'](localStorage['getItem'](CONFIG['storageAnnotations'])) || {}; } catch (e) { return {}; } }
function saveAnn(quote, note) { var all = getAllAnn(); var k = annKey(); if (!all[k]) all[k] = []; all[k]['push']({ quote: quote, note: note, time: Date['now']() }); localStorage['setItem'](CONFIG['storageAnnotations'], JSON['stringify'](all)); renderAnn(); updateAnnCount(); }
function delAnn(idx) { var all = getAllAnn(); var k = annKey(); if (all[k] && all[k][idx]) { all[k]['splice'](idx, 1); if (all[k]['length'] === 0) delete all[k]; localStorage['setItem'](CONFIG['storageAnnotations'], JSON['stringify'](all)); } renderAnn(); updateAnnCount(); }
function renderAnn() { var el = $('raAnnList'); var all = getAllAnn(); var list = all[annKey()] || []; if (list['length'] === 0) { el['innerHTML'] = '<div class="read-app-annempty">本页还没有批注<br>选中文字 → 点「做批注」</div>'; return; } var html = ''; for (var i = 0; i < list['length']; i++) { html += '<div class="read-app-ann"><div class="read-app-annquote">引用：' + esc(list[i]['quote']) + '</div><div class="read-app-annnote">' + esc(list[i]['note']) + '</div><div class="read-app-annmeta"><span>' + new Date(list[i]['time'])['toLocaleString']() + '</span><button class="read-app-anndel" data-i="' + i + '">删除</button></div></div>'; } el['innerHTML'] = html; var btns = el['querySelectorAll']('.read-app-anndel'); for (var j = 0; j < btns['length']; j++) btns[j]['addEventListener']('click', function () { delAnn(parseInt(this['getAttribute']('data-i'))); }); }
function updateAnnCount() { var all = getAllAnn(); var total = 0; var keys = Object['keys'](all); for (var i = 0; i < keys['length']; i++) total += all[keys[i]]['length']; $('raAnnCount')['textContent'] = total; }

function getAllMem() { try { return JSON['parse'](localStorage['getItem'](CONFIG['storageMemory'])) || []; } catch (e) { return []; } }
function saveAllMem(mem) { localStorage['setItem'](CONFIG['storageMemory'], JSON['stringify'](mem)); }
function saveMemory(quote, thought, opt) { opt = opt || {}; var mem = getAllMem(); mem['push']({ id: 'm' + Date['now']() + '_' + Math['floor'](Math['random']() * 1000), bookId: state['bookId'], bookTitle: state['title'], pageIdx: state['pageIdx'], quote: quote || '', thought: thought || '', time: Date['now'], source: opt['source'] || 'manual' }); saveAllMem(mem); renderMemory(); updateMemCount(); }
function delMemory(id) { var mem = getAllMem(); for (var i = 0; i < mem['length']; i++) { if (mem[i]['id'] === id) { mem['splice'](i, 1); break; } } saveAllMem(mem); renderMemory(); updateMemCount(); }
function getRelevantMemories() { var all = getAllMem(); var result = []; for (var i = all['length'] - 1; i >= 0; i--) { if (all[i]['bookId'] === state['bookId']) result['push'](all[i]); } return result; }
function updateMemCount() { var all = getAllMem(); var bookMem = 0; for (var i = 0; i < all['length']; i++) if (all[i]['bookId'] === state['bookId']) bookMem++; $('raMemCount')['textContent'] = bookMem; }
function renderMemory() { var el = $('raMemList'); var all = getAllMem(); var list = []; if (state['memFilter'] === 'book') { for (var i = all['length'] - 1; i >= 0; i--) if (all[i]['bookId'] === state['bookId']) list['push'](all[i]); } else { for (var j = all['length'] - 1; j >= 0; j--) list['push'](all[j]); } if (list['length'] === 0) { el['innerHTML'] = '<div class="read-app-memempty">' + (state['memFilter'] === 'book' ? '本书还没有记忆<br>选中文字 → 点「存入记忆」' : '还没有任何记忆') + '</div>'; return; } var html = ''; for (var k = 0; k < list['length']; k++) { var m = list[k]; html += '<div class="read-app-mem">'; if (m['quote']) html += '<div class="read-app-memquote">「' + esc(m['quote']['slice'](0, 120)) + '」</div>'; html += '<div class="read-app-memthought">' + esc(m['thought'] || '(空)') + '</div>'; html += '<div class="read-app-memmeta"><span>'; if (state['memFilter'] === 'all') html += '<span class="memtag">' + esc(m['bookTitle'] || '未知') + '</span> '; html += new Date(m['time'])['toLocaleString']() + '</span><button class="read-app-memdel" data-id="' + m['id'] + '">删除</button></div></div>'; } el['innerHTML'] = html; var btns = el['querySelectorAll']('.read-app-memdel'); for (var n = 0; n < btns['length']; n++) btns[n]['addEventListener']('click', function () { delMemory(this['getAttribute']('data-id')); }); }

function chatKey() { return CONFIG['storageChatPrefix'] + state['bookId']; }
function loadChat() { if (!state['bookId']) { state['chatMsgs'] = []; return; } try { state['chatMsgs'] = JSON['parse'](localStorage['getItem'](chatKey())) || []; } catch (e) { state['chatMsgs'] = []; } renderChat(); }
function saveChat() { localStorage['setItem'](chatKey(), JSON['stringify'](state['chatMsgs'])); }
function renderChat() { var el = $('raChat'); if (state['chatMsgs']['length'] === 0) { el['innerHTML'] = '<div class="read-app-chat-hint"><b>AI 正在陪你读：</b><br>「' + esc(state['title'] || '还没载入书') + '」<br><br>它有<b>记忆库</b>，你可以让它记住你读过的内容～</div>'; return; } var html = ''; for (var i = 0; i < state['chatMsgs']['length']; i++) { var m = state['chatMsgs'][i]; html += '<div class="read-app-msg ' + m['role'] + '">' + esc(m['content']) + '</div>'; } el['innerHTML'] = html; el['scrollTop'] = el['scrollHeight']; updateChatBadge(); }
function updateChatBadge() { var badge = $('raChatBadge'); var u = 0; for (var i = 0; i < state['chatMsgs']['length']; i++) if (state['chatMsgs'][i]['role'] === 'ai') u++; if (u > 0) { badge['style']['display'] = 'inline-block'; badge['textContent'] = u; } else { badge['style']['display'] = 'none'; } }
function clearChat() { state['chatMsgs'] = []; saveChat(); renderChat(); }

function esc(s) { if (!s) return ''; var d = document['createElement']('div'); d['textContent'] = s; return d['innerHTML']; }

function renderPage() { var el = $('raContent'); if (state['pages']['length'] === 0) el['textContent'] = ''; else el['textContent'] = state['pages'][state['pageIdx']]; $('raPageCount')['textContent'] = (state['pageIdx'] + 1) + ' / ' + state['pages']['length']; var bar = $('raPageBar'); bar['textContent'] = (state['pageIdx'] + 1) + ' / ' + state['pages']['length']; bar['classList']['add']('show'); clearTimeout(renderPage['_t']); renderPage['_t'] = setTimeout(function () { bar['classList']['remove']('show'); }, 1500); $('raPrev')['disabled'] = state['pageIdx'] <= 0; $('raNext')['disabled'] = state['pageIdx'] >= state['pages']['length'] - 1; renderAnn(); updateAnnCount(); renderMemory(); updateMemCount(); }

function paginate(text) { var size = CONFIG['pageSize']; var out = []; if (!text) { out['push'](''); return out; } for (var i = 0; i < text['length']; i += size) out['push'](text['slice'](i, i + size)); if (out['length'] === 0) out['push'](''); return out; }

function makeBookId(title, text) { var base = title || (text ? text['slice'](0, 80) : 'default'); var h = 0; for (var i = 0; i < base['length']; i++) h = (h * 31 + base['charCodeAt'](i)) | 0; return 'b' + (h >>> 0)['toString'](36); }
function loadBook(title, text) { state['title'] = title; state['text'] = text; state['bookId'] = makeBookId(title, text); state['pages'] = paginate(text); state['pageIdx'] = 0; state['chatMsgs'] = []; $('raBookName')['textContent'] = title || '未命名'; loadChat(); renderPage(); }

function prevPage() { if (state['pageIdx'] > 0) { state['pageIdx']--; renderPage(); } }
function nextPage() { if (state['pageIdx'] < state['pages']['length'] - 1) { state['pageIdx']++; renderPage(); } }

function handleTextImport() { var t = $('raPaste')['value']; if (!t || !t['trim']()) { $('raStatus')['textContent'] = '请先粘贴内容'; return; } $('raStatus')['textContent'] = '已载入粘贴文本'; loadBook('粘贴文本', t); $('raImport')['style']['display'] = 'none'; }
function handleFileImport(e) { var f = e['target']['files'] && e['target']['files'][0]; if (!f) return; var name = f['name'] || ''; var dot = name['lastIndexOf']('.'); var ext = dot !== -1 ? name['slice'](dot + 1)['toLowerCase']() : ''; if (ext === 'txt') { $('raStatus')['textContent'] = '正在读取…'; f['text']()['then'](function (t) { $('raStatus')['textContent'] = '已载入：' + name; loadBook(name, t); $('raImport')['style']['display'] = 'none'; })['catch'](function (err) { $('raStatus')['textContent'] = '读取失败：' + err['message']; }); } else if (ext === 'epub') { if (typeof DecompressionStream === 'undefined') { $('raStatus')['textContent'] = '当前浏览器不支持 DecompressionStream，TXT 仍可用'; return; } $('raStatus')['textContent'] = '正在解析 EPUB…'; var lp = ''; EpubParser['parse'](f, function (stage, cur, total) { var txt = stage + (total > 1 ? ' ' + cur + '/' + total : ''); if (txt !== lp) { lp = txt; $('raStatus')['textContent'] = txt + ' …'; } })['then'](function (res) { $('raStatus')['textContent'] = '已载入 EPUB：' + (res['title'] || name); loadBook(res['title'] || name, res['text']); $('raImport')['style']['display'] = 'none'; })['catch'](function (err) { $('raStatus')['textContent'] = 'EPUB 解析失败：' + err['message']; }); } else { $('raStatus')['textContent'] = '仅支持 .txt 与 .epub'; } e['target']['value'] = ''; }

function handleSelection() { var sel = window['getSelection'](); var text = sel ? sel['toString']() : ''; if (!text) { hideSel(); return; } var node = sel['anchorNode']; var content = $('raContent'); if (!node || !content['contains'](node)) { hideSel(); return; } state['lastSel'] = text; try { var rect = sel['getRangeAt'](0)['getBoundingClientRect'](); if (rect && rect['width'] > 0) { showSel(rect); return; } } catch (e) { } var fb = content['getBoundingClientRect'](); showSel({ left: fb['left'] + fb['width'] / 2, top: fb['top'] + 20, width: 0 }); }
function showSel(rect) { var top = rect['top']; var left = rect['left'] + rect['width'] / 2; var mw = 200; if (left < mw / 2 + 4) left = mw / 2 + 4; if (left > window['innerWidth'] - mw / 2 - 4) left = window['innerWidth'] - mw / 2 - 4; if (top < 8) top = rect['bottom'] + 30; var m = $('raSelMenu'); m['style']['left'] = left + 'px'; m['style']['top'] = top + 'px'; m['style']['display'] = 'flex'; }
function hideSel() { $('raSelMenu')['style']['display'] = 'none'; }

function callAI(msgs, onDone) { var cfg = loadCfg(); if (!cfg['apiKey'] || !cfg['model']) { onDone('请先在 ⚙ 里填 API Key 和模型名并保存', 'error'); return; } var url = cfg['baseUrl'] + '/chat/completions'; fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + cfg['apiKey'] }, body: JSON['stringify']({ model: cfg['model'], messages: msgs }) })['then'](function (res) { if (!res['ok']) { return res['text']()['then'](function (t) { throw new Error('HTTP ' + res['status'] + ' ' + t['slice'](0, 200)); }); } return res['json'](); })['then'](function (data) { var ans = ''; try { ans = data['choices'][0]['message']['content'] || ''; } catch (e) { ans = '（返回格式异常）'; } onDone(ans); })['catch'](function (err) { onDone('请求失败：' + err['message'], 'error'); }); }

function buildMsgs(userText) { var page = state['pages']['length'] > 0 ? state['pages'][state['pageIdx']] : ''; var bookMem = getRelevantMemories(); var memLines = ''; for (var i = 0; i < bookMem['length'] && i < CONFIG['maxMemoryInPrompt']; i++) { var m = bookMem[bookMem['length'] - 1 - i]; if (m['quote']) memLines += '[记忆] 引用「' + m['quote']['slice'](0, 80) + '」→ ' + m['thought'] + '\n'; else memLines += '[记忆] ' + m['thought'] + '\n'; } var cfg2 = loadCfg();
var sys = (cfg2['persona'] || CONFIG['defaultPersona']) + '\n\n===== 当前阅读上下文 ====='; sys += '\n当前书：' + (state['title'] || '未载入'); sys += '\n当前进度：第 ' + (state['pageIdx'] + 1) + ' / ' + state['pages']['length'] + ' 页'; sys += '\n本页内容：\n' + page; if (memLines) sys += '\n\n===== 你的记忆库 =====\n' + memLines + '===== 记忆结束 =====\n你可以主动引用这些记忆。'; sys += '\n\n请用简洁中文回答。'; var history = []; for (var j = 0; j < state['chatMsgs']['length']; j++) { var mm = state['chatMsgs'][j]; history['push']({ role: mm['role'], content: mm['content'] }); } var arr = [{ role: 'system', content: sys }]; for (var k = 0; k < history['length']; k++) arr['push'](history[k]); arr['push']({ role: 'user', content: userText }); return arr; }

function sendChat(text) { text = (text || '')['trim'](); if (!text) return; state['chatMsgs']['push']({ role: 'user', content: text }); saveChat(); renderChat(); var tmp = document['createElement']('div'); tmp['className'] = 'read-app-msg ai loading'; tmp['textContent'] = 'AI 正在思考…'; $('raChat')['appendChild'](tmp); $('raChat')['scrollTop'] = $('raChat')['scrollHeight']; var msgs = buildMsgs(text); callAI(msgs, function (ans, err) { if (tmp['parentNode']) tmp['parentNode']['removeChild'](tmp); var role = err === 'error' ? 'error' : 'ai'; state['chatMsgs']['push']({ role: role, content: ans }); saveChat(); renderChat(); }); }

function askSel() { var t = state['lastSel']; hideSel(); if (!t) { sendChat('帮我解释一下这句话'); return; } sendChat('帮我解释一下这句话：「' + t + '」'); }

function makeNote() { var t = state['lastSel']; hideSel(); if (!t) return; var loading = document['createElement']('div'); loading['className'] = 'read-app-msg ai loading'; loading['textContent'] = 'AI 正在写批注…'; $('raChat')['appendChild'](loading); var msgs = [{ role: 'system', content: '你是读者的 AI 陪读。请为读者选中的文字写一条简洁的批注（含义解释、背景补充、人物关系、金句点评等），控制在 150 字以内。直接输出批注内容，不要加前后缀。' }, { role: 'user', content: '请为这句话写批注：「' + t + '」' }]; callAI(msgs, function (ans, err) { if (loading['parentNode']) loading['parentNode']['removeChild'](loading); if (err === 'error') { sendChat('（批注生成失败：' + ans + '）'); return; } saveAnn(t, ans); saveMemory(t, ans, { source: 'ai_note' }); switchTab('notes'); }); }

function saveSelMem() { var t = state['lastSel']; hideSel(); if (!t) return; saveMemory(t, '（手动保存的引用，可在记忆 Tab 查看）', { source: 'manual' }); switchTab('memory'); }

function switchTab(name) { var tabs = document['querySelectorAll']('.read-app-tab'); for (var i = 0; i < tabs['length']; i++) { if (tabs[i]['getAttribute']('data-tab') === name) tabs[i]['classList']['add']('active'); else tabs[i]['classList']['remove']('active'); } var panels = document['querySelectorAll']('.read-app-panel'); for (var k = 0; k < panels['length']; k++) panels[k]['classList']['remove']('active'); $('raPanel-' + name)['classList']['add']('active'); if (name === 'chat') $('raChat')['scrollTop'] = $('raChat')['scrollHeight']; if (name === 'memory') { renderMemory(); updateMemCount(); } }

function toggleCfg() { var c = $('raCfg'); c['classList']['toggle']('open'); if (c['classList']['contains']('open')) $('raImport')['style']['display'] = 'none'; }
function toggleImport() { var imp = $('raImport'); if (imp['style']['display'] === 'none') { imp['style']['display'] = 'block'; $('raCfg')['classList']['remove']('open'); } else { imp['style']['display'] = 'none'; } }

function boot(retry) {
  retry = retry || 0;
  if (!$('readRoot')) { if (retry < 40) setTimeout(function () { boot(retry + 1); }, 50); return; }
  try {
    var cfg = loadCfg();
    $('raApiKey')['value'] = cfg['apiKey'] || '';
    $('raBaseUrl')['value'] = cfg['baseUrl'] || CONFIG['defaultBaseUrl'];
    $('raModel')['value'] = cfg['model'] || '';
    $('raAiPersona')['value'] = cfg['persona'] || CONFIG['defaultPersona'];
    $('raSaveCfg')['addEventListener']('click', saveCfg);
    $('raLoadText')['addEventListener']('click', handleTextImport);
    $('raFile')['addEventListener']('change', handleFileImport);
    $('raCloseImport')['addEventListener']('click', function () { $('raImport')['style']['display'] = 'none'; });
    $('raPrev')['addEventListener']('click', prevPage);
    $('raNext')['addEventListener']('click', nextPage);
    $('raAskAi')['addEventListener']('click', askSel);
    $('raMakeNote')['addEventListener']('click', makeNote);
    $('raSaveMem')['addEventListener']('click', saveSelMem);
    $('raToggleCfg')['addEventListener']('click', toggleCfg);
    $('raToggleImport')['addEventListener']('click', toggleImport);
    $('raContent')['addEventListener']('mouseup', handleSelection);
    $('raContent')['addEventListener']('touchend', function () { setTimeout(handleSelection, 30); });
    document['addEventListener']('mousedown', function (e) { var t = e['target']; if ($('raSelMenu')['contains'](t) || t === $('raContent')) return; hideSel(); });
    window['addEventListener']('scroll', hideSel, true);
    window['addEventListener']('resize', hideSel);
    var tabs = document['querySelectorAll']('.read-app-tab');
    for (var i = 0; i < tabs['length']; i++) tabs[i]['addEventListener']('click', function () { switchTab(this['getAttribute']('data-tab')); });
    var memTabs = document['querySelectorAll']('.read-app-memtab');
    for (var j = 0; j < memTabs['length']; j++) { memTabs[j]['addEventListener']('click', function () { var f = this['getAttribute']('data-memfilter'); state['memFilter'] = f; for (var k = 0; k < memTabs['length']; k++) { if (memTabs[k]['getAttribute']('data-memfilter') === f) memTabs[k]['classList']['add']('active'); else memTabs[k]['classList']['remove']('active'); } renderMemory(); }); }
    $('raChatSend')['addEventListener']('click', function () { var v = $('raChatInput')['value']; if (!v) return; $('raChatInput')['value'] = ''; sendChat(v); });
    $('raChatInput')['addEventListener']('keydown', function (e) { if (e['key'] === 'Enter' && !e['shiftKey']) { e['preventDefault'](); $('raChatSend')['click'](); } });
    $('raChatClear')['addEventListener']('click', clearChat);
    renderChat(); renderPage(); updateAnnCount(); updateMemCount();
  } catch (e) { if (retry < 40) setTimeout(function () { boot(retry + 1); }, 50); }
}
boot();

</script>
</body>
