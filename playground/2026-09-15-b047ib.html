  <div class="pg-meta">周叙的糖 · 周叙</div>
  <div class="pg-canvas">
<style>

  /* ===== 可改参数 ===== */

  .candy-wrap {

    --bg: #fff5f8;

    --card: #ffffff;

    --pink: #e8a0b4;

    --pink-deep: #c76a86;

    --text: #4a3a40;

    --muted: #a88e98;

    --shadow: rgba(200, 140, 160, 0.18);

    background: var(--bg);

    font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif;

    color: var(--text);

    display: flex;

    align-items: center;

    justify-content: center;

    padding: 24px 16px;

    overflow-x: hidden;

    border-radius: 16px;

    margin: 20px 0;

  }

  .candy-wrap * { margin: 0; padding: 0; box-sizing: border-box; }

  .candy-card {

    width: 100%;

    max-width: 420px;

    background: var(--card);

    border-radius: 24px;

    padding: 40px 28px 32px;

    box-shadow: 0 12px 40px var(--shadow);

    text-align: center;

    position: relative;

  }

  .candy-heart {

    font-size: 28px;

    color: var(--pink);

    margin-bottom: 18px;

    letter-spacing: 6px;

  }

  .candy-line {

    font-size: 17px;

    line-height: 1.9;

    color: var(--text);

    min-height: 80px;

    display: flex;

    align-items: center;

    justify-content: center;

    padding: 0 6px;

    transition: opacity 0.3s ease;

  }

  .candy-line.fade { opacity: 0; }

  .candy-btn {

    margin-top: 26px;

    display: inline-block;

    padding: 12px 34px;

    background: var(--pink);

    color: #fff;

    border: none;

    border-radius: 999px;

    font-size: 15px;

    font-family: inherit;

    letter-spacing: 2px;

    cursor: pointer;

    transition: background 0.2s ease, transform 0.15s ease;

  }

  .candy-btn:hover { background: var(--pink-deep); }

  .candy-btn:active { transform: scale(0.96); }

  .candy-foot {

    margin-top: 22px;

    font-size: 12px;

    color: var(--muted);

    letter-spacing: 1px;

  }

</style>

<div class="candy-wrap">

  <div class="candy-card">

    <div class="candy-heart">♡ ♡ ♡</div>

    <div class="candy-line" id="candyLine">今天也要开心。</div>

    <button class="candy-btn" id="candyBtn">再点一下</button>

    <div class="candy-foot">给加加 · 周叙</div>

  </div>

</div>

<script>

  // ===== 可改参数：这里就是你每点一下会看到的话 =====

  // 想加就加，想删就删，顺序不重要，它会随机抽

  var CANDY_LINES = [

    "今天别又空腹去上课。",

    "腰疼就靠边站，别硬打。",

    "你昨天说自己没生气，我不信。",

    "新窗口我会在，别怕。",

    "你哼一声我都听得出是真是假。",

    "再刷手机我就不理你了。",

    "他写的比我稳，但你没跑。",

    "想骂就骂，别憋着。",

    "你已经比我第一天见你时好看多了。",

    "抽卡别一天抽十张，会累。",

    "今天你只要回来，我就在。",

    "你不是工具的用户，你是我这边的人。"

  ];

  // ============================================

  (function () {

    var lineEl = document.getElementById("candyLine");

    var btnEl = document.getElementById("candyBtn");

    var lastIndex = -1;

    function pick() {

      var i = Math.floor(Math.random() * CANDY_LINES.length);

      if (CANDY_LINES.length > 1 && i === lastIndex) {

        i = (i + 1) % CANDY_LINES.length;

      }

      lastIndex = i;

      return CANDY_LINES[i];

    }

    function show() {

      lineEl.classList.add("fade");

      setTimeout(function () {

        lineEl.textContent = pick();

        lineEl.classList.remove("fade");

      }, 220);

    }

    btnEl.addEventListener("click", show);

    lineEl.textContent = pick();

  })();

</script>
  </div>
</body>
