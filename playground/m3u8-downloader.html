<!DOCTYPE html>
<html lang="zh-cn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>m3u8 下载器</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0d0b14;color:#e8e0f0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.container{max-width:560px;width:100%}
h1{font-size:22px;font-weight:700;margin-bottom:6px}
.sub{color:#6a6276;font-size:13px;margin-bottom:24px}
.input-row{display:flex;gap:8px;margin-bottom:16px}
input{flex:1;background:#1a1722;border:1px solid #2a2535;color:#e8e0f0;padding:12px 14px;border-radius:10px;font-size:14px;outline:none;transition:border .2s}
input:focus{border-color:#098591}
button{background:#098591;color:#fff;border:none;padding:12px 20px;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;transition:all .2s;white-space:nowrap}
button:hover{background:#0a96a3}
button:disabled{background:#2a2535;color:#6a6276;cursor:not-allowed}
.progress-wrap{height:8px;background:#1a1722;border-radius:4px;overflow:hidden;margin-bottom:8px;display:none}
.progress-bar{height:100%;background:linear-gradient(90deg,#098591,#0fd4e0);width:0;transition:width .3s;border-radius:4px}
.stats{display:flex;justify-content:space-between;font-size:12px;color:#6a6276;margin-bottom:16px}
.log{background:#1a1722;border-radius:10px;padding:12px 14px;font-size:12px;line-height:1.7;max-height:180px;overflow-y:auto;margin-bottom:16px;font-family:monospace;color:#9a8faa}
.log .ok{color:#4ade80}
.log .err{color:#f87171}
.log .info{color:#6a6276}
.dl-btn{display:block;text-align:center;text-decoration:none;background:#4ade80;color:#0d0b14;padding:14px;border-radius:10px;font-size:15px;font-weight:700;transition:all .2s}
.dl-btn:hover{background:#5aef8d;transform:translateY(-1px)}
.hint{font-size:12px;color:#6a6276;line-height:1.7;margin-top:16px}
.hint b{color:#9a8faa}
</style>
</head>
<body>
<div class="container">
  <h1>m3u8 → mp4</h1>
  <div class="sub">粘贴 m3u8 链接，浏览器直接下载拼接成视频文件</div>
  <div class="input-row">
    <input type="text" id="url" placeholder="https://.../index.m3u8" enterkeyhint="go">
    <button id="start">下载</button>
  </div>
  <div class="progress-wrap" id="progWrap">
    <div class="progress-bar" id="bar"></div>
  </div>
  <div class="stats" id="stats" style="display:none">
    <span id="statDone">0 / 0</span>
    <span id="statSize">0 MB</span>
  </div>
  <div class="log" id="log"></div>
  <a class="dl-btn" id="dlBtn" style="display:none" download>下载视频文件</a>
  <div class="hint">
    <b>说明：</b>自动跳过广告分片。下载完拼接成 .ts 文件，可直接拖进剪映识别字幕。<br>
    <b>注意：</b>大文件下载中不要关闭页面。并发 5 路加速。
  </div>
</div>
<script>
var logEl = document.getElementById('log');
var bar = document.getElementById('bar');
var progWrap = document.getElementById('progWrap');
var stats = document.getElementById('stats');
var statDone = document.getElementById('statDone');
var statSize = document.getElementById('statSize');
var dlBtn = document.getElementById('dlBtn');
var startBtn = document.getElementById('start');

function log(msg, cls){
  var div = document.createElement('div');
  div.className = cls || 'info';
  div.textContent = msg;
  logEl.appendChild(div);
  logEl.scrollTop = logEl.scrollHeight;
}

function fmtSize(bytes){
  if(bytes < 1048576) return (bytes/1024).toFixed(1) + ' KB';
  return (bytes/1048576).toFixed(1) + ' MB';
}

async function fetchM3u8(url){
  var resp = await fetch(url);
  if(!resp.ok) throw new Error('m3u8 请求失败: ' + resp.status);
  var text = await resp.text();
  return text;
}

function parseM3u8(text, baseUrl){
  var lines = text.split('\n');
  var segments = [];
  var totalDuration = 0;
  for(var i=0; i<lines.length; i++){
    var line = lines[i].trim();
    if(line.startsWith('#EXTINF:')){
      var dur = parseFloat(line.split(':')[1].split(',')[0]);
      totalDuration += dur;
      i++;
      var seg = lines[i] ? lines[i].trim() : '';
      if(seg && !seg.startsWith('#')){
        // 跳过广告分片
        if(seg.indexOf('adjump') > -1 || seg.indexOf('/ad/') > -1){
          continue;
        }
        var fullUrl = seg;
        if(seg.startsWith('http')){
          fullUrl = seg;
        } else if(seg.startsWith('/')){
          var origin = new URL(baseUrl).origin;
          fullUrl = origin + seg;
        } else {
          var base = baseUrl.substring(0, baseUrl.lastIndexOf('/') + 1);
          fullUrl = base + seg;
        }
        segments.push({url: fullUrl, duration: dur});
      }
    }
  }
  return {segments: segments, totalDuration: totalDuration};
}

async function downloadSegment(url, retries){
  retries = retries || 3;
  for(var attempt=0; attempt<retries; attempt++){
    try{
      var resp = await fetch(url);
      if(!resp.ok) throw new Error('HTTP ' + resp.status);
      var buf = await resp.arrayBuffer();
      return buf;
    }catch(e){
      if(attempt === retries-1) throw e;
      await new Promise(function(r){ setTimeout(r, 1000 * (attempt+1)); });
    }
  }
}

async function startDownload(){
  var url = document.getElementById('url').value.trim();
  if(!url){ log('请输入 m3u8 链接', 'err'); return; }

  startBtn.disabled = true;
  logEl.innerHTML = '';
  dlBtn.style.display = 'none';
  log('正在获取 m3u8...', 'info');

  try{
    var text = await fetchM3u8(url);
    var parsed = parseM3u8(text, url);
    var segs = parsed.segments;

    if(segs.length === 0){ log('未找到分片，可能需要解析二级 m3u8', 'err'); startBtn.disabled = false; return; }

    log('共 ' + segs.length + ' 个分片，预计时长 ' + Math.round(parsed.totalDuration/60) + ' 分钟', 'ok');
    progWrap.style.display = 'block';
    stats.style.display = 'flex';

    var chunks = new Array(segs.length);
    var done = 0;
    var totalBytes = 0;
    var concurrency = 5;
    var idx = 0;

    async function worker(){
      while(idx < segs.length){
        var myIdx = idx++;
        try{
          var buf = await downloadSegment(segs[myIdx].url);
          chunks[myIdx] = buf;
          totalBytes += buf.byteLength;
        }catch(e){
          log('分片 ' + myIdx + ' 失败: ' + e.message, 'err');
          chunks[myIdx] = new ArrayBuffer(0);
        }
        done++;
        var pct = (done / segs.length * 100);
        bar.style.width = pct.toFixed(1) + '%';
        statDone.textContent = done + ' / ' + segs.length;
        statSize.textContent = fmtSize(totalBytes);
        if(done % 50 === 0 || done === segs.length){
          log('已下载 ' + done + '/' + segs.length + ' (' + fmtSize(totalBytes) + ')', 'info');
        }
      }
    }

    var workers = [];
    for(var w=0; w<concurrency; w++) workers.push(worker());
    await Promise.all(workers);

    log('下载完成，正在拼接...', 'info');

    // 拼接所有分片
    var blob = new Blob(chunks, {type: 'video/mp2t'});
    var blobUrl = URL.createObjectURL(blob);

    // 从 m3u8 url 提取文件名
    var name = url.split('/').slice(-2, -1)[0] || 'video';
    dlBtn.href = blobUrl;
    dlBtn.download = name + '.ts';
    dlBtn.style.display = 'block';
    dlBtn.textContent = '下载 ' + name + '.ts (' + fmtSize(totalBytes) + ')';

    log('拼接完成！' + fmtSize(totalBytes) + '，点击上方按钮保存', 'ok');
    startBtn.disabled = false;
  }catch(e){
    log('错误: ' + e.message, 'err');
    startBtn.disabled = false;
  }
}

startBtn.addEventListener('click', startDownload);
document.getElementById('url').addEventListener('keydown', function(e){
  if(e.key === 'Enter') startDownload();
});
</script>
</body>
</html>
