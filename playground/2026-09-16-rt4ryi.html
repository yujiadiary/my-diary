<style>

  /* ============================================================

  .macaron-snake,

  .macaron-snake *,

  .macaron-snake *::before,

  /* 颜色变量：想换色改这里 */

    --ms-bg-1: #FFF7F4;

    --ms-bg-2: #F1EEFF;

    --ms-card: #FFFFFF;

    --ms-ink: #5B5468;

    --ms-shadow: 0 10px 30px rgba(180, 160, 200, 0.16);

    display: flex;

    background: linear-gradient(160deg, var(--ms-bg-1) 0%, var(--ms-bg-2) 100%);

  /* 每个直接子元素都不许被外部 flex 压扁 */

  /* ---------- 标题 ---------- */

  /* ---------- 棋盘 ---------- */

  .macaron-snake .ms-stage {

    position: relative;

    width: 100%;

    padding: 10px;

  /* ---------- 按钮 ---------- */

  .macaron-snake .ms-btn-main:active { transform: translateY(0) scale(0.97); }

  .macaron-snake .ms-btn-ghost {

    background: var(--ms-card);

  /* ---------- 方向键 ---------- */

  .macaron-snake .ms-pad-btn:hover {

  .macaron-snake .ms-pad-btn:active {

  .macaron-snake .ms-pad-btn svg { display: block; }

  .macaron-snake .ms-pad-btn[data-dir="right"] svg { transform: rotate(90deg); }

  .macaron-snake .ms-pad-btn[data-dir="up"]    { grid-area: 1 / 2; }

  .macaron-snake .ms-pad-btn[data-dir="left"]  { grid-area: 2 / 1; }

  .macaron-snake .ms-pad-dot {

  .macaron-snake .ms-pad-dot::after {

    content: "";

    width: 14px;

    height: 14px;

    border-radius: 50%;

    background: linear-gradient(135deg, #FFD9E2, #D9DDF5);

  }

  /* ---------- 底部说明 ---------- */

  .macaron-snake .ms-tip {

    margin: 0;

    font-size: 12px;

  }

  @media (max-width: 380px) {

    .macaron-snake .ms-title { font-size: 21px; }

  }

</style>

<script>

(function () {

  'use strict';

  /* ============================================================

     可调参数区：想改数值直接改这里

     ============================================================ */

  var CONFIG = {

    cols: 15,            // 横向格数

    rows: 15,            // 纵向格数

    maxBoardPx: 440,     // 棋盘最大显示边长（像素）

    baseSpeed: 175,      // 初始速度：每步毫秒数，越小越快

    minSpeed: 85,        // 最快速度上限

    speedStep: 4,        // 每吃一颗爱心加速多少毫秒

    startLen: 3,         // 开局蛇长

    cornerRatio: 0.3,    // 蛇身圆角比例

    insetRatio: 0.06     // 蛇身每节向内收缩比例

  };

  // 配色（马卡龙色系）

  var COLOR = {

    boardBg: '#FFFDFB',   // 棋盘底色

    boardAlt: '#FBF1F6',  // 棋盘淡格

    snakeHead: '#7ED6B5', // 蛇头（薄荷绿）

    snakeTail: '#C7CEEA', // 蛇尾（淡紫蓝）

    food: '#FF9FB2',      // 爱心（樱花粉）

    eye: '#4A4453',

    blush: '#FFB7C5'

  };

  // 文案

  var TEXT = {

    idleTitle: '准备好了吗',

    idleText: '点「开始」，喂小蛇吃爱心',

    pauseTitle: '暂停中',

    pauseText: '点「继续」接着玩',

    overTitle: '撞到啦',

    overEmpty: '一颗爱心都没吃到，再试一次吧',

    overScore: function (n) { return '这局吃了 ' + n + ' 颗爱心'; },

    newBest: '　新纪录！'

  };

  // localStorage 键名：只存历史最高分（一个整数），纯本地。

  // 不存任何账号、密码、隐私文本。清空浏览器数据即被清除。

  var BEST_KEY = 'macaron-snake-best-v1';

  var canvas    = document.getElementById('ms-board');

  var ctx       = canvas.getContext('2d');

  var stageEl   = document.getElementById('ms-stage');

  var overlay   = document.getElementById('ms-overlay');

  var ovTitle   = document.getElementById('ms-ov-title');

  var ovText    = document.getElementById('ms-ov-text');

  var scoreEl   = document.getElementById('ms-score');

  var bestEl    = document.getElementById('ms-best');

  var btnMain   = document.getElementById('ms-btn-main');

  var btnReset  = document.getElementById('ms-btn-reset');

  var pad       = document.getElementById('ms-pad');

  var DIRS = {

    up:    { x: 0,  y: -1 },

    down:  { x: 0,  y: 1  },

    left:  { x: -1, y: 0  },

    right: { x: 1,  y: 0  }

  };

  var cell = 20;         // 每格显示像素，由 fit() 计算

  var snake = [];        // 蛇身，snake[0] 是头

  var dir = DIRS.right;  // 当前方向

  var pendingDirs = [];  // 待处理方向（防止一帧内连续转向自杀）

  var food = { x: 0, y: 0 };

  var score = 0;

  var best = readBest();

  var newBest = false;

  var timer = null;

  // 状态机：idle / running / paused / over

  var state = 'idle';

  /* ---------- 最高分读写 ---------- */

  function readBest() {

    try {

      var v = parseInt(window.localStorage.getItem(BEST_KEY), 10);

      return isNaN(v) || v < 0 ? 0 : v;

    } catch (e) {

      return 0; // 隐私模式等场景下静默降级

    }

  }

  function writeBest(v) {

    try {

      window.localStorage.setItem(BEST_KEY, String(v));

    } catch (e) { /* 存不了就算了，不影响游戏 */ }

  }

  /* ---------- 颜色工具 ---------- */

  function hexToRgb(hex) {

    var v = parseInt(hex.slice(1), 16);

    return { r: (v >> 16) & 255, g: (v >> 8) & 255, b: v & 255 };

  }

  function lerpColor(a, b, t) {

    var A = hexToRgb(a), B = hexToRgb(b);

    var r  = Math.round(A.r + (B.r  - A.r)  * t);

    var g  = Math.round(A.g + (B.g  - A.g)  * t);

    var bl = Math.round(A.b + (B.b  - A.b)  * t);

    return 'rgb(' + r + ',' + g + ',' + bl + ')';

  }

  /* ---------- 圆角矩形路径 ---------- */

  function roundRect(x, y, w, h, r) {

    var rr = Math.min(r, w / 2, h / 2);

    ctx.beginPath();

    ctx.moveTo(x + rr, y);

    ctx.arcTo(x + w, y,     x + w, y + h, rr);

    ctx.arcTo(x + w, y + h, x,     y + h, rr);

    ctx.arcTo(x,     y + h, x,     y,     rr);

    ctx.arcTo(x,     y,     x + w, y,     rr);

    ctx.closePath();

  }

  /* ---------- 自适应尺寸 ----------

     用 canvas 父容器的实际宽度算格子大小，

     再把 canvas 的 CSS 尺寸和像素尺寸一起写死，避免被外部布局拉伸。 */

  function fit() {

    if (!stageEl || !canvas) return;

    var cs = window.getComputedStyle(stageEl);

    var padL = parseFloat(cs.paddingLeft)  || 0;

    var padR = parseFloat(cs.paddingRight) || 0;

    var avail = stageEl.clientWidth - padL - padR;

    if (!avail || avail < 80) avail = 300;              // 还没布局好时给个兜底

    avail = Math.min(avail, CONFIG.maxBoardPx);

    cell = Math.max(8, Math.floor(avail / CONFIG.cols));

    var size = cell * CONFIG.cols;

    // CSS 显示尺寸

    canvas.style.width  = size + 'px';

    canvas.style.height = size + 'px';

    // 高清屏：按设备像素比放大画布，绘制坐标仍用 CSS 像素

    var dpr = Math.min(window.devicePixelRatio || 1, 2);

    canvas.width  = Math.round(size * dpr);

    canvas.height = Math.round(size * dpr);

    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    draw();

  }

  /* ---------- 重置到未开始状态 ---------- */

  function reset() {

    stopTimer();

    state = 'idle';

    newBest = false;

    score = 0;

    dir = DIRS.right;

    pendingDirs = [];

    snake = [];

    var hy = Math.floor(CONFIG.rows / 2);

    var hx = Math.floor(CONFIG.cols / 2);

    for (var i = 0; i < CONFIG.startLen; i++) {

      snake.push({ x: hx - i, y: hy });

    }

    placeFood();

    renderHUD();

    syncUI();

    draw();

  }

  /* ---------- 随机放置爱心 ---------- */

  function placeFood() {

    var free = [];

    for (var y = 0; y < CONFIG.rows; y++) {

      for (var x = 0; x < CONFIG.cols; x++) {

        var hit = false;

        for (var i = 0; i < snake.length; i++) {

          if (snake[i].x === x && snake[i].y === y) { hit = true; break; }

        }

        if (!hit) free.push({ x: x, y: y });

      }

    }

    if (free.length === 0) {

      gameOver();   // 满屏，算通关

      return;

    }

    food = free[Math.floor(Math.random() * free.length)];

  }

  /* ---------- 速度与定时器 ---------- */

  function currentSpeed() {

    return Math.max(CONFIG.minSpeed, CONFIG.baseSpeed - score * CONFIG.speedStep);

  }

  function startTimer() {

    stopTimer();

    timer = window.setInterval(tick, currentSpeed());

  }

  function stopTimer() {

    if (timer !== null) {

      window.clearInterval(timer);

      timer = null;

    }

  }

  /* ---------- 一步逻辑 ---------- */

  function tick() {

    // 从待处理队列取一个合法方向：不能 180 度掉头，也不能原地不动

    while (pendingDirs.length > 0) {

      var d = pendingDirs.shift();

      if (d.x === -dir.x && d.y === -dir.y) continue;

      if (d.x ===  dir.x && d.y ===  dir.y) continue;

      dir = d;

      break;

    }

    var head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

    // 撞墙

    if (head.x < 0 || head.y < 0 ||

        head.x >= CONFIG.cols || head.y >= CONFIG.rows) {

      gameOver();

      return;

    }

    var willGrow = (head.x === food.x && head.y === food.y);

    // 撞自己：不吃食物时尾巴会移开，所以最后一节不算

    var bodyEnd = willGrow ? snake.length : snake.length - 1;

    for (var i = 0; i < bodyEnd; i++) {

      if (snake[i].x === head.x && snake[i].y === head.y) {

        gameOver();

        return;

      }

    }

    snake.unshift(head);

    if (willGrow) {

      score++;

      renderHUD();

      placeFood();

      if (state === 'over') return;   // placeFood 里可能触发满屏结束

      startTimer();                   // 用新速度重开定时器

    } else {

      snake.pop();

    }

    draw();

  }

  /* ---------- 结束 ---------- */

  function gameOver() {

    stopTimer();

    state = 'over';

    // 只在结束时更新最高分，避免中途刷新留下半截记录

    newBest = score > best;

    if (newBest) {

      best = score;

      writeBest(best);

    }

    renderHUD();

    syncUI();

    draw();

  }

  /* ---------- 1开始 / 暂停 / 继续 ---------- */

  function start() {

    if (state === 'running' || state === 'over') return;

    state = 'running';

    startTimer();

    syncUI();

    draw();

  }

  function pause() {

    if (state !== 'running') return;

    state = 'paused';

    stopTimer();

    syncUI();

    draw();

  }

  function onMainButton() {

    if (state === 'idle' || state === 'paused') {

      start();

    } else if (state === 'running') {

      pause();

    } else if (state === 'over') {

      reset();

      start();

    }

  }

  /* ---------- 界面同步 ---------- */

  function renderHUD() {

    scoreEl.textContent = String(score);

    bestEl.textContent  = String(best);

  }

  function syncUI() {

    if (state === 'running') {

      overlay.classList.add('ms-hide');

      btnMain.textContent = '暂停';

      return;

    }

    overlay.classList.remove('ms-hide');

    if (state === 'idle') {

      ovTitle.textContent = TEXT.idleTitle;

      ovText.textContent  = TEXT.idleText;

      btnMain.textContent = '开始';

    } else if (state === 'paused') {

      ovTitle.textContent = TEXT.pauseTitle;

      ovText.textContent  = TEXT.pauseText;

      btnMain.textContent = '继续';

    } else if (state === 'over') {

      ovTitle.textContent = TEXT.overTitle;

      var msg = score > 0 ? TEXT.overScore(score) : TEXT.overEmpty;

      if (newBest && score > 0) msg += TEXT.newBest;

      ovText.textContent  = msg;

      btnMain.textContent = '再来一局';

    }

  }

  /* ---------- 绘制 ---------- */

  function draw() {

    if (!snake || snake.length === 0) return;

    var W = CONFIG.cols * cell;

    var H = CONFIG.rows * cell;

    ctx.clearRect(0, 0, W, H);

    // 棋盘底色

    ctx.fillStyle = COLOR.boardBg;

    ctx.fillRect(0, 0, W, H);

    // 淡色棋盘格

    ctx.fillStyle = COLOR.boardAlt;

    for (var y = 0; y < CONFIG.rows; y++) {

      for (var x = 0; x < CONFIG.cols; x++) {

        if ((x + y) % 2 === 0) {

          ctx.fillRect(x  *cell, y*  cell, cell, cell);

        }

      }

    }

    drawFood();

    drawSnake();

  }

  function drawFood() {

    var cx = food.x * cell + cell / 2;

    var cy = food.y * cell + cell / 2;

    var s  = cell * 0.28;

    // 爱心主体

    ctx.fillStyle = COLOR.food;

    ctx.beginPath();

    ctx.moveTo(cx, cy + s);

    ctx.bezierCurveTo(cx - s  *1.7,  cy - s*  0.45,

                      cx - s  *0.65, cy - s*  1.45, cx, cy - s * 0.45);

    ctx.bezierCurveTo(cx + s  *0.65, cy - s*  1.45,

                      cx + s  *1.7,  cy - s*  0.45, cx, cy + s);

    ctx.closePath();

    ctx.fill();

    // 高光小点

    ctx.fillStyle = 'rgba(255, 255, 255, 0.72)';

    ctx.beginPath();

    ctx.arc(cx - s * 0.5, cy - s * 0.5, cell * 0.24, 0, Math.PI * 2);

    ctx.fill();

  }

  function drawSnake() {

    var n = snake.length;

    var inset = Math.max(1, cell * CONFIG.insetRatio);

    var baseR = cell * CONFIG.cornerRatio;

    // 从尾到头画，头压在最上层

    for (var i = n - 1; i >= 0; i--) {

      var seg = snake[i];

      var t = n === 1 ? 0 : i / (n - 1);

      var x = seg.x * cell + inset;

      var y = seg.y * cell + inset;

      var w = cell - inset * 2;

      ctx.fillStyle = lerpColor(COLOR.snakeHead, COLOR.snakeTail, t);

      roundRect(x, y, w, w, i === 0 ? baseR * 1.25 : baseR);

      ctx.fill();

    }

    drawFace();

  }

  function drawFace() {

    var h = snake[0];

    if (!h) return;

    var cx = h.x * cell + cell / 2;

    var cy = h.y * cell + cell / 2;

    // 眼睛沿前进方向偏移

    var ex = dir.x  *cell*  0.12;

    var ey = dir.y  *cell*  0.12;

    // 垂直于前进方向的偏移（左右眼）

    var perpX = -dir.y;

    var perpY =  dir.x;

    var off = cell * 0.2;

    var eyeR = Math.max(1.4, cell * 0.085);

    ctx.fillStyle = COLOR.eye;

    ctx.beginPath();

    ctx.arc(cx + ex + perpX  *off, cy + ey + perpY*  off, eyeR, 0, Math.PI * 2);

    ctx.fill();

    ctx.beginPath();

    ctx.arc(cx + ex - perpX  *off, cy + ey - perpY*  off, eyeR, 0, Math.PI * 2);

    ctx.fill();

    // 腮红：放在头部靠后两侧

    var blushR = Math.max(1.2, cell * 0.075);

    var bx = cx - dir.x  *cell*  0.26;

    var by = cy - dir.y  *cell*  0.26;

    var boff = cell * 0.3;

    ctx.fillStyle = COLOR.blush;

    ctx.globalAlpha = 0.85;

    ctx.beginPath();

    ctx.arc(bx + perpX  *boff, by + perpY*  boff, blushR, 0, Math.PI * 2);

    ctx.fill();

    ctx.beginPath();

    ctx.arc(bx - perpX  *boff, by - perpY*  boff, blushR, 0, Math.PI * 2);

    ctx.fill();

    ctx.globalAlpha = 1;

  }

  /* ---------- 转向输入 ---------- */

  function turn(name) {

    var d = DIRS[name];

    if (!d) return;

    if (state !== 'running' && state !== 'paused') return;

    if (pendingDirs.length >= 3) return;

    pendingDirs.push(d);

  }

  /* ---------- 事件绑定 ---------- */

  btnMain.addEventListener('click', onMainButton);

  btnReset.addEventListener('click', function () {

    reset();

  });

  pad.addEventListener('click', function (e) {

    var btn = e.target.closest('.ms-pad-btn');

    if (!btn) return;

    turn(btn.getAttribute('data-dir'));

  });

  // 键盘：方向键 / WASD 转向，空格暂停或继续

  document.addEventListener('keydown', function (e) {

    var key = e.key;

    var tag = e.target && e.target.tagName;

    if (key === 'ArrowUp' || key === 'w' || key === 'W') {

      turn('up'); e.preventDefault();

    } else if (key === 'ArrowDown' || key === 's' || key === 'S') {

      turn('down'); e.preventDefault();

    } else if (key === 'ArrowLeft' || key === 'a' || key === 'A') {

      turn('left'); e.preventDefault();

    } else if (key === 'ArrowRight' || key === 'd' || key === 'D') {

      turn('right'); e.preventDefault();

    } else if (key === ' ' || key === 'Spacebar') {

      // 焦点在按钮上时交给按钮自己，避免触发两次

      if (tag === 'BUTTON') return;

      e.preventDefault();

      onMainButton();

    }

  });

  // 棋盘上滑动转向

  var touchStart = null;

  canvas.addEventListener('touchstart', function (e) {

    var t = e.changedTouches[0];

    touchStart = { x: t.clientX, y: t.clientY };

  }, { passive: true });

  canvas.addEventListener('touchend', function (e) {

    if (!touchStart) return;

    var t = e.changedTouches[0];

    var dx = t.clientX - touchStart.x;

    var dy = t.clientY - touchStart.y;

    touchStart = null;

    if (Math.abs(dx) < 22 && Math.abs(dy) < 22) return; // 当作点击，忽略

    if (Math.abs(dx) > Math.abs(dy)) {

      turn(dx > 0 ? 'right' : 'left');

    } else {

      turn(dy > 0 ? 'down' : 'up');

    }

  }, { passive: true });

  // 切标签页 / 窗口失焦自动暂停，避免回来就撞死。状态可逆，点「继续」接着玩。

  window.addEventListener('blur', function () {

    if (state === 'running') pause();

  });

  // 屏幕尺寸变化时重算格子

  window.addEventListener('resize', function () {

    fit();

  });

  /* ---------- 启动 ----------

     先跑一次拿估算尺寸，再等布局稳定后校正一次，

     防止文章里图片/字体加载完后容器宽度变化。 */

  fit();

  reset();

  window.setTimeout(fit, 80);

})();

</script>
  </div>
</body>
</html>
