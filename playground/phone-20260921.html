<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<meta http-equiv="Pragma" content="no-cache" />
<meta http-equiv="Expires" content="0" />
<title>模拟苹果电话 v3</title>
<style>
/* ========== 核心参数（颜色/尺寸都在这里改） ========== */
.phone-app{
  --pa-bg-top:#1C1C1E;
  --pa-bg-bottom:#000000;
  --pa-text:#FFFFFF;
  --pa-muted:#8E8E93;
  --pa-key-bg:#333333;
  --pa-key-press:#4A4A4A;
  --pa-call-green:#34C759;
  --pa-hang-red:#FF3B30;
  --pa-accent:#0A84FF;
  --pa-panel-bg:#2C2C2E;
  --pa-border:rgba(255,255,255,0.12);
  --pa-radius:18px;
  --pa-key-size:64px;
  --pa-call-btn-size:72px;
  font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
  color:var(--pa-text);
  background:linear-gradient(180deg,var(--pa-bg-top),var(--pa-bg-bottom));
  max-width:420px;
  margin:0 auto;
  min-height:100vh;
  min-height:100dvh;
  position:relative;
  overflow:hidden;
  user-select:none;
  -webkit-tap-highlight-color:transparent;
}
.phone-app *{box-sizing:border-box}
.phone-app button{font-family:inherit;touch-action:manipulation;cursor:pointer;border:none;outline:none}
.phone-app input,.phone-app textarea{font-family:inherit}

/* ========== 通用 ========== */
.phone-app-hidden{display:none!important}
.phone-app-toast{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,.85);color:#fff;padding:12px 20px;border-radius:12px;font-size:14px;z-index:9999;pointer-events:none;opacity:0;transition:opacity .25s}
.phone-app-toast.show{opacity:1}

/* ========== 顶部栏 ========== */
.phone-app-topbar{display:flex;align-items:center;justify-content:space-between;padding:16px 20px 8px}
.phone-app-topbar h1{font-size:18px;font-weight:600;margin:0}
.phone-app-settings-btn{width:36px;height:36px;border-radius:50%;background:transparent;color:var(--pa-muted);font-size:20px;display:flex;align-items:center;justify-content:center}
.phone-app-settings-btn:active{color:#fff}

/* ========== 底部导航栏 ========== */
.phone-app-tabs{display:flex;border-top:1px solid var(--pa-border);background:rgba(0,0,0,.6);padding:6px 0 calc(6px + env(safe-area-inset-bottom))}
.phone-app-tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--pa-muted);background:transparent;padding:6px 0}
.phone-app-tab .pa-tab-ico{font-size:20px;line-height:1}
.phone-app-tab .pa-tab-label{font-size:10px}
.phone-app-tab.active{color:var(--pa-accent)}

/* ========== tab 内容区（拨号页） ========== */
.phone-app-tabpane{display:none;flex:1;flex-direction:column;overflow:hidden}
.phone-app-tabpane.active{display:flex}

/* ========== 最近通话 / 联系人 列表 ========== */
.phone-app-list{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:8px 0}
.phone-app-recent-title{font-size:13px;color:var(--pa-muted);padding:8px 20px 4px}
.phone-app-contact{display:flex;align-items:center;justify-content:space-between;padding:10px 20px;background:transparent;touch-action:manipulation}
.phone-app-contact:active{background:rgba(255,255,255,0.08)}
.phone-app-contact-left{display:flex;align-items:center;gap:12px}
.phone-app-contact-avatar{width:40px;height:40px;border-radius:50%;background:var(--pa-accent);display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:600;color:#fff;overflow:hidden;background-size:cover;background-position:center}
.phone-app-contact-info{display:flex;flex-direction:column}
.phone-app-contact-name{font-size:16px}
.phone-app-contact-num{font-size:12px;color:var(--pa-muted)}
.phone-app-contact-type{font-size:12px;color:var(--pa-muted);margin-right:4px}

/* ========== 拨号键盘 ========== */
.phone-app-display{text-align:center;padding:24px 20px 12px;min-height:60px}
.phone-app-digits{font-size:42px;font-weight:300;letter-spacing:2px;min-height:50px;word-break:break-all}
.phone-app-keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:16px 0;padding:8px 40px;justify-items:center}
.phone-app-key{width:var(--pa-key-size);height:var(--pa-key-size);border-radius:50%;background:var(--pa-key-bg);color:#fff;font-size:24px;font-weight:400;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.phone-app-key:active{background:var(--pa-key-press)}
.phone-app-key .pa-sub{font-size:10px;color:var(--pa-muted);margin-top:2px;letter-spacing:1px}
.phone-app-call-row{display:flex;justify-content:center;padding:20px 0 12px}
.phone-app-call-btn{width:var(--pa-call-btn-size);height:var(--pa-call-btn-size);border-radius:50%;background:var(--pa-call-green);display:flex;align-items:center;justify-content:center;box-shadow:0 4px 14px rgba(52,199,89,.4)}
.phone-app-call-btn:active{opacity:.85}

/* ========== 通话页 ========== */
.phone-app-call{display:flex;flex-direction:column;height:100vh;height:100dvh}
.phone-app-call-header{text-align:center;padding:40px 20px 12px}
.phone-app-call-name{font-size:26px;font-weight:500;margin-bottom:6px}
.phone-app-call-num{font-size:14px;color:var(--pa-muted);margin-bottom:4px}
.phone-app-call-status{font-size:15px;color:var(--pa-muted);min-height:20px}
.phone-app-call-avatar{width:120px;height:120px;border-radius:50%;background:linear-gradient(135deg,#555,#333);margin:0 auto;display:flex;align-items:center;justify-content:center;font-size:48px;font-weight:300;margin-bottom:16px;overflow:hidden;background-size:cover;background-position:center;position:relative;touch-action:manipulation}
.phone-app-call-avatar .pa-avatar-edit{position:absolute;bottom:0;left:0;right:0;background:rgba(0,0,0,.5);font-size:11px;padding:3px 0;color:#fff;text-align:center;opacity:0;transition:opacity .2s}
.phone-app-call-avatar:active .pa-avatar-edit{opacity:1}
.phone-app-call-avatar.has-img .pa-avatar-letter{display:none}

.phone-app-subtitles{flex:1;overflow-y:auto;padding:12px 20px;display:flex;flex-direction:column;gap:10px;-webkit-overflow-scrolling:touch}
.phone-app-sub{padding:10px 14px;border-radius:14px;max-width:85%;font-size:15px;line-height:1.4}
.phone-app-sub.user{align-self:flex-end;background:var(--pa-accent);color:#fff}
.phone-app-sub.ai{align-self:flex-start;background:rgba(255,255,255,0.12);color:#fff}
.phone-app-sub .pa-trans{display:block;font-size:12px;color:var(--pa-muted);margin-top:6px;padding-top:6px;border-top:1px solid rgba(255,255,255,.12)}
.phone-app-sub.user .pa-trans{color:rgba(255,255,255,.7);border-top-color:rgba(255,255,255,.2)}

/* 记忆 pin - 长按选中状态 */
.phone-app-sub.pinned{box-shadow:0 0 0 2px var(--pa-accent) inset}
.phone-app-sub .pa-pin-bar{display:none;margin-top:8px;gap:8px}
.phone-app-sub.pinned .pa-pin-bar{display:flex}
.phone-app-sub .pa-pin-bar .pa-pin-btn{font-size:12px;background:rgba(255,255,255,.12);border-radius:8px;padding:4px 10px;color:#fff;touch-action:manipulation}
.phone-app-sub .pa-pin-bar .pa-pin-btn:active{opacity:.6}

/* 记忆列表页 */
.phone-app-mem-contact{padding:10px 20px;border-bottom:1px solid var(--pa-border)}
.phone-app-mem-contact-name{font-size:15px;font-weight:600;margin-bottom:4px}
.phone-app-mem-item{font-size:13px;color:var(--pa-muted);padding:4px 0;line-height:1.5}
.phone-app-mem-item .pa-mem-role{font-size:11px;color:var(--pa-accent);margin-right:6px}
.phone-app-mem-empty{text-align:center;color:var(--pa-muted);font-size:14px;padding:40px 20px}

/* ========== 输入区（语音+打字双模式） ========== */
.phone-app-input-bar{display:flex;align-items:center;gap:8px;padding:10px 16px}
.phone-app-input-bar input{flex:1;background:rgba(255,255,255,0.1);border:1px solid var(--pa-border);border-radius:20px;padding:10px 16px;color:#fff;font-size:14px;outline:none;min-width:0}
.phone-app-input-bar input::placeholder{color:var(--pa-muted)}
.phone-app-input-bar .pa-kb-btn{background:var(--pa-key-bg);color:#fff;border-radius:50%;width:40px;height:40px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.phone-app-input-bar .pa-kb-btn.active{background:var(--pa-hang-red);animation:pa-pulse 1s infinite}
.phone-app-input-bar .pa-send-btn{background:var(--pa-accent);color:#fff;border-radius:20px;padding:0 16px;height:40px;font-size:14px;flex-shrink:0}
@keyframes pa-pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,59,48,.5)}50%{box-shadow:0 0 0 12px rgba(255,59,48,0)}}

.phone-app-call-controls{display:flex;justify-content:space-around;padding:12px 30px 8px}
.phone-app-ctrl-btn{display:flex;flex-direction:column;align-items:center;gap:6px;color:var(--pa-muted);background:transparent!important;-webkit-appearance:none;appearance:none;padding:0}
.phone-app-ctrl-btn .pa-ico{width:48px;height:48px;border-radius:50%!important;background-color:#3a3a3c!important;display:flex;align-items:center;justify-content:center;overflow:hidden;color:#fff!important}
.phone-app-ctrl-btn .pa-ico svg{fill:#fff!important;width:24px;height:24px}
.phone-app-ctrl-btn .pa-label{font-size:11px}
.phone-app-ctrl-btn.active .pa-ico{background-color:#fff!important;color:#000!important}
.phone-app-ctrl-btn.active .pa-ico svg{fill:#000!important}
.phone-app-ctrl-btn.active .pa-label{color:#fff}

.phone-app-hangup-row{display:flex;justify-content:center;padding:12px 0 20px}
.phone-app-hangup-btn{width:var(--pa-call-btn-size);height:var(--pa-call-btn-size);border-radius:50%;background:var(--pa-hang-red);display:flex;align-items:center;justify-content:center;box-shadow:0 4px 14px rgba(255,59,48,.4)}
.phone-app-hangup-btn:active{opacity:.85}

/* ========== 设置面板 ========== */
.phone-app-settings-mask{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:200;display:flex;align-items:flex-end;justify-content:center}
.phone-app-settings{background:var(--pa-panel-bg);width:100%;max-width:420px;border-radius:var(--pa-radius) var(--pa-radius) 0 0;padding:20px;max-height:85vh;overflow-y:auto}
.phone-app-settings h2{margin:0 0 16px;font-size:18px}
.phone-app-settings-row{margin-bottom:14px}
.phone-app-settings-row label{display:block;font-size:13px;color:var(--pa-muted);margin-bottom:6px}
.phone-app-settings-row input,.phone-app-settings-row textarea{width:100%;background:rgba(0,0,0,.3);border:1px solid var(--pa-border);border-radius:10px;padding:10px 12px;color:#fff;font-size:14px;outline:none}
.phone-app-settings-row textarea{min-height:60px;resize:vertical}
.phone-app-settings-row input:focus,.phone-app-settings-row textarea:focus{border-color:var(--pa-accent)}
.phone-app-settings-save{width:100%;background:var(--pa-accent);color:#fff;border-radius:12px;padding:14px;font-size:16px;font-weight:500;margin-top:8px}
.phone-app-settings-save:active{opacity:.8}
.phone-app-close-settings{position:absolute;top:16px;right:20px;color:var(--pa-muted);font-size:22px;background:none}

/* ========== 联系人编辑（Apple 风格卡片） ========== */
.phone-app-cedit-mask{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:210;display:flex;align-items:flex-end;justify-content:center}
.phone-app-cedit{background:var(--pa-panel-bg);width:100%;max-width:420px;border-radius:var(--pa-radius) var(--pa-radius) 0 0;padding:20px;max-height:85vh;overflow-y:auto;-webkit-overflow-scrolling:touch}
.phone-app-cedit-close{position:absolute;top:16px;right:20px;color:var(--pa-muted);font-size:22px;background:none}
.phone-app-cedit-avatar-wrap{display:flex;flex-direction:column;align-items:center;gap:10px;margin-bottom:20px}
.phone-app-cedit-avatar{width:100px;height:100px;border-radius:50%;background:linear-gradient(135deg,#555,#333);display:flex;align-items:center;justify-content:center;font-size:40px;font-weight:300;color:#fff;overflow:hidden;background-size:cover;background-position:center;position:relative;touch-action:manipulation}
.phone-app-cedit-avatar.has-img .pa-cedit-letter{display:none}
.phone-app-cedit-avatar .pa-cedit-cam{position:absolute;bottom:0;left:0;right:0;background:rgba(0,0,0,.5);font-size:11px;padding:3px 0;color:#fff;text-align:center}
.phone-app-cedit-avatar-hint{font-size:12px;color:var(--pa-muted)}
.phone-app-cedit-row{margin-bottom:14px}
.phone-app-cedit-row label{display:block;font-size:13px;color:var(--pa-muted);margin-bottom:6px}
.phone-app-cedit-row input{width:100%;background:rgba(0,0,0,.3);border:1px solid var(--pa-border);border-radius:10px;padding:10px 12px;color:#fff;font-size:14px;outline:none}
.phone-app-cedit-row input:focus{border-color:var(--pa-accent)}
.phone-app-cedit-save{width:100%;background:var(--pa-accent);color:#fff;border-radius:12px;padding:14px;font-size:16px;font-weight:500;margin-top:8px}
.phone-app-cedit-save:active{opacity:.8}
.phone-app-cedit-call{width:100%;background:var(--pa-call-green);color:#fff;border-radius:12px;padding:14px;font-size:16px;font-weight:500;margin-top:8px;display:flex;align-items:center;justify-content:center;gap:6px}
.phone-app-cedit-call:active{opacity:.8}
.phone-app-contact-avatar.editable{cursor:pointer;touch-action:manipulation}

/* ========== 短信/iMessage 界面 ========== */
.phone-app-sms{display:flex;flex-direction:column;height:100%}
.phone-app-sms-list{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.phone-app-sms-item{display:flex;align-items:center;padding:10px 20px;gap:12px;touch-action:manipulation;border-bottom:1px solid rgba(255,255,255,.06)}
.phone-app-sms-item:active{background:rgba(255,255,255,.05)}
.phone-app-sms-avatar{width:42px;height:42px;border-radius:50%;background:#3a3a3c;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:500;color:#fff;overflow:hidden;background-size:cover;background-position:center;flex-shrink:0}
.phone-app-sms-info{flex:1;min-width:0}
.phone-app-sms-name{font-size:15px;font-weight:500}
.phone-app-sms-preview{font-size:13px;color:var(--pa-muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.phone-app-sms-time{font-size:11px;color:var(--pa-muted);flex-shrink:0}
.phone-app-sms-empty{text-align:center;color:var(--pa-muted);font-size:14px;padding:60px 20px}

/* 短信对话页（全屏覆盖） */
.phone-app-sms-chat{position:fixed;inset:0;background:#000;z-index:180;display:flex;flex-direction:column}
.phone-app-sms-topbar{flex-shrink:0;height:54px;display:flex;align-items:center;padding:0 8px;background:#1c1c1e;border-bottom:1px solid #38383a;gap:8px}
.phone-app-sms-back{color:#0a84ff;font-size:28px;background:none;width:32px;height:32px;display:flex;align-items:center;justify-content:center}
.phone-app-sms-back:active{opacity:.5}
.phone-app-sms-top-info{flex:1;display:flex;align-items:center;gap:10px;min-width:0}
.phone-app-sms-top-avatar{width:34px;height:34px;border-radius:50%;background:#3a3a3c;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:500;color:#fff;overflow:hidden;background-size:cover;background-position:center;flex-shrink:0}
.phone-app-sms-top-text{display:flex;flex-direction:column;min-width:0}
.phone-app-sms-title{font-size:16px;font-weight:600;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.phone-app-sms-sub{font-size:11px;color:rgba(255,255,255,.55);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.phone-app-sms-facetime{width:36px;height:36px;border-radius:50%;background:rgba(10,132,255,.18);color:#0a84ff;border:none;display:flex;align-items:center;justify-content:center;flex-shrink:0;touch-action:manipulation}
.phone-app-sms-facetime:active{opacity:.6;background:rgba(10,132,255,.3)}
.phone-app-sms-messages{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px 12px 0;display:flex;flex-direction:column;gap:6px;background:#000}
.phone-app-sms-input{flex-shrink:0;display:flex;align-items:center;gap:8px;padding:10px 12px;background:#1c1c1e;border-top:1px solid #38383a}
.phone-app-sms-input input{flex:1;background:#2c2c2e;border:1px solid #38383a;border-radius:20px;padding:8px 14px;color:#fff;font-size:15px;outline:none}
.phone-app-sms-send{width:32px;height:32px;border-radius:50%;background:#0a84ff;border:none;color:#fff;display:flex;align-items:center;justify-content:center;touch-action:manipulation}
.phone-app-sms-send:active{opacity:.7}
.phone-app-sms-send svg{width:18px;height:18px}
.phone-app-sms-bubble{max-width:72%;padding:9px 13px;border-radius:20px;font-size:15px;line-height:1.35;word-break:break-word}
.phone-app-sms-bubble.me{align-self:flex-end;background:#007aff;color:#fff;border-bottom-right-radius:6px}
.phone-app-sms-bubble.other{align-self:flex-start;background:#262628;color:#fff;border-bottom-left-radius:6px}
.phone-app-sms-bubble.pinned{box-shadow:0 0 0 2px #0a84ff inset}
.phone-app-sms-bubble .pa-sms-bar{display:none;margin-top:6px;gap:6px}
.phone-app-sms-bubble.pinned .pa-sms-bar{display:flex}
.phone-app-sms-bubble .pa-sms-btn{font-size:11px;background:rgba(255,255,255,.18);border-radius:8px;padding:3px 8px;color:#fff}
.phone-app-sms-delivered{align-self:flex-end;font-size:11px;color:rgba(255,255,255,.45);margin:2px 4px 0}
.phone-app-sms-time-sep{align-self:center;font-size:11px;color:rgba(255,255,255,.5);background:rgba(255,255,255,.08);border-radius:10px;padding:4px 10px;margin:10px 0 4px;white-space:nowrap}
.phone-app-sms-plus{width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.1);color:rgba(255,255,255,.7);border:1px solid #38383a;font-size:22px;line-height:1;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-weight:300}
.phone-app-sms-plus:active{background:rgba(255,255,255,.2)}

/* 记忆库（短信） */
.phone-app-smem-group{padding:10px 20px;border-bottom:1px solid rgba(255,255,255,.06)}
.phone-app-smem-name{font-size:15px;font-weight:600;margin-bottom:4px}
.phone-app-smem-item{font-size:13px;color:var(--pa-muted);padding:2px 0}
.phone-app-smem-item .pa-role{font-size:11px;color:#0a84ff;margin-right:6px}
.phone-app-smem-del{font-size:11px;color:#ff453a;background:rgba(255,59,48,.15);border-radius:6px;padding:1px 6px;margin-left:4px}

/* ========== 来电界面 ========== */
.phone-app-incoming{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:350;display:flex;flex-direction:column;align-items:center;justify-content:center}
.phone-app-incoming-name{font-size:24px;font-weight:600;margin-top:16px;color:#fff}
.phone-app-incoming-status{font-size:14px;color:rgba(255,255,255,.6);margin-top:6px}
.phone-app-incoming-avatar{width:120px;height:120px;border-radius:50%;background:#3a3a3c;display:flex;align-items:center;justify-content:center;font-size:44px;font-weight:300;color:#fff;overflow:hidden;background-size:cover;background-position:center;animation:paRing 1.2s ease-in-out infinite}
@keyframes paRing{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
.phone-app-incoming-actions{display:flex;gap:60px;margin-top:80px}
.phone-app-incoming-btn{width:64px;height:64px;border-radius:50%;border:none;display:flex;align-items:center;justify-content:center;color:#fff;box-shadow:0 4px 20px rgba(0,0,0,.4);touch-action:manipulation}
.phone-app-incoming-btn:active{transform:scale(.92)}
.phone-app-incoming-btn.accept{background:#34c759}
.phone-app-incoming-btn.decline{background:#ff453a}
.phone-app-incoming-label{font-size:12px;color:rgba(255,255,255,.7);margin-top:10px;text-align:center;width:64px}
.phone-app-incoming-btns{display:flex;gap:60px}
</style>
</head>
<body>
<div class="phone-app" id="paRoot">

  <!-- ===== 拨号页（含底部导航） ===== -->
  <div class="phone-app-dial phone-app-call" id="paDialView">
    <div class="phone-app-topbar">
      <h1 id="paDialTitle">最近通话</h1>
      <div style="display:flex;gap:6px">
        <button class="phone-app-settings-btn" id="paAddContactBtn" title="新建联系人">＋</button>
        <button class="phone-app-settings-btn" id="paSettingsBtn" title="设置">⚙</button>
      </div>
    </div>

    <!-- 最近通话 tab -->

<script>
'use strict';

/* ============================================================
   核心配置（都在这里改）
   localStorage 键名：phone_app_config，存 { baseUrl, apiKey, model, sysPrompt, useCloudTts, ttsApiKey, ttsUrl, ttsGroupId, ttsVoiceId, ttsSpeed, ttsEmotion, autoTrans }
   ============================================================ */
var CONFIG = {
  defaultBaseUrl: 'https://token.sensenova.cn/v1',
  defaultSysPrompt: '你是电话那头的人，用口语化的方式简短回复，像真实通话一样，每次不超过50字。如需指定语言，请在此处写明（例如：全程用英文回复）。',

  defaultTtsBackupUrl: 'https://api-bj.minimaxi.com/v1/t2a_v2', /* MiniMax 备用接口 */
  defaultTtsGroupId: '210158230773437642',              /* MiniMax Group ID */
  defaultTtsVoiceId: 'male-qn-qingse',                  /* MiniMax 音色 ID */
  defaultTtsSpeed: 0.9,                                 /* 默认语速 */
  defaultTtsEmotion: 'neutral',                         /* 默认情感 */
  ttsModel: 'speech-2.8-hd',                            /* MiniMax TTS 模型 */
  maxHistory: 8,          /* 发给 AI 的最近对话轮数 */
  memoryKey: 'phone_app_memory', /* 通话联系人记忆库 localStorage 键名 */
  smsMemoryKey: 'phone_app_sms_memory', /* 短信记忆库 */
  memoryMax: 20,          /* 每个联系人最多保存多少轮对话 */
  callWaitMs: 1500,       /* 呼出后多少毫秒自动接听 */
  contacts: [             /* 预设联系人（真实备注名+电话） */
    { name: '老公', num: '138 0013 8000', avatar: '老', sys: '你是「老公」，温柔体贴，用简短口语回复，像打电话一样，每次不超过50字。' },
    { name: '哥哥', num: '139 0013 9000', avatar: '哥', sys: '你是「哥哥」，亲切靠谱，简短回复，每次不超过50字。' },
    { name: '妈妈', num: '137 0013 7000', avatar: '妈', sys: '你是「妈妈」，关心唠叨但温暖，简短回复，每次不超过50字。' },
    { name: '老板', num: '136 0013 6000', avatar: '板', sys: '你是「老板」，干练直接，简短回复，每次不超过50字。' },

  fallbackReplies: [      /* 没填 API Key 时的固定回复 */
    '你还没配置 API Key 呢，去设置里填一下吧。',
    '需要先填 API Key 我才能说话哦。',
    '设置入口在拨号页右上角的齿轮图标。'

};

/* ========== 全局状态 ========== */
var state = {
  config: null,
  digits: '',
  view: 'dial',
  tab: 'recents',
  callTimer: null,
  callSeconds: 0,
  inCall: false,
  history: [],
  currentContact: null,
  recognition: null,
  synthSupport: false,
  recogSupport: false,
  fallbackIdx: 0,
  listening: false
};

/* ========== 工具函数 ========== */
function $(id) { return document['getElementById'](id); }

function toast(msg) {
  var t = $('paToast');
  t['textContent'] = msg;
  t['classList']['add']('show');
  clearTimeout(toast['_t']);
  toast['_t'] = setTimeout(function () { t['classList']['remove']('show'); }, 2000);
}

function loadConfig() {
  try {
    var raw = localStorage['getItem']('phone_app_config');
    if (raw) state['config'] = JSON['parse'](raw);
  } catch (e) {}
  if (!state['config']) {
    state['config'] = {
      baseUrl: CONFIG['defaultBaseUrl'],
      apiKey: '', model: '',
      sysPrompt: CONFIG['defaultSysPrompt'],
      useCloudTts: false,
      ttsApiKey: '',
      ttsUrl: CONFIG['defaultTtsUrl'],
      ttsGroupId: CONFIG['defaultTtsGroupId'],
      ttsVoiceId: CONFIG['defaultTtsVoiceId'],
      ttsSpeed: CONFIG['defaultTtsSpeed'],
      ttsEmotion: CONFIG['defaultTtsEmotion'],
      autoTrans: false
    };

function fmtTime(sec) {

/* 检测是否为英文为主的文本 */
function isEnglish(text) {
  if (!text) return false;
  var letters = text['match'](/[a-zA-Z]/g);
  var chinese = text['match'](/[\u4e00-\u9fa5]/g);
  var lc = letters ? letters['length'] : 0;
  var cc = chinese ? chinese['length'] : 0;
  return lc > cc && lc >= 2;
}

        longPressed=false;

          if(navigator['vibrate'])navigator['vibrate'](30);

            saveSmsMem(state['contacts'][idx]['name'],[]);
            renderSmsList();
            toast('已清空对话');
          }
        },600);
      };
      var cancelPress=function(){if(pressTimer){clearTimeout(pressTimer);pressTimer=null;}};
      item['addEventListener']('touchstart',startPress);
      item['addEventListener']('touchend',cancelPress);
      item['addEventListener']('touchmove',cancelPress);
      item['addEventListener']('mousedown',startPress);
      item['addEventListener']('mouseup',cancelPress);
      item['addEventListener']('mouseleave',cancelPress);

function renderSmsMessages(){
  var box=$('paSmsMessages');
  box['innerHTML']='';
  var prevTs=null;
  for(var i=0;i<smsMsgs['length'];i++){
    var m=smsMsgs[i];

    /* 时间分隔符 */
    if(needTimeSep(prevTs,currTs)){
      var sep=document['createElement']('div');
      sep['className']='phone-app-sms-time-sep';
      sep['textContent']=fmtSmsTime(currTs);
      box['appendChild'](sep);
    }
    prevTs=currTs;
    var div=document['createElement']('div');
    div['className']='phone-app-sms-bubble '+(m['role']==='user'?'me':'other');
    div['textContent']=m['content'];
    /* 长按记住 */
    (function(el,msg){
      var t=null;
      el['addEventListener']('touchstart',function(){t=setTimeout(function(){el['classList']['add']('pinned');if(navigator['vibrate'])navigator['vibrate'](30);},500);});
      el['addEventListener']('touchend',function(){clearTimeout(t);});
      el['addEventListener']('touchmove',function(){clearTimeout(t);});
      el['addEventListener']('mousedown',function(){t=setTimeout(function(){el['classList']['add']('pinned');},600);});
      el['addEventListener']('mouseup',function(){clearTimeout(t);});
      el['addEventListener']('mouseleave',function(){clearTimeout(t);});
      /* 操作栏 */
      var bar=document['createElement']('div');
      bar['className']='pa-sms-bar';
      var pin=document['createElement']('span');
      pin['className']='pa-sms-btn';
      pin['textContent']='📌记住';
      pin['addEventListener']('click',function(e){
        e['stopPropagation'];
        var mem=loadSmsMem(state['contacts'][smsChatIdx]['name']);
        var exists=false;
        for(var k=0;k<mem['length'];k++){if(mem[k]['role']===msg['role']&&mem[k]['content']===msg['content']){exists=true;break;}}
        if(!exists){mem['push']({role:msg['role'],content:msg['content'],timestamp:msg['timestamp']});saveSmsMem(state['contacts'][smsChatIdx]['name'],mem);}
        el['classList']['remove']('pinned');
        toast('已记住');
      });
      var delBtn=document['createElement']('span');
      delBtn['className']='pa-sms-btn';
      delBtn['style']['background']='rgba(255,59,48,.25)';
      delBtn['textContent']='🗑删除';
      delBtn['addEventListener']('click',function(e){
        e['stopPropagation'];
        el['classList']['remove']('pinned');
        /* 从 smsMsgs 中删除该条 */
        var idx=-1;
        for(var d=0;d<smsMsgs['length'];d++){
          if(smsMsgs[d]===msg){idx=d;break;}
        }
        if(idx>=0){
          smsMsgs['splice'](idx,1);
          saveSmsMem(state['contacts'][smsChatIdx]['name'],smsMsgs);
          renderSmsMessages();
          renderSmsList();
          toast('已删除');
        }
      });
      var cancel=document['createElement']('span');
      cancel['className']='pa-sms-btn';
      cancel['textContent']='取消';
      cancel['addEventListener']('click',function(e){e['stopPropagation'];el['classList']['remove']('pinned');});
      bar['appendChild'](pin);bar['appendChild'](delBtn);bar['appendChild'](cancel);
      el['appendChild'](bar);
    })(div,m);
    box['appendChild'](div);
  }
  /* 最后一条 + 已送达 */
  if(smsMsgs['length']>0&&smsMsgs[smsMsgs['length']-1]['role']==='user'){
    var del=document['createElement']('div');
    del['className']='phone-app-sms-delivered';
    del['textContent']='已送达';
    box['appendChild'](del);
  }
  box['scrollTop']=box['scrollHeight'];
}

/* ========== 时间格式化 ========== */
function fmtSmsTime(ts){
  if(!ts)return '';
  var d=new Date(ts);
  var now=new Date();
  var sameDay=d['getFullYear']()===now['getFullYear']()&&d['getMonth']()===now['getMonth']()&&d['getDate']()===now['getDate']();
  var hm=(d['getHours']()<10?'0':'')+d['getHours']()+':'+(d['getMinutes']()<10?'0':'')+d['getMinutes']();
  if(sameDay)return hm;
  var yesterday=new Date(now);yesterday['setDate'](now['getDate']()-1);
  var isYesterday=d['getFullYear']()===yesterday['getFullYear']()&&d['getMonth']()===yesterday['getMonth']()&&d['getDate']()===yesterday['getDate']();
  if(isYesterday)return '昨天 '+hm;
  var diffDays=Math['floor']((now['getTime']()-d['getTime']())/86400000);
  if(diffDays<7){var wd=['周日','周一','周二','周三','周四','周五','周六'];return wd[d['getDay']()]+' '+hm;}
  return (d['getMonth']()+1)+'月'+d['getDate']()+'日 '+hm;
}
/* 判断两条消息是否需要插入时间分隔：只有显示时间不同才插 */
function needTimeSep(prevTs,currTs){
  /* 当前消息没有时间戳 → 跟前面归为一组，不插 */
  if(!currTs)return false;
  /* 第一条消息 → 插 */
  if(!prevTs)return true;
  /* 同一显示时间（如同一分钟 "13:17"）→ 不重复插 */
  return fmtSmsTime(prevTs)!==fmtSmsTime(currTs);
}
/* 简化时间（短信列表用，类似微信“昨天”“09:30”） */
function fmtSmsListTime(ts){
  if(!ts)return '';
  var d=new Date(ts);var now=new Date();
  var sameDay=d['getFullYear']()===now['getFullYear']()&&d['getMonth']()===now['getMonth']()&&d['getDate']()===now['getDate']();
  if(sameDay)return (d['getHours']()<10?'0':'')+d['getHours']()+':'+(d['getMinutes']()<10?'0':'')+d['getMinutes']();
  var yesterday=new Date(now);yesterday['setDate'](now['getDate']()-1);
  var isYesterday=d['getFullYear']()===yesterday['getFullYear']()&&d['getMonth']()===yesterday['getMonth']()&&d['getDate']()===yesterday['getDate']();
  if(isYesterday)return '昨天';
  var diffDays=Math['floor']((now['getTime']()-d['getTime']())/86400000);
  if(diffDays<7){var wd=['周日','周一','周二','周三','周四','周五','周六'];return wd[d['getDay']()];}
  return (d['getMonth']()+1)+'/'+d['getDate']();
}

function addSmsBubble(role,text){

function callSmsAi(userText){
  var cfg=state['config'];
  if(!cfg['apiKey']||!cfg['model']){
    setTimeout(function(){addSmsBubble('assistant','先去通话页设置里填 API Key 和模型～');},400);
    return;
  }
  var sysPrompt=cfg['sysPrompt']||CONFIG['defaultSysPrompt'];
  var callRule='\n\n【主动打电话规则】\n你是一个有情绪、有温度的AI。你可以在短信中主动打电话给用户。触发通话的原因不限于生气，也可以是开心、想念、担心、想认真解释、觉得文字说不清、用户很久没回、用户想听你的声音等。如果你决定打电话，请在回复的最后加上特殊标记：[CALL]。加上这个标记后，系统会触发一个电话。请在需要时使用。';
  if(smsChatIdx>=0)sysPrompt='你正在和「'+state['contacts'][smsChatIdx]['name']+'」发短信。【重要：请全程用中文回复，不要用英文。】回复要短，像短信一样不超过30字。\n'+sysPrompt+callRule;
  var recent=smsMsgs['slice'](-CONFIG['maxHistory']);
  var msgs=[{role:'system',content:sysPrompt}];
  for(var i=0;i<recent['length'];i++){
    var m=recent[i];
    if(m&&m['content']&&String(m['content'])['trim']()){
      msgs['push']({role:m['role']||'user',content:String(m['content'])['trim']()});
    }
  }
  fetch(cfg['baseUrl']['replace'](/\/+$/, '')+'/chat/completions',{
    method:'POST',
    headers:{'Content-Type':'application/json','Authorization':'Bearer '+cfg['apiKey']},
    body:JSON['stringify']({model:cfg['model'],messages:msgs})
  })['then'](function(resp){
    if(!resp['ok']){return resp['json']()['then'](function(d){throw new Error(d['error']&&d['error']['message']||'HTTP '+resp['status']);});}
    return resp['json']();
  })['then'](function(data){
    var raw=(data['choices']&&data['choices'][0]&&data['choices'][0]['message']&&data['choices'][0]['message']['content']||'')['trim']();
    if(!raw)throw new Error('空回复');
    /* 检测 [CALL] 标记 */
    var wantCall=/\[CALL\]/.test(raw);
    var text=raw['replace'](/\[CALL\]/g,'')['trim']();
    addSmsBubble('assistant',text);
    if(wantCall){
      /* 延迟 1.5s 触发来电 */
      setTimeout(function(){triggerIncomingCall(text);},1500);
    }
  })['catch'](function(e){
    addSmsBubble('assistant','出错了：'+e['message']);
  });
}

/* ========== AI 主动来电 ========== */
var incomingContext = null; /* { contact, openingLine } */

function acceptIncomingCall(){
  if(!incomingContext)return;
  $('paIncomingView')['classList']['add']('phone-app-hidden');
  var c=incomingContext['contact'];
  state['fromSms']=true;
  /* 复用现有 startCall 进入通话，但跳过自动播放声，AI 先说话 */
  state['currentContact']=c;

  $('paCallName')['textContent']=c['name'];
  $('paCallNum')['textContent']=c['num']||'';

  if(c['img']){

    av['style']['backgroundColor']='transparent';
    av['classList']['add']('has-img');
  }else{
    av['style']['backgroundImage']='';
    av['style']['background']='linear-gradient(135deg,#444,#222)';

  $('paAvatarLetter')['textContent']=c['avatar']||c['name']['charAt'](0);
  state['callSeconds'] = 0;
  state['inCall'] = true;
  $('paCallStatus')['textContent']='通话中 00:00';
  $('paSubtitles')['innerHTML'] = '';
  startCallTimer();
  /* 关键：在点击事件的同步栈里先预热语音管线（iOS Safari 要求）
     speak 会先 cancel 任何正在朗读的内容
     API 很快返回时真正的开场白会 cancel 掉这句，慢返回时兜底也能朗读 */
  speak('Hey, what\'s up?');
  /* AI 用英文说开场白（opener 只做上下文） */
  var opener=(incomingContext['openingLine']||'')['replace'](/\s+/g,' ').trim();
  setTimeout(function(){
    var cfg=state['config'];
    if(!cfg['apiKey']||!cfg['model']){
      /* 没配 API Key，刚才的预热已经说了兜底 */
      return;
    }
    var sysPrompt='You are calling 「'+c['name']+'」 on the phone.'+(opener?' In the SMS you just said: '+opener+'.':'')+' Now the call is connected. Please say your opening line in English, natural and conversational, short (no more than 30 words). Reply in English only.';
    var msgs=[{role:'system',content:sysPrompt},{role:'user',content:'The call is connected. Speak your first line.'}];
    fetch(cfg['baseUrl']['replace'](/\/+$/, '')+'/chat/completions',{
      method:'POST',
      headers:{'Content-Type':'application/json','Authorization':'Bearer '+cfg['apiKey']},
      body:JSON['stringify']({model:cfg['model'],messages:msgs})
    })['then'](function(r){
      if(!r['ok']){return r['json']()['then'](function(err){var m=(err&&err['error']&&(err['error']['message']||err['error']['code']))||('HTTP '+r['status']);throw new Error(m);})['catch'](function(){throw new Error('HTTP '+r['status']);});}
      return r['json']();
    })['then'](function(d){
      var t=(d['choices']&&d['choices'][0]&&d['choices'][0]['message']&&d['choices'][0]['message']['content']||'')['trim']();
      aiReplied(t||'Hey, what\'s up?');
    })['catch'](function(){aiReplied('Hey, what\'s up?');});
  },1200);
  incomingContext=null;
}

function declineIncomingCall(){
  if(!incomingContext)return;
  $('paIncomingView')['classList']['add']('phone-app-hidden');
  /* 回到短信对话页 */
  $('paSmsChatView')['classList']['remove']('phone-app-hidden');
  incomingContext=null;
  toast('已挂断来电');
}

/* ========== 通话流程 ========== */
function startCall(contact) {
  state['currentContact'] = contact;
  /* 加载该联系人的历史记忆 */
  state['history'] = loadMemory(contact['name']);
  state['fallbackIdx'] = 0;
  $('paCallName')['textContent'] = contact['name'];
  $('paCallNum')['textContent'] = contact['num'];
  $('paAvatarLetter')['textContent'] = contact['avatar'];
  var av = $('paCallAvatar');
  if (contact['img']) {
    av['style']['backgroundImage'] = 'url(' + contact['img'] + ')';
    av['classList']['add']('has-img');
  } else {
    av['style']['backgroundImage'] = '';
    av['classList']['remove']('has-img');
  }
  $('paSubtitles')['innerHTML'] = '';
  $('paCallStatus')['textContent'] = '呼出中...';
  state['callSeconds'] = 0;
  state['inCall'] = false;
  showCall();
  setTimeout(function () {
    if (state['view'] !== 'call') return;
    state['inCall'] = true;
    $('paCallStatus')['textContent'] = '通话中 00:00';
    startCallTimer();
    var firstWord = CONFIG['aiFirstWord'];
    pushSub('ai', firstWord);
    speak(firstWord);
  }, CONFIG['callWaitMs']);
}

function startCallTimer() {
  state['callTimer'] = setInterval(function () {
    if (state['inCall']) {
      state['callSeconds']++;
      $('paCallStatus')['textContent'] = '通话中 ' + fmtTime(state['callSeconds']);
    }
  }, 1000);
}

function hangup() {
  state['inCall'] = false;
  state['listening'] = false;
  if (state['callTimer']) { clearInterval(state['callTimer']); state['callTimer'] = null; }
  if (state['recognition']) { try { state['recognition']['stop'](); } catch (e) {} }
  stopSpeaking();
  $('paCallStatus')['textContent'] = '已挂断';
  setTimeout(function () {
    if (state['fromSms']) {
      state['fromSms'] = false;
      $('paCallView')['classList']['add']('phone-app-hidden');
      $('paSmsChatView')['classList']['remove']('phone-app-hidden');
      /* 重新显示短信 */
      renderSmsMessages();
      toast('通话已结束，返回短信');
    } else {
      showDial();
    }
  }, 600);
}

/* ========== 字幕 ========== */
function pushSub(role, text, trans) {
  var div = document['createElement']('div');
  div['className'] = 'phone-app-sub ' + role;
  div['textContent'] = text;
  if (trans) {
    var t = document['createElement']('span');
    t['className'] = 'pa-trans';
    t['textContent'] = trans;
    div['appendChild'](t);
  }
  /* 操作栏（长按后显示） */
  var bar = document['createElement']('div');
  bar['className'] = 'pa-pin-bar';
  var btnPin = document['createElement']('span');
  btnPin['className'] = 'pa-pin-btn';
  btnPin['textContent'] = '📌 记住';
  btnPin['addEventListener']('click', function (e) {
    e['stopPropagation']();
    addToMemory(role, text);
    div['classList']['remove']('pinned');
    toast('已记住');
  });
  var btnCancel = document['createElement']('span');
  btnCancel['className'] = 'pa-pin-btn';
  btnCancel['textContent'] = '取消';
  btnCancel['addEventListener']('click', function (e) {
    e['stopPropagation']();
    div['classList']['remove']('pinned');
  });
  bar['appendChild'](btnPin);
  bar['appendChild'](btnCancel);
  div['appendChild'](bar);
  /* 长按选中 */
  var pressTimer = null;
  div['addEventListener']('touchstart', function () {
    pressTimer = setTimeout(function () {
      div['classList']['add']('pinned');
      if (navigator['vibrate']) navigator['vibrate'](30);
    }, 500);
  });
  div['addEventListener']('touchend', function () { clearTimeout(pressTimer); });
  div['addEventListener']('touchmove', function () { clearTimeout(pressTimer); });
  div['addEventListener']('mousedown', function () {
    pressTimer = setTimeout(function () { div['classList']['add']('pinned'); }, 600);
  });
  div['addEventListener']('mouseup', function () { clearTimeout(pressTimer); });
  div['addEventListener']('mouseleave', function () { clearTimeout(pressTimer); });

  $('paSubtitles')['appendChild'](div);
  $('paSubtitles')['scrollTop'] = $('paSubtitles')['scrollHeight'];
  return div;
}

function addToMemory(role, text) {
  if (!state['currentContact']) return;
  var name = state['currentContact']['name'];
  var mem = loadMemory(name);
  var exists = false;
  for (var i = 0; i < mem['length']; i++) {
    if (mem[i]['role'] === role && mem[i]['content'] === text) { exists = true; break; }
  }
  if (!exists) {
    mem['push']({ role: role, content: text });
    saveMemory(name, mem);
  }
}

function removeFromMemory(name, idx) {
  var mem = loadMemory(name);
  mem['splice'](idx, 1);
  saveMemory(name, mem);
  renderMemory();
}

/* 渲染记忆库页面 */
function renderMemory() {
  var list = $('paMemoryList');
  var all = {};
  try { all = JSON['parse'](localStorage['getItem'](CONFIG['memoryKey']) || '{}'); } catch (e) {}
  var hasAny = false;
  var html = '';
  for (var name in all) {
    if (!all['hasOwnProperty'](name) || !all[name]['length']) continue;
    hasAny = true;
    html += '<div class="phone-app-mem-contact"><div class="phone-app-mem-contact-name">' + name + '</div>';
    for (var i = 0; i < all[name]['length']; i++) {
      var item = all[name][i];
      var roleLabel = item['role'] === 'user' ? '我' : 'AI';
      html += '<div class="phone-app-mem-item"><span class="pa-mem-role">' + roleLabel + '</span>'
        + item['content']
        + ' <span class="pa-pin-btn" style="font-size:11px;background:rgba(255,59,48,.15);color:#ff453a;border-radius:6px;padding:2px 6px" data-del="' + name + '|' + i + '">删除</span></div>';
    }
    html += '</div>';
  }
  if (!hasAny) html = '<div class="phone-app-mem-empty">还没有记忆。<br>通话时长按消息可以记住它。</div>';
  list['innerHTML'] = html;
  /* 绑定删除按钮 */
  var dels = list['querySelectorAll']('[data-del]');
  for (var j = 0; j < dels['length']; j++) {
    (function (btn) {
      btn['addEventListener']('click', function (e) {
        e['stopPropagation']();
        var parts = btn['getAttribute']('data-del')['split']('|');
        removeFromMemory(parts[0], parseInt(parts[1]));
        toast('已删除');
      });
    })(dels[j]);
  }
}

/* 给已有字幕追加翻译 */
function appendTrans(subEl, trans) {
  if (!subEl) return;
  var t = document['createElement']('span');
  t['className'] = 'pa-trans';
  t['textContent'] = trans;
  subEl['appendChild'](t);
  $('paSubtitles')['scrollTop'] = $('paSubtitles')['scrollHeight'];
}

/* ========== 语音识别 ========== */
function initRecognition() {
  var SR = window['SpeechRecognition'] || window['webkitSpeechRecognition'];
  if (!SR) { state['recogSupport'] = false; return; }
  state['recogSupport'] = true;
  var rec = new SR();
  rec['lang'] = 'zh-CN';
  rec['interimResults'] = false;
  rec['maxAlternatives'] = 1;
  rec['onresult'] = function (e) {
    var text = e['results'][0][0]['transcript'];
    if (text && text['trim']()) {
      $('paTextInput')['value'] = text['trim']();
      handleUserText(text['trim']());
    }
  };
  rec['onend'] = function () {
    state['listening'] = false;
    updateMicBtn();
  };
  rec['onerror'] = function (e) {
    state['listening'] = false;
    updateMicBtn();
    if (e['error'] === 'not-allowed') toast('需要麦克风权限才能说话哦');
    else if (e['error'] === 'no-speech') toast('没听到声音，再试一次');
  };
  state['recognition'] = rec;
}

function toggleMic() {
  if (!state['recogSupport']) { toast('当前浏览器不支持语音识别，请打字输入'); return; }
  if (state['listening']) {
    try { state['recognition']['stop'](); } catch (e) {}
  } else {
    stopSpeaking();
    try { state['recognition']['start'](); state['listening'] = true; updateMicBtn(); }
    catch (e) { state['listening'] = false; updateMicBtn(); }
  }
}

function updateMicBtn() {
  var btn = $('paMicBtn');
  if (state['listening']) btn['classList']['add']('active');
  else btn['classList']['remove']('active');
}

/* ========== AI 对话 ========== */
function handleUserText(text) {
  pushSub('user', text);
  state['history']['push']({ role: 'user', content: text });
  var cfg = state['config'];
  if (!cfg['apiKey']) {
    var reply = CONFIG['fallbackReplies'][state['fallbackIdx'] % CONFIG['fallbackReplies']['length']];
    state['fallbackIdx']++;
    setTimeout(function () { aiReplied(reply); }, 400);
    return;
  }
  callAi(text);
}

function callAi(userText) {
  var cfg = state['config'];
  /* 没填模型名，直接提示，不发请求 */
  if (!cfg['model']) {
    aiReplied('请先在设置里填写「模型名称」，例如 SenseChat-5。');
    return;
  }
  var url = cfg['baseUrl']['replace'](/\/+$/, '') + '/chat/completions';
  /* 系统提示词：用户设置的优先，加上联系人名作为上下文 */
  var sysPrompt = cfg['sysPrompt'] || CONFIG['defaultSysPrompt'];
  if (state['currentContact'] && state['currentContact']['name']) {
    sysPrompt = 'You are on the phone with 「' + state['currentContact']['name'] + '」.\n[IMPORTANT: Reply in English only. Do not use Chinese.]\n' + sysPrompt;
  }
  var recent = state['history']['slice'](-CONFIG['maxHistory']);
  var messages = [{ role: 'system', content: sysPrompt }];
  for (var i = 0; i < recent['length']; i++) {
    var m = recent[i];
    /* 过滤掉空内容/非法role的消息，避免 API 返回 422 */
    if (m && m['content'] && String(m['content'])['trim']()) {
      var role = (m['role'] === 'assistant' || m['role'] === 'user') ? m['role'] : 'user';
      messages['push']({ role: role, content: String(m['content'])['trim']() });
    }
  }

  fetch(url, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + cfg['apiKey'] },
    body: JSON['stringify']({ model: cfg['model'], messages: messages })
  })['then'](function (resp) {
    if (!resp['ok']) {
      return resp['text']()['then'](function (bodyText) {
        var msg = 'HTTP ' + resp['status'];
        try {
          var j = JSON['parse'](bodyText);
          if (j && j['error']) {
            msg += '：' + (j['error']['message'] || j['error']['code'] || JSON['stringify'](j['error']));
          } else if (j && j['message']) {
            msg += '：' + j['message'];
          } else {
            msg += '：' + bodyText['slice'](0, 100);
          }
        } catch (e) { msg += '：' + bodyText['slice'](0, 100); }
        throw new Error(msg);
      });
    }
    return resp['json']();
  })['then'](function (data) {
    var reply = data && data['choices'] && data['choices'][0] && data['choices'][0]['message'] && data['choices'][0]['message']['content'];
    aiReplied(reply || '（没收到回复）');
  })['catch'](function (e) {
    aiReplied('出错了：' + e['message']);
  });
}

function aiReplied(text) {
  var subEl = pushSub('ai', text);
  state['history']['push']({ role: 'assistant', content: text });
  speak(text);
  /* 英文自动翻译 */
  if (state['config']['autoTrans'] && isEnglish(text)) {
    translateText(text, subEl);
  }
}

/* 调用 AI 翻译英文为中文 */
function translateText(enText, subEl) {
  var cfg = state['config'];
  if (!cfg['apiKey']) { appendTrans(subEl, '（需配置 API Key 才能翻译）'); return; }
  var url = cfg['baseUrl']['replace'](/\/+$/, '') + '/chat/completions';
  fetch(url, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + cfg['apiKey'] },
    body: JSON['stringify']({
      model: cfg['model'],
      messages: [
        { role: 'system', content: '你是翻译器，只输出中文译文，不要解释。' },
        { role: 'user', content: '翻译成中文：' + enText }
      ]
    })
  })['then'](function (resp) { return resp['ok'] ? resp['json']() : null; })
  ['then'](function (data) {
    var tr = data && data['choices'] && data['choices'][0] && data['choices'][0]['message'] && data['choices'][0]['message']['content'];
    if (tr) appendTrans(subEl, tr['trim']());
  })['catch'](function () {});
}

/* ========== TTS 朗读 ========== */
function initTts() {
  state['synthSupport'] = typeof window['speechSynthesis'] !== 'undefined';
}

function speak(text) {
  var cfg = state['config'];
  if (cfg['useCloudTts'] && cfg['ttsUrl']) { speakCloud(text); return; }
  speakBrowser(text);
}

/* 浏览器原生 TTS */
function speakBrowser(text) {
  if (!state['synthSupport']) { toast('当前浏览器不支持语音朗读，已切换为文字模式'); return; }
  try {
    window['speechSynthesis']['cancel']();
    var u = new window['SpeechSynthesisUtterance'](text);
    u['lang'] = isEnglish(text) ? 'en-US' : 'zh-CN';
    u['rate'] = 1; u['pitch'] = 1;
    window['speechSynthesis']['speak'](u);
  } catch (e) {}
}

/* 把长句按标点拆成短句，保留语气词原样，用于 TTS 停顿 */
function splitTextForTTS(text) {
  if (!text) return [];
  /* 保留语气词：（xxx）括号内容、嗯、噗、呃、啊、哦、唔、嘿、哎、欸、哈哈、嘻嘻 */
  /* 先把语气词替换成占位，避免被标点拆分误伤 */
  var preserved = [];
  var tmp = text['replace'](/（[^）]*）/g, function(m){ preserved['push'](m); return '\u0001P'+(preserved['length']-1)+'\u0001'; });
  tmp = tmp['replace'](/[嗯噗呃啊哦唔嘿哎欸哈嘻呜喔]/g, function(m){ preserved['push'](m); return '\u0001P'+(preserved['length']-1)+'\u0001'; });
  tmp = tmp['replace'](/[.]{3,}|…+/g, function(m){ preserved['push']('…'); return '\u0001P'+(preserved['length']-1)+'\u0001'; });

  /* 按句号、逗号、问号、感叹号、分号、冒号拆 */
  var rawParts = tmp['split'](/([。！？!?；;\n,.])/g);
  /* 重新配对：把标点附加到前一段 */
  var segs = [];
  for (var i = 0; i < rawParts['length']; i++) {
    var s = rawParts[i]['trim']();
    if (!s) continue;
    /* 如果是标点，附到上一个 seg */
    if (/^[。！？!?；;\n,.]$/['test'](s)) {
      if (segs['length'] > 0) segs[segs['length'] - 1] += s;
      else segs['push'](s);
    } else {
      segs['push'](s);
    }
  }
  /* 合并短段（<3字且无标点的） */
  var merged = [];
  for (var j = 0; j < segs['length']; j++) {
    var cur = segs[j]['trim'];
    if (!cur) continue;
    if (merged['length'] > 0 && cur['length'] < 3 && !/[。！？!?；;]$/['test'](merged[merged['length'] - 1])) {
      merged[merged['length'] - 1] += cur;
    } else {
      merged['push'](cur);
    }
  }
  /* 恢复占位符 → 原样文本 */
  var final = [];
  for (var k = 0; k < merged['length']; k++) {
    var seg = merged[k]['replace'](/\u0001P(\d+)\u0001/g, function(_, idx) { return preserved[parseInt(idx)] || ''; });
    seg = seg['trim']();
    if (seg) final['push'](seg);
  }
  /* 如果没拆出任何段落，返回原文本 */
  return final['length'] > 0 ? final : [text];
}

/* 云端 TTS（MiniMax T2A V2），支持语速/情感，自动按标点停顿，失败降级到浏览器朗读 */
function speakCloud(text) {
  var cfg = state['config'];
  var key = cfg['ttsApiKey'] || cfg['apiKey']; /* MiniMax key，没填就用聊天的 key */
  if (!key) { toast('TTS 需要 API Key，请在设置里填写'); speakBrowser(text); return; }

  var speed = cfg['ttsSpeed'] || CONFIG['defaultTtsSpeed'];
  var emotion = cfg['ttsEmotion'] || CONFIG['defaultTtsEmotion'];
  var segs = splitTextForTTS(text);

  /* 播放完所有段落的串行播放 */
  var audioQueue = [];
  var loadingCount = segs['length'];
  var loadFailed = false;

  function loadSeg(idx) {
    if (idx >= segs['length']) return;
    var seg = segs[idx];
    var body = JSON['stringify']({
      model: CONFIG['ttsModel'],
      text: seg,
      stream: false,
      output_format: 'hex',
      language_boost: 'auto',
      voice_setting: {
        voice_id: cfg['ttsVoiceId'],
        speed: speed,
        vol: 1,
        pitch: 0
      },
      emotion_setting: {
        emotion: emotion
      },
      audio_setting: {
        sample_rate: 32000,
        bitrate: 128000,
        format: 'mp3',
        channel: 1
      }
    });

    var url = cfg['ttsUrl'] + '?GroupId=' + encodeURIComponent(cfg['ttsGroupId']);
    fetch(url, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer ' + key
      },
      body: body
    })['then'](function (resp) {
      if (!resp['ok']) return resp['text']()['then'](function(b){throw new Error('HTTP '+resp['status']+': '+b['slice'](0,80));});
      return resp['json']();
    })['then'](function (data) {
      var base = data && data['base_resp'];
      if (base && base['status_code'] !== 0) throw new Error('业务错误：' + (base['status_msg'] || base['status_code']));
      var hex = data && data['data'] && data['data']['audio'];
      if (!hex) throw new Error('未返回音频');
      var blob = hexToBlob(hex, 'audio/mpeg');
      var audio = new window['Audio']();
      audio['src'] = URL['createObjectURL'](blob);
      audioQueue[idx] = audio;
    })['catch'](function (e) {
      loadFailed = true;
      audioQueue[idx] = null;
    })['then'](function () {
      loadingCount--;
      if (loadingCount === 0) {
        if (loadFailed && audioQueue['every'](function(a){return !a;})) {
          /* 全部失败，降级浏览器 */
          speakBrowser(text);
          return;
        }
        playQueue(audioQueue, 0);
      }
    });
  }

  for (var i = 0; i < segs['length']; i++) {
    loadSeg(i);
  }

  /* 串行播放队列 */
  function playQueue(queue, i) {
    if (i >= queue['length']) return;
    var a = queue[i];
    if (!a) { playQueue(queue, i + 1); return; }
    /* 任何新 speak 进来时 cancel 旧的：给全局变量一个标记 */
    var token = (speakCloud['_token'] = (speakCloud['_token'] || 0) + 1);
    a['onended'] = function () {
      if (speakCloud['_token'] !== token) return; /* 已被打断 */
      playQueue(queue, i + 1);
    };
    try { a['play'](); } catch (e) { playQueue(queue, i + 1); }
  }
}

/* hex 字符串转 Blob */
function hexToBlob(hex, mimeType) {
  var bytes = new Uint8Array(hex['length'] / 2);
  for (var i = 0; i < hex['length']; i += 2) {
    bytes[i / 2] = parseInt(hex['substr'](i, 2), 16);
  }
  return new Blob([bytes], { type: mimeType });
}

function stopSpeaking() {
  if (state['synthSupport']) { try { window['speechSynthesis']['cancel'](); } catch (e) {} }
  /* 中断云端 TTS 队列 */
  speakCloud['_token'] = (speakCloud['_token'] || 0) + 1;
  /* 停止所有正在播放的 audio 元素 */
  var allAudios = document['querySelectorAll']('audio');
  for (var i = 0; i < allAudios['length']; i++) {
    try { allAudios[i]['pause'](); allAudios[i]['currentTime'] = 0; } catch (e) {}
  }
}

/* ========== 头像编辑 ========== */
function onAvatarClick() {

}

function onAvatarFileChange(e) {

/* ========== 联系人记忆库 ========== */
function loadMemory(contactName) {
  try {
    var all = JSON['parse'](localStorage['getItem'](CONFIG['memoryKey']) || '{}');
    var mem = all[contactName] || [];
    return mem;
  } catch (e) { return []; }
}

function saveMemory(contactName, history) {
  try {
    var all = JSON['parse'](localStorage['getItem'](CONFIG['memoryKey']) || '{}');
    all[contactName] = history['slice'](-CONFIG['memoryMax'] * 2);
    localStorage['setItem'](CONFIG['memoryKey'], JSON['stringify'](all));
  } catch (e) {}
}

function clearMemory(contactName) {
  try {
    var all = JSON['parse'](localStorage['getItem'](CONFIG['memoryKey']) || '{}');
    delete all[contactName];
    localStorage['setItem'](CONFIG['memoryKey'], JSON['stringify'](all));
  } catch (e) {}
}

/* ========== 联系人持久化 ========== */
function loadContacts() {
  try {
    var saved = JSON['parse'](localStorage['getItem']('phone_app_contacts') || '[]');
    if (saved && saved['length']) {
      state['contacts'] = saved;
      return;
    }
  } catch (e) {}
  state['contacts'] = CONFIG['contacts']['map'](function (c) {
    return { name: c['name'], num: c['num'], avatar: c['avatar'], sys: c['sys'], img: '' };
  });
}

function saveContacts() {
  try { localStorage['setItem']('phone_app_contacts', JSON['stringify'](state['contacts'])); } catch (e) {}
}

/* ========== 联系人编辑（Apple 风格） ========== */
var cEditIdx = -1;
var cEditImg = '';

function openContactEdit(idx) {
  cEditIdx = idx;
  var c = state['contacts'][idx];
  if (!c) {
    /* 新建联系人模式 */
    cEditImg = '';
    $('paCEditName')['value'] = '';
    $('paCEditNum')['value'] = '';
    $('paCEditLetter')['textContent'] = '联';
    var av = $('paCEditAvatar');
    av['style']['backgroundImage'] = '';
    av['classList']['remove']('has-img');
    /* 新建时隐藏清除记忆按钮，显示拨打按钮的文字变一下 */
    $('paCEditClear')['style']['display'] = 'none';
    $('paCEditCall')['style']['display'] = 'none';
  } else {
    cEditImg = c['img'] || '';
    $('paCEditName')['value'] = c['name'];
    $('paCEditNum')['value'] = c['num'];
    $('paCEditLetter')['textContent'] = c['avatar'];
    var av = $('paCEditAvatar');
    if (cEditImg) {
      av['style']['backgroundImage'] = 'url(' + cEditImg + ')';
      av['classList']['add']('has-img');
    } else {
      av['style']['backgroundImage'] = '';
      av['classList']['remove']('has-img');
    }
    $('paCEditClear')['style']['display'] = '';
    $('paCEditCall')['style']['display'] = '';
  }
  $('paCEditMask')['classList']['remove']('phone-app-hidden');
}

function closeContactEdit() {
  $('paCEditMask')['classList']['add']('phone-app-hidden');
  /* 恢复按钮显示（新建时被隐藏了） */
  $('paCEditClear')['style']['display'] = '';
  $('paCEditCall')['style']['display'] = '';
}

function onCEditAvatarClick() { $('paCEditFile')['click'](); }

function onCEditFileChange(e) {
  var file = e['target'] && e['target']['files'] && e['target']['files'][0];
  if (!file) return;
  var reader = new FileReader();
  reader['onload'] = function (ev) {
    cEditImg = ev['target']['result'];
    var av = $('paCEditAvatar');
    av['style']['backgroundImage'] = 'url(' + cEditImg + ')';
    av['classList']['add']('has-img');
    toast('头像已更换，记得点保存');
  };
  reader['readAsDataURL'](file);
  e['target']['value'] = '';
}

function saveContactEdit() {
  var name = $('paCEditName')['value']['trim']();
  var num = $('paCEditNum')['value']['trim']();
  if (!name) { toast('备注名不能为空'); return; }
  if (cEditIdx < 0) {
    /* 新建 */
    var newSys = '你是「' + name + '」，用简短口语回复，每次不超过50字。';
    var newContact = { name: name, num: num, avatar: name['charAt'](0), sys: newSys, img: cEditImg || '' };
    state['contacts']['push'](newContact);
    saveContacts();
    renderKeypad();
    renderRecents();
    renderContacts();
    closeContactEdit();
    toast('联系人已添加');
  } else {
    /* 编辑 */
    var c = state['contacts'][cEditIdx];
    c['name'] = name;
    c['num'] = num;
    c['avatar'] = name['charAt'](0);
    if (cEditImg) c['img'] = cEditImg;
    saveContacts();
    renderKeypad();
    renderRecents();
    renderContacts();
    closeContactEdit();
    toast('联系人已保存');
  }
}

/* ========== 设置面板 ========== */
function openSettings() {
  var cfg = state['config'];
  $('paBaseUrl')['value'] = cfg['baseUrl'];
  $('paApiKey')['value'] = cfg['apiKey'];
  $('paModel')['value'] = cfg['model'];
  $('paSysPrompt')['value'] = cfg['sysPrompt'];
  $('paUseCloudTts')['checked'] = cfg['useCloudTts'];
  $('paTtsUrl')['value'] = cfg['ttsUrl'];
  $('paTtsApiKey')['value'] = cfg['ttsApiKey'] || '';
  $('paTtsGroupId')['value'] = cfg['ttsGroupId'];
  $('paTtsVoiceId')['value'] = cfg['ttsVoiceId'];
  $('paTtsSpeed')['value'] = cfg['ttsSpeed'];
  $('paTtsSpeedLabel')['textContent'] = cfg['ttsSpeed'];
  $('paTtsEmotion')['value'] = cfg['ttsEmotion'];
  $('paAutoTrans')['checked'] = cfg['autoTrans'];
  $('paSettingsMask')['classList']['remove']('phone-app-hidden');
}

function closeSettings() { $('paSettingsMask')['classList']['add']('phone-app-hidden'); }

function saveSettings() {
  state['config']['baseUrl'] = $('paBaseUrl')['value']['trim']();
  state['config']['apiKey'] = $('paApiKey')['value']['trim']();
  state['config']['model'] = $('paModel')['value']['trim']();
  state['config']['sysPrompt'] = $('paSysPrompt')['value']['trim']() || CONFIG['defaultSysPrompt'];
  state['config']['useCloudTts'] = $('paUseCloudTts')['checked'];
  state['config']['ttsUrl'] = $('paTtsUrl')['value']['trim']();
  state['config']['ttsApiKey'] = $('paTtsApiKey')['value']['trim']();
  state['config']['ttsGroupId'] = $('paTtsGroupId')['value']['trim']();
  state['config']['ttsVoiceId'] = $('paTtsVoiceId')['value']['trim']();
  state['config']['ttsSpeed'] = parseFloat($('paTtsSpeed')['value']);
  state['config']['ttsEmotion'] = $('paTtsEmotion')['value'];
  state['config']['autoTrans'] = $('paAutoTrans')['checked'];
  saveConfig();
  toast('已保存');
  closeSettings();
}

/* ========== 初始化（带重试机制） ========== */
var bootTries = 0;
function boot() {
  bootTries++;
  if (!$('paRoot')) {
    if (bootTries < 40) setTimeout(boot, 50); /* DOM 未就绪，50ms 后重试 */
    return;
  }
  loadConfig();
  loadContacts();
  loadSmsMemAll();
  renderKeypad();
  renderRecents();
  renderContacts();
  initRecognition();
  initTts();

  /* 底部 tab 切换 */
  var tabs = document['querySelectorAll']('.phone-app-tab');
  for (var i = 0; i < tabs['length']; i++) {
    (function (t) {
      t['addEventListener']('click', function () { switchTab(t['getAttribute']('data-tab')); });
    })(tabs[i]);
  }

  /* 拨号按钮 */
  $('paCallBtn')['addEventListener']('click', function () {
    startCall(state['contacts'][0]);
  });
  /* 挂断 */
  $('paHangupBtn')['addEventListener']('click', hangup);
  /* 麦克风 */
  $('paMicBtn')['addEventListener']('click', toggleMic);
  /* 文本发送 */
  $('paTextSend')['addEventListener']('click', function () {
    var v = $('paTextInput')['value']['trim']();
    if (v) { $('paTextInput')['value'] = ''; handleUserText(v); }
  });
  $('paTextInput')['addEventListener']('keydown', function (e) {
    if (e['key'] === 'Enter') $('paTextSend')['click']();
  });
  /* 静音/免提 */
  $('paMuteBtn')['addEventListener']('click', function () { $('paMuteBtn')['classList']['toggle']('active'); });
  $('paSpeakerBtn')['addEventListener']('click', function () { $('paSpeakerBtn')['classList']['toggle']('active'); });
  /* 头像编辑 */
  $('paCallAvatar')['addEventListener']('click', onAvatarClick);
  $('paAvatarFile')['addEventListener']('change', onAvatarFileChange);
  /* 设置 */
  $('paSettingsBtn')['addEventListener']('click', openSettings);
  /* 新建联系人 */
  $('paAddContactBtn')['addEventListener']('click', function () { openContactEdit(-1); });
  $('paCloseSettings')['addEventListener']('click', closeSettings);
  $('paSaveSettings')['addEventListener']('click', saveSettings);
  /* 语速滑块实时更新 */
  $('paTtsSpeed')['addEventListener']('input', function () {
    $('paTtsSpeedLabel')['textContent'] = parseFloat(this['value']).toFixed(2);
  });
  $('paSettingsMask')['addEventListener']('click', function (e) {
    if (e['target'] === $('paSettingsMask')) closeSettings();
  });
  /* 联系人编辑 */
  $('paCEditClose')['addEventListener']('click', closeContactEdit);
  $('paCEditSave')['addEventListener']('click', saveContactEdit);
  $('paCEditAvatar')['addEventListener']('click', onCEditAvatarClick);
  $('paCEditFile')['addEventListener']('change', onCEditFileChange);
  $('paCEditMask')['addEventListener']('click', function (e) {
    if (e['target'] === $('paCEditMask')) closeContactEdit();
  });
  $('paCEditCall')['addEventListener']('click', function () {
    if (cEditIdx < 0) return;
    var c = state['contacts'][cEditIdx];
    closeContactEdit();
    startCall(c);
  });
  $('paCEditClear')['addEventListener']('click', function () {
    if (cEditIdx < 0) return;
    var c = state['contacts'][cEditIdx];
    clearMemory(c['name']);
    state['history'] = [];
    toast('已清除「' + c['name'] + '」的记忆');
  });
  /* 短信对话 */
  $('paSmsBack')['addEventListener']('click', closeSmsChat);
  $('paSmsSend')['addEventListener']('click', sendSms);
  $('paSmsInput')['addEventListener']('keydown', function (e) { if (e['key'] === 'Enter') sendSms(); });
  $('paSmsPlus')['addEventListener']('click', function () { toast('（+ 号功能开发中）'); });
  /* 右上角拨打电话 */
  $('paSmsCall')['addEventListener']('click', function () {
    if (smsChatIdx < 0) return;
    var c = state['contacts'][smsChatIdx];
    state['fromSms'] = true;
    closeSmsChat();
    startCall(c);
  });
  /* 来电按钮 */
  $('paIncomingAccept')['addEventListener']('click', acceptIncomingCall);
  $('paIncomingDecline')['addEventListener']('click', declineIncomingCall);
}

if (document['readyState'] === 'loading') {
  document['addEventListener']('DOMContentLoaded', boot);
} else {
  boot();
}
</script>
</body>
</html>
