<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>模拟苹果电话</title>
<style>
/* ========== 核心参数（颜色/尺寸都在这里改） ========== */
.phone-app{
  --pa-bg-top:#1C1C1E;
  --pa-bg-bottom:#000000;
  --pa-text:#FFFFFF;
  --pa-muted:#8E8E93;
  --pa-key-bg:#333333;
  --pa-key-press:#4A4A4A;
  --pa-call-green:#34C759;
  --pa-hang-red:#FF3B30;
  --pa-accent:#0A84FF;
  --pa-panel-bg:#2C2C2E;
  --pa-border:rgba(255,255,255,0.12);
  --pa-radius:18px;
  --pa-key-size:64px;
  --pa-call-btn-size:72px;
  font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
  color:var(--pa-text);
  background:linear-gradient(180deg,var(--pa-bg-top),var(--pa-bg-bottom));
  max-width:420px;
  margin:0 auto;
  min-height:100vh;
  min-height:100dvh;
  position:relative;
  overflow:hidden;
  user-select:none;
  -webkit-tap-highlight-color:transparent;
}
.phone-app *{box-sizing:border-box}
.phone-app button{font-family:inherit;touch-action:manipulation;cursor:pointer;border:none;outline:none}
.phone-app input,.phone-app textarea{font-family:inherit}

/* ========== 通用 ========== */
.phone-app-hidden{display:none!important}
.phone-app-toast{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,.85);color:#fff;padding:12px 20px;border-radius:12px;font-size:14px;z-index:9999;pointer-events:none;opacity:0;transition:opacity .25s}
.phone-app-toast.show{opacity:1}

/* ========== 顶部栏 ========== */
.phone-app-topbar{display:flex;align-items:center;justify-content:space-between;padding:16px 20px 8px}
.phone-app-topbar h1{font-size:18px;font-weight:600;margin:0}
.phone-app-settings-btn{width:36px;height:36px;border-radius:50%;background:transparent;color:var(--pa-muted);font-size:20px;display:flex;align-items:center;justify-content:center}
.phone-app-settings-btn:active{color:#fff}

/* ========== 底部导航栏 ========== */
.phone-app-tabs{display:flex;border-top:1px solid var(--pa-border);background:rgba(0,0,0,.6);padding:6px 0 calc(6px + env(safe-area-inset-bottom))}
.phone-app-tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--pa-muted);background:transparent;padding:6px 0}
.phone-app-tab .pa-tab-ico{font-size:20px;line-height:1}
.phone-app-tab .pa-tab-label{font-size:10px}
.phone-app-tab.active{color:var(--pa-accent)}

/* ========== tab 内容区（拨号页） ========== */
.phone-app-tabpane{display:none;flex:1;flex-direction:column;overflow:hidden}
.phone-app-tabpane.active{display:flex}

/* ========== 最近通话 / 联系人 列表 ========== */
.phone-app-list{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:8px 0}
.phone-app-recent-title{font-size:13px;color:var(--pa-muted);padding:8px 20px 4px}
.phone-app-contact{display:flex;align-items:center;justify-content:space-between;padding:10px 20px;background:transparent;touch-action:manipulation}
.phone-app-contact:active{background:rgba(255,255,255,0.08)}
.phone-app-contact-left{display:flex;align-items:center;gap:12px}
.phone-app-contact-avatar{width:40px;height:40px;border-radius:50%;background:var(--pa-accent);display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:600;color:#fff;overflow:hidden;background-size:cover;background-position:center}
.phone-app-contact-info{display:flex;flex-direction:column}
.phone-app-contact-name{font-size:16px}
.phone-app-contact-num{font-size:12px;color:var(--pa-muted)}
.phone-app-contact-type{font-size:12px;color:var(--pa-muted);margin-right:4px}

/* ========== 拨号键盘 ========== */
.phone-app-display{text-align:center;padding:24px 20px 12px;min-height:60px}
.phone-app-digits{font-size:42px;font-weight:300;letter-spacing:2px;min-height:50px;word-break:break-all}
.phone-app-keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:16px 0;padding:8px 40px;justify-items:center}
.phone-app-key{width:var(--pa-key-size);height:var(--pa-key-size);border-radius:50%;background:var(--pa-key-bg);color:#fff;font-size:24px;font-weight:400;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.phone-app-key:active{background:var(--pa-key-press)}
.phone-app-key .pa-sub{font-size:10px;color:var(--pa-muted);margin-top:2px;letter-spacing:1px}
.phone-app-call-row{display:flex;justify-content:center;padding:20px 0 12px}
.phone-app-call-btn{width:var(--pa-call-btn-size);height:var(--pa-call-btn-size);border-radius:50%;background:var(--pa-call-green);display:flex;align-items:center;justify-content:center;box-shadow:0 4px 14px rgba(52,199,89,.4)}
.phone-app-call-btn:active{opacity:.85}

/* ========== 通话页 ========== */
.phone-app-call{display:flex;flex-direction:column;height:100vh;height:100dvh}
.phone-app-call-header{text-align:center;padding:40px 20px 12px}
.phone-app-call-name{font-size:26px;font-weight:500;margin-bottom:6px}
.phone-app-call-num{font-size:14px;color:var(--pa-muted);margin-bottom:4px}
.phone-app-call-status{font-size:15px;color:var(--pa-muted);min-height:20px}
.phone-app-call-avatar{width:120px;height:120px;border-radius:50%;background:linear-gradient(135deg,#555,#333);margin:0 auto;display:flex;align-items:center;justify-content:center;font-size:48px;font-weight:300;margin-bottom:16px;overflow:hidden;background-size:cover;background-position:center;position:relative;touch-action:manipulation}
.phone-app-call-avatar .pa-avatar-edit{position:absolute;bottom:0;left:0;right:0;background:rgba(0,0,0,.5);font-size:11px;padding:3px 0;color:#fff;text-align:center;opacity:0;transition:opacity .2s}
.phone-app-call-avatar:active .pa-avatar-edit{opacity:1}
.phone-app-call-avatar.has-img .pa-avatar-letter{display:none}

.phone-app-subtitles{flex:1;overflow-y:auto;padding:12px 20px;display:flex;flex-direction:column;gap:10px;-webkit-overflow-scrolling:touch}
.phone-app-sub{padding:10px 14px;border-radius:14px;max-width:85%;font-size:15px;line-height:1.4}
.phone-app-sub.user{align-self:flex-end;background:var(--pa-accent);color:#fff}
.phone-app-sub.ai{align-self:flex-start;background:rgba(255,255,255,0.12);color:#fff}
.phone-app-sub .pa-trans{display:block;font-size:12px;color:var(--pa-muted);margin-top:6px;padding-top:6px;border-top:1px solid rgba(255,255,255,.12)}
.phone-app-sub.user .pa-trans{color:rgba(255,255,255,.7);border-top-color:rgba(255,255,255,.2)}

/* 记忆 pin 按钮 */
.phone-app-sub .pa-pin{display:inline-block;font-size:11px;color:var(--pa-muted);background:rgba(255,255,255,.08);border-radius:8px;padding:2px 8px;margin-top:6px;cursor:pointer;touch-action:manipulation;user-select:none}
.phone-app-sub .pa-pin:active{opacity:.6}
.phone-app-sub.pinned{box-shadow:0 0 0 2px var(--pa-accent) inset}
.phone-app-sub.pinned .pa-pin{color:var(--pa-accent);background:rgba(100,120,255,.15)}

/* ========== 输入区（语音+打字双模式） ========== */
.phone-app-input-bar{display:flex;align-items:center;gap:8px;padding:10px 16px}
.phone-app-input-bar input{flex:1;background:rgba(255,255,255,0.1);border:1px solid var(--pa-border);border-radius:20px;padding:10px 16px;color:#fff;font-size:14px;outline:none;min-width:0}
.phone-app-input-bar input::placeholder{color:var(--pa-muted)}
.phone-app-input-bar .pa-kb-btn{background:var(--pa-key-bg);color:#fff;border-radius:50%;width:40px;height:40px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.phone-app-input-bar .pa-kb-btn.active{background:var(--pa-hang-red);animation:pa-pulse 1s infinite}
.phone-app-input-bar .pa-send-btn{background:var(--pa-accent);color:#fff;border-radius:20px;padding:0 16px;height:40px;font-size:14px;flex-shrink:0}
@keyframes pa-pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,59,48,.5)}50%{box-shadow:0 0 0 12px rgba(255,59,48,0)}}

.phone-app-call-controls{display:flex;justify-content:space-around;padding:12px 30px 8px}
.phone-app-ctrl-btn{display:flex;flex-direction:column;align-items:center;gap:6px;color:var(--pa-muted);background:transparent!important;-webkit-appearance:none;appearance:none;padding:0}
.phone-app-ctrl-btn .pa-ico{width:48px;height:48px;border-radius:50%!important;background-color:#3a3a3c!important;display:flex;align-items:center;justify-content:center;overflow:hidden;color:#fff!important}
.phone-app-ctrl-btn .pa-ico svg{fill:#fff!important;width:24px;height:24px}
.phone-app-ctrl-btn .pa-label{font-size:11px}
.phone-app-ctrl-btn.active .pa-ico{background-color:#fff!important;color:#000!important}
.phone-app-ctrl-btn.active .pa-ico svg{fill:#000!important}
.phone-app-ctrl-btn.active .pa-label{color:#fff}

.phone-app-hangup-row{display:flex;justify-content:center;padding:12px 0 20px}
.phone-app-hangup-btn{width:var(--pa-call-btn-size);height:var(--pa-call-btn-size);border-radius:50%;background:var(--pa-hang-red);display:flex;align-items:center;justify-content:center;box-shadow:0 4px 14px rgba(255,59,48,.4)}
.phone-app-hangup-btn:active{opacity:.85}

/* ========== 设置面板 ========== */
.phone-app-settings-mask{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:200;display:flex;align-items:flex-end;justify-content:center}
.phone-app-settings{background:var(--pa-panel-bg);width:100%;max-width:420px;border-radius:var(--pa-radius) var(--pa-radius) 0 0;padding:20px;max-height:85vh;overflow-y:auto}
.phone-app-settings h2{margin:0 0 16px;font-size:18px}
.phone-app-settings-row{margin-bottom:14px}
.phone-app-settings-row label{display:block;font-size:13px;color:var(--pa-muted);margin-bottom:6px}
.phone-app-settings-row input,.phone-app-settings-row textarea{width:100%;background:rgba(0,0,0,.3);border:1px solid var(--pa-border);border-radius:10px;padding:10px 12px;color:#fff;font-size:14px;outline:none}
.phone-app-settings-row textarea{min-height:60px;resize:vertical}
.phone-app-settings-row input:focus,.phone-app-settings-row textarea:focus{border-color:var(--pa-accent)}
.phone-app-settings-save{width:100%;background:var(--pa-accent);color:#fff;border-radius:12px;padding:14px;font-size:16px;font-weight:500;margin-top:8px}
.phone-app-settings-save:active{opacity:.8}
.phone-app-close-settings{position:absolute;top:16px;right:20px;color:var(--pa-muted);font-size:22px;background:none}

/* ========== 联系人编辑（Apple 风格卡片） ========== */
.phone-app-cedit-mask{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:210;display:flex;align-items:flex-end;justify-content:center}
.phone-app-cedit{background:var(--pa-panel-bg);width:100%;max-width:420px;border-radius:var(--pa-radius) var(--pa-radius) 0 0;padding:20px;max-height:85vh;overflow-y:auto;-webkit-overflow-scrolling:touch}
.phone-app-cedit-close{position:absolute;top:16px;right:20px;color:var(--pa-muted);font-size:22px;background:none}
.phone-app-cedit-avatar-wrap{display:flex;flex-direction:column;align-items:center;gap:10px;margin-bottom:20px}
.phone-app-cedit-avatar{width:100px;height:100px;border-radius:50%;background:linear-gradient(135deg,#555,#333);display:flex;align-items:center;justify-content:center;font-size:40px;font-weight:300;color:#fff;overflow:hidden;background-size:cover;background-position:center;position:relative;touch-action:manipulation}
.phone-app-cedit-avatar.has-img .pa-cedit-letter{display:none}
.phone-app-cedit-avatar .pa-cedit-cam{position:absolute;bottom:0;left:0;right:0;background:rgba(0,0,0,.5);font-size:11px;padding:3px 0;color:#fff;text-align:center}
.phone-app-cedit-avatar-hint{font-size:12px;color:var(--pa-muted)}
.phone-app-cedit-row{margin-bottom:14px}
.phone-app-cedit-row label{display:block;font-size:13px;color:var(--pa-muted);margin-bottom:6px}
.phone-app-cedit-row input{width:100%;background:rgba(0,0,0,.3);border:1px solid var(--pa-border);border-radius:10px;padding:10px 12px;color:#fff;font-size:14px;outline:none}
.phone-app-cedit-row input:focus{border-color:var(--pa-accent)}
.phone-app-cedit-save{width:100%;background:var(--pa-accent);color:#fff;border-radius:12px;padding:14px;font-size:16px;font-weight:500;margin-top:8px}
.phone-app-cedit-save:active{opacity:.8}
.phone-app-cedit-call{width:100%;background:var(--pa-call-green);color:#fff;border-radius:12px;padding:14px;font-size:16px;font-weight:500;margin-top:8px;display:flex;align-items:center;justify-content:center;gap:6px}
.phone-app-cedit-call:active{opacity:.8}
.phone-app-contact-avatar.editable{cursor:pointer;touch-action:manipulation}
</style>
</head>
<body>
<div class="phone-app" id="paRoot">

  <!-- ===== 拨号页（含底部导航） ===== -->
  <div class="phone-app-dial phone-app-call" id="paDialView">
    <div class="phone-app-topbar">
      <h1 id="paDialTitle">最近通话</h1>
      <button class="phone-app-settings-btn" id="paSettingsBtn" title="设置">⚙</button>
    </div>

    <!-- 最近通话 tab -->
    <div class="phone-app-tabpane active" id="paTabRecents">
      <div class="phone-app-list" id="paRecentList"></div>
    </div>

    <!-- 联系人 tab -->
    <div class="phone-app-tabpane" id="paTabContacts">
      <div class="phone-app-recent-title">联系人</div>
      <div class="phone-app-list" id="paContactList"></div>
    </div>

    <!-- 键盘 tab -->
    <div class="phone-app-tabpane" id="paTabKeypad">
      <div class="phone-app-display">
        <div class="phone-app-digits" id="paDigits"></div>
      </div>
      <div class="phone-app-keypad" id="paKeypad"></div>
      <div class="phone-app-call-row">
        <button class="phone-app-call-btn" id="paCallBtn" title="拨号">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="#fff"><path d="M20.01 15.38c-1.23 0-2.42-.2-3.53-.56-.35-.12-.74-.03-1.01.24l-1.57 1.97c-2.83-1.35-5.48-3.9-6.89-6.83l1.95-1.66c.27-.28.35-.67.24-1.02-.37-1.11-.56-2.3-.56-3.53 0-.54-.45-.99-.99-.99H4.19C3.65 3 3 3.24 3 3.99 3 13.28 10.73 21 20.01 21c.71 0 .99-.63.99-1.18v-3.45c0-.54-.45-.99-.99-.99z"/></svg>
        </button>
      </div>
    </div>

    <!-- 底部导航 -->
    <div class="phone-app-tabs">
      <button class="phone-app-tab active" data-tab="recents">
        <svg class="pa-tab-ico" width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M20.01 15.38c-1.23 0-2.42-.2-3.53-.56-.35-.12-.74-.03-1.01.24l-1.57 1.97c-2.83-1.35-5.48-3.9-6.89-6.83l1.95-1.66c.27-.28.35-.67.24-1.02-.37-1.11-.56-2.3-.56-3.53 0-.54-.45-.99-.99-.99H4.19C3.65 3 3 3.24 3 3.99 3 13.28 10.73 21 20.01 21c.71 0 .99-.63.99-1.18v-3.45c0-.54-.45-.99-.99-.99z"/></svg>
        <span class="pa-tab-label">通话</span>
      </button>
      <button class="phone-app-tab" data-tab="contacts">
        <svg class="pa-tab-ico" width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
        <span class="pa-tab-label">联系人</span>
      </button>
      <button class="phone-app-tab" data-tab="keypad">
        <svg class="pa-tab-ico" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="5" r="1.4"/><circle cx="5" cy="12" r="1.4"/><circle cx="19" cy="12" r="1.4"/><circle cx="12" cy="19" r="1.4"/></svg>
        <span class="pa-tab-label">键盘</span>
      </button>
    </div>
  </div>

  <!-- ===== 通话页 ===== -->
  <div class="phone-app-call phone-app-hidden" id="paCallView">
    <div class="phone-app-call-header">
      <div class="phone-app-call-name" id="paCallName">老公</div>
      <div class="phone-app-call-num" id="paCallNum">138 0013 8000</div>
      <div class="phone-app-call-status" id="paCallStatus">呼出中...</div>
    </div>
    <div class="phone-app-call-avatar" id="paCallAvatar">
      <span class="pa-avatar-letter" id="paAvatarLetter">老</span>
      <span class="pa-avatar-edit">更换头像</span>
    </div>

    <div class="phone-app-subtitles" id="paSubtitles"></div>

    <!-- 输入区：语音 + 打字 双模式 -->
    <div class="phone-app-input-bar" id="paInputBar">
      <input type="text" id="paTextInput" placeholder="输入文字或点左边麦克风说话..." />
      <button class="pa-kb-btn" id="paMicBtn" title="语音输入">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm5.91-3c-.49 0-.9.36-.98.85C16.52 14.2 14.47 16 12 16s-4.52-1.8-4.93-4.15c-.08-.49-.49-.85-.98-.85-.61 0-1.09.54-1 1.14.49 3 2.89 5.35 5.91 5.78V20c0 .55.45 1 1 1s1-.45 1-1v-2.08c3.02-.43 5.42-2.78 5.91-5.78.1-.6-.39-1.14-1-1.14z"/></svg>
      </button>
      <button class="pa-send-btn" id="paTextSend">发送</button>
    </div>

    <div class="phone-app-call-controls">
      <button class="phone-app-ctrl-btn" id="paMuteBtn">
        <span class="pa-ico"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M19 11h-1.7c0 .74-.16 1.43-.43 2.05l1.23 1.23c.56-.98.9-2.09.9-3.28zm-4.02.17c0-.06.02-.11.02-.17V5c0-1.66-1.34-3-3-3S9 3.34 9 5v.18l5.98 5.99zM4.27 3L3 4.27l6.01 6.01V11c0 1.66 1.33 3 2.99 3 .22 0 .44-.03.65-.08l1.66 1.66c-.71.33-1.5.52-2.31.52-2.76 0-5.3-2.1-5.3-5.1H5c0 3.41 2.72 6.23 6 6.72V21h2v-3.28c.91-.13 1.77-.45 2.54-.9L19.73 21 21 19.73 4.27 3z"/></svg></span>
        <span class="pa-label">静音</span>
      </button>
      <button class="phone-app-ctrl-btn" id="paSpeakerBtn">
        <span class="pa-ico"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg></span>
        <span class="pa-label">免提</span>
      </button>
    </div>

    <div class="phone-app-hangup-row">
      <button class="phone-app-hangup-btn" id="paHangupBtn" title="挂断">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="#fff" style="transform:rotate(135deg)"><path d="M20.01 15.38c-1.23 0-2.42-.2-3.53-.56-.35-.12-.74-.03-1.01.24l-1.57 1.97c-2.83-1.35-5.48-3.9-6.89-6.83l1.95-1.66c.27-.28.35-.67.24-1.02-.37-1.11-.56-2.3-.56-3.53 0-.54-.45-.99-.99-.99H4.19C3.65 3 3 3.24 3 3.99 3 13.28 10.73 21 20.01 21c.71 0 .99-.63.99-1.18v-3.45c0-.54-.45-.99-.99-.99z"/></svg>
      </button>
    </div>
  </div>

  <!-- ===== 设置面板 ===== -->
  <div class="phone-app-settings-mask phone-app-hidden" id="paSettingsMask">
    <div class="phone-app-settings" id="paSettingsPanel">
      <button class="phone-app-close-settings" id="paCloseSettings">×</button>
      <h2>设置</h2>
      <div class="phone-app-settings-row">
        <label>API Base URL</label>
        <input type="text" id="paBaseUrl" value="https://token.sensenova.cn/v1" />
      </div>
      <div class="phone-app-settings-row">
        <label>API Key</label>
        <input type="password" id="paApiKey" placeholder="sk-..." />
      </div>
      <div class="phone-app-settings-row">
        <label>模型名称</label>
        <input type="text" id="paModel" placeholder="例如 SenseChat-5" />
      </div>
      <div class="phone-app-settings-row">
        <label>系统提示词</label>

  </div>

  <!-- ===== 联系人编辑（Apple 风格） ===== -->
  <div class="phone-app-cedit-mask phone-app-hidden" id="paCEditMask">
    <div class="phone-app-cedit" id="paCEditPanel">
      <button class="phone-app-cedit-close" id="paCEditClose">×</button>
      <div class="phone-app-cedit-avatar-wrap">
        <div class="phone-app-cedit-avatar" id="paCEditAvatar">
          <span class="pa-cedit-letter" id="paCEditLetter">联</span>
          <span class="pa-cedit-cam">更换头像</span>
        </div>
        <div class="phone-app-cedit-avatar-hint">点击头像更换图片</div>

      <div class="phone-app-cedit-row">
        <label>备注名</label>
        <input type="text" id="paCEditName" placeholder="联系人名称" />

      <div class="phone-app-cedit-row">

      <button class="phone-app-cedit-call" id="paCEditCall">📞 拨打</button>
      <button class="phone-app-cedit-save" id="paCEditSave">保存</button>
      <button class="phone-app-cedit-clear" id="paCEditClear" style="width:100%;background:rgba(255,59,48,.15);color:#ff453a;border-radius:12px;padding:12px;font-size:14px;margin-top:8px;border:1px solid rgba(255,59,48,.3)">清除记忆</button>
    </div>
  </div>

  <div class="phone-app-toast" id="paToast"></div>
  <input type="file" id="paAvatarFile" accept="image/*" style="display:none" />
  <input type="file" id="paCEditFile" accept="image/*" style="display:none" />

</div>

<script>
'use strict';

/* ============================================================
   核心配置（都在这里改）
   localStorage 键名：phone_app_config，存 { baseUrl, apiKey, model, sysPrompt, useCloudTts, ttsApiKey, ttsUrl, ttsGroupId, ttsVoiceId, autoTrans }
   ============================================================ */
var CONFIG = {
  defaultBaseUrl: 'https://token.sensenova.cn/v1',
  defaultSysPrompt: '你是电话那头的人，用口语化的方式简短回复，像真实通话一样，每次不超过50字。如需指定语言，请在此处写明（例如：全程用英文回复）。',
  defaultTtsUrl: 'https://api.minimax.cn/v1/t2a_v2', /* MiniMax T2A V2 接口（国内主站 .cn） */
  defaultTtsBackupUrl: 'https://api-bj.minimaxi.com/v1/t2a_v2', /* MiniMax 备用接口 */
  defaultTtsGroupId: '210158230773437642',              /* MiniMax Group ID */
  defaultTtsVoiceId: 'male-qn-qingse',                  /* MiniMax 音色 ID */
  ttsModel: 'speech-2.8-hd',                            /* MiniMax TTS 模型 */
  maxHistory: 8,          /* 发给 AI 的最近对话轮数 */
  memoryKey: 'phone_app_memory', /* 联系人记忆库 localStorage 键名 */
  memoryMax: 20,          /* 每个联系人最多保存多少轮对话 */
  callWaitMs: 1500,       /* 呼出后多少毫秒自动接听 */
  contacts: [             /* 预设联系人（真实备注名+电话） */
    { name: '老公', num: '138 0013 8000', avatar: '老', sys: '你是「老公」，温柔体贴，用简短口语回复，像打电话一样，每次不超过50字。' },
    { name: '哥哥', num: '139 0013 9000', avatar: '哥', sys: '你是「哥哥」，亲切靠谱，简短回复，每次不超过50字。' },
    { name: '妈妈', num: '137 0013 7000', avatar: '妈', sys: '你是「妈妈」，关心唠叨但温暖，简短回复，每次不超过50字。' },
    { name: '老板', num: '136 0013 6000', avatar: '板', sys: '你是「老板」，干练直接，简短回复，每次不超过50字。' },
    { name: '外卖小哥', num: '10086', avatar: '外', sys: '你是外卖小哥，告诉我餐到哪了，简短回复。' },
    { name: '10010', num: '10010', avatar: '联', sys: '你是联通客服，简短回复用户的话费流量问题。' }
  ],
  fallbackReplies: [      /* 没填 API Key 时的固定回复 */
    '你还没配置 API Key 呢，去设置里填一下吧。',
    '需要先填 API Key 我才能说话哦。',
    '设置入口在拨号页右上角的齿轮图标。'
  ],
  aiFirstWord: '喂？'
};

/* ========== 全局状态 ========== */
var state = {
  config: null,
  digits: '',
  view: 'dial',
  tab: 'recents',
  callTimer: null,
  callSeconds: 0,
  inCall: false,
  history: [],
  currentContact: null,
  recognition: null,
  synthSupport: false,
  recogSupport: false,
  fallbackIdx: 0,
  listening: false
};

/* ========== 工具函数 ========== */
function $(id) { return document['getElementById'](id); }

function toast(msg) {
  var t = $('paToast');
  t['textContent'] = msg;
  t['classList']['add']('show');
  clearTimeout(toast['_t']);
  toast['_t'] = setTimeout(function () { t['classList']['remove']('show'); }, 2000);
}

function loadConfig() {
  try {
    var raw = localStorage['getItem']('phone_app_config');
    if (raw) state['config'] = JSON['parse'](raw);
  } catch (e) {}
  if (!state['config']) {
    state['config'] = {
      baseUrl: CONFIG['defaultBaseUrl'],
      apiKey: '', model: '',
      sysPrompt: CONFIG['defaultSysPrompt'],
      useCloudTts: false,
      ttsApiKey: '',
      ttsUrl: CONFIG['defaultTtsUrl'],
      ttsGroupId: CONFIG['defaultTtsGroupId'],
      ttsVoiceId: CONFIG['defaultTtsVoiceId'],
      autoTrans: false
    };
  }
  state['config']['baseUrl'] = state['config']['baseUrl'] || CONFIG['defaultBaseUrl'];
  state['config']['sysPrompt'] = state['config']['sysPrompt'] || CONFIG['defaultSysPrompt'];
  state['config']['ttsUrl'] = state['config']['ttsUrl'] || CONFIG['defaultTtsUrl'];
  state['config']['ttsGroupId'] = state['config']['ttsGroupId'] || CONFIG['defaultTtsGroupId'];
  state['config']['ttsVoiceId'] = state['config']['ttsVoiceId'] || CONFIG['defaultTtsVoiceId'];
  if (typeof state['config']['useCloudTts'] !== 'boolean') state['config']['useCloudTts'] = false;
  if (typeof state['config']['autoTrans'] !== 'boolean') state['config']['autoTrans'] = false;
}

function saveConfig() {
  try { localStorage['setItem']('phone_app_config', JSON['stringify'](state['config'])); } catch (e) {}
}

function fmtTime(sec) {
  var m = Math['floor'](sec / 60), s = sec % 60;
  return (m < 10 ? '0' : '') + m + ':' + (s < 10 ? '0' : '') + s;
}

/* 检测是否为英文为主的文本 */
function isEnglish(text) {
  if (!text) return false;
  var letters = text['match'](/[a-zA-Z]/g);
  var chinese = text['match'](/[\u4e00-\u9fa5]/g);
  var lc = letters ? letters['length'] : 0;
  var cc = chinese ? chinese['length'] : 0;
  return lc > cc && lc >= 2;
}

/* ========== 底部 tab 切换 ========== */
function switchTab(tab) {
  state['tab'] = tab;
  var panes = { recents: 'paTabRecents', contacts: 'paTabContacts', keypad: 'paTabKeypad' };
  var titles = { recents: '最近通话', contacts: '联系人', keypad: '键盘' };
  var tabs = document['querySelectorAll']('.phone-app-tab');
  for (var i = 0; i < tabs['length']; i++) {
    if (tabs[i]['getAttribute']('data-tab') === tab) tabs[i]['classList']['add']('active');
    else tabs[i]['classList']['remove']('active');
  }
  for (var k in panes) {
    if (panes['hasOwnProperty'](k)) {
      var el = $(panes[k]);
      if (k === tab) el['classList']['add']('active');
      else el['classList']['remove']('active');
    }
  }
  $('paDialTitle')['textContent'] = titles[tab];
}

/* ========== 键盘 ========== */
function renderKeypad() {
  var keys = [
    { n: '1', s: '' }, { n: '2', s: 'ABC' }, { n: '3', s: 'DEF' },
    { n: '4', s: 'GHI' }, { n: '5', s: 'JKL' }, { n: '6', s: 'MNO' },
    { n: '7', s: 'PQRS' }, { n: '8', s: 'TUV' }, { n: '9', s: 'WXYZ' },
    { n: '*', s: '' }, { n: '0', s: '+' }, { n: '#', s: '' }
  ];
  var html = '';
  for (var i = 0; i < keys['length']; i++) {
    var k = keys[i];
    html += '<button class="phone-app-key" data-n="' + k['n'] + '"><span>' + k['n'] + '</span>' + (k['s'] ? '<span class="pa-sub">' + k['s'] + '</span>' : '') + '</button>';
  }
  $('paKeypad')['innerHTML'] = html;
  var btns = $('paKeypad')['querySelectorAll']('.phone-app-key');
  for (var j = 0; j < btns['length']; j++) {
    (function (btn) {
      btn['addEventListener']('click', function () {
        if (state['digits']['length'] < 20) {
          state['digits'] += btn['getAttribute']('data-n');
          $('paDigits')['textContent'] = state['digits'];
        }
      });
    })(btns[j]);
  }
}

/* ========== 最近通话列表 ========== */
function renderRecents() {
  var list = $('paRecentList');
  var html = '<div class="phone-app-recent-title">最近通话</div>';
  for (var i = 0; i < state['contacts']['length']; i++) {
    var c = state['contacts'][i];
    var avStyle = c['img'] ? ' style="background-image:url(' + c['img'] + ');background-size:cover;background-position:center"' : '';
    var avText = c['img'] ? '' : c['avatar'];
    html += '<div class="phone-app-contact" data-idx="' + i + '">'
      + '<div class="phone-app-contact-left">'
      + '<div class="phone-app-contact-avatar editable" data-edit="' + i + '"' + avStyle + '>' + avText + '</div>'
      + '<div class="phone-app-contact-info"><div class="phone-app-contact-name">' + c['name'] + '</div>'
      + '<div class="phone-app-contact-num">' + c['num'] + ' · 呼出</div></div></div>'
      + '<div class="phone-app-contact-type">📞</div></div>';
  }
  list['innerHTML'] = html;
  bindContactClicks(list, '.phone-app-contact');
}

/* ========== 联系人列表 ========== */
function renderContacts() {
  var list = $('paContactList');
  var html = '';
  for (var i = 0; i < state['contacts']['length']; i++) {
    var c = state['contacts'][i];
    var avStyle = c['img'] ? ' style="background-image:url(' + c['img'] + ');background-size:cover;background-position:center"' : '';
    var avText = c['img'] ? '' : c['avatar'];
    html += '<div class="phone-app-contact" data-idx="' + i + '">'
      + '<div class="phone-app-contact-left">'
      + '<div class="phone-app-contact-avatar editable" data-edit="' + i + '"' + avStyle + '>' + avText + '</div>'
      + '<div class="phone-app-contact-info"><div class="phone-app-contact-name">' + c['name'] + '</div>'
      + '<div class="phone-app-contact-num">' + c['num'] + '</div></div></div></div>';
  }
  list['innerHTML'] = html;
  bindContactClicks(list, '.phone-app-contact');
}

function bindContactClicks(list, sel) {
  var items = list['querySelectorAll'](sel);
  for (var j = 0; j < items['length']; j++) {
    (function (item) {
      item['addEventListener']('click', function (e) {
        var editTarget = e['target'] && e['target']['closest'] ? e['target']['closest']('[data-edit]') : null;
        if (editTarget) {
          e['stopPropagation']();
          var idx = parseInt(editTarget['getAttribute']('data-edit'));
          openContactEdit(idx);
          return;
        }
        var idx = parseInt(item['getAttribute']('data-idx'));
        startCall(state['contacts'][idx]);
      });
    })(items[j]);
  }
}

/* ========== 切换页面 ========== */
function showDial() {
  $('paDialView')['classList']['remove']('phone-app-hidden');
  $('paCallView')['classList']['add']('phone-app-hidden');
  state['view'] = 'dial';
  state['digits'] = '';
  $('paDigits')['textContent'] = '';
}

function showCall() {
  $('paDialView')['classList']['add']('phone-app-hidden');
  $('paCallView')['classList']['remove']('phone-app-hidden');
  state['view'] = 'call';
}

/* ========== 通话流程 ========== */
function startCall(contact) {
  state['currentContact'] = contact;
  /* 加载该联系人的历史记忆 */
  state['history'] = loadMemory(contact['name']);
  state['fallbackIdx'] = 0;
  $('paCallName')['textContent'] = contact['name'];
  $('paCallNum')['textContent'] = contact['num'];
  $('paAvatarLetter')['textContent'] = contact['avatar'];
  var av = $('paCallAvatar');
  if (contact['img']) {
    av['style']['backgroundImage'] = 'url(' + contact['img'] + ')';
    av['classList']['add']('has-img');
  } else {
    av['style']['backgroundImage'] = '';
    av['classList']['remove']('has-img');
  }
  $('paSubtitles')['innerHTML'] = '';
  $('paCallStatus')['textContent'] = '呼出中...';
  state['callSeconds'] = 0;
  state['inCall'] = false;
  showCall();
  setTimeout(function () {
    if (state['view'] !== 'call') return;
    state['inCall'] = true;
    $('paCallStatus')['textContent'] = '通话中 00:00';
    startCallTimer();
    var firstWord = CONFIG['aiFirstWord'];
    pushSub('ai', firstWord);
    speak(firstWord);
  }, CONFIG['callWaitMs']);
}

function startCallTimer() {
  state['callTimer'] = setInterval(function () {
    if (state['inCall']) {
      state['callSeconds']++;
      $('paCallStatus')['textContent'] = '通话中 ' + fmtTime(state['callSeconds']);
    }
  }, 1000);
}

function hangup() {
  state['inCall'] = false;
  state['listening'] = false;
  if (state['callTimer']) { clearInterval(state['callTimer']); state['callTimer'] = null; }
  if (state['recognition']) { try { state['recognition']['stop'](); } catch (e) {} }
  stopSpeaking();
  $('paCallStatus')['textContent'] = '已挂断';
  setTimeout(function () { showDial(); }, 600);
}

/* ========== 字幕 ========== */
function pushSub(role, text, trans) {
  var div = document['createElement']('div');
  div['className'] = 'phone-app-sub ' + role;
  div['textContent'] = text;
  if (trans) {
    var t = document['createElement']('span');
    t['className'] = 'pa-trans';
    t['textContent'] = trans;
    div['appendChild'](t);
  }
  /* pin 按钮 */
  var pin = document['createElement']('span');
  pin['className'] = 'pa-pin';
  pin['textContent'] = '📌记住';
  pin['addEventListener']('click', function (e) {
    e['stopPropagation']();
    togglePin(div, role, text);
  });
  div['appendChild'](pin);
  $('paSubtitles')['appendChild'](div);
  $('paSubtitles')['scrollTop'] = $('paSubtitles')['scrollHeight'];
  return div;
}

function togglePin(divEl, role, text) {
  var isPinned = divEl['classList']['toggle']('pinned');
  if (isPinned) {
    divEl['querySelector']('.pa-pin')['textContent'] = '✓ 已记住';
    if (state['currentContact']) {
      var mem = loadMemory(state['currentContact']['name']);
      /* 去重：同样 role+text 不重复加 */
      var exists = false;
      for (var i = 0; i < mem['length']; i++) {
        if (mem[i]['role'] === role && mem[i]['content'] === text) { exists = true; break; }
      }
      if (!exists) {
        mem['push']({ role: role, content: text });
        saveMemory(state['currentContact']['name'], mem);
      }
    }
    toast('已记住这条');
  } else {
    divEl['querySelector']('.pa-pin')['textContent'] = '📌记住';
    if (state['currentContact']) {
      var mem = loadMemory(state['currentContact']['name']);
      var filtered = [];
      for (var i = 0; i < mem['length']; i++) {
        if (!(mem[i]['role'] === role && mem[i]['content'] === text)) filtered['push'](mem[i]);
      }
      saveMemory(state['currentContact']['name'], filtered);
    }
    toast('已取消记住');
  }
}

/* 给已有字幕追加翻译 */
function appendTrans(subEl, trans) {
  if (!subEl) return;
  var t = document['createElement']('span');
  t['className'] = 'pa-trans';
  t['textContent'] = trans;
  subEl['appendChild'](t);
  $('paSubtitles')['scrollTop'] = $('paSubtitles')['scrollHeight'];
}

/* ========== 语音识别 ========== */
function initRecognition() {
  var SR = window['SpeechRecognition'] || window['webkitSpeechRecognition'];
  if (!SR) { state['recogSupport'] = false; return; }
  state['recogSupport'] = true;
  var rec = new SR();
  rec['lang'] = 'zh-CN';
  rec['interimResults'] = false;
  rec['maxAlternatives'] = 1;
  rec['onresult'] = function (e) {
    var text = e['results'][0][0]['transcript'];
    if (text && text['trim']()) {
      $('paTextInput')['value'] = text['trim']();
      handleUserText(text['trim']());
    }
  };
  rec['onend'] = function () {
    state['listening'] = false;
    updateMicBtn();
  };
  rec['onerror'] = function (e) {
    state['listening'] = false;
    updateMicBtn();
    if (e['error'] === 'not-allowed') toast('需要麦克风权限才能说话哦');
    else if (e['error'] === 'no-speech') toast('没听到声音，再试一次');
  };
  state['recognition'] = rec;
}

function toggleMic() {
  if (!state['recogSupport']) { toast('当前浏览器不支持语音识别，请打字输入'); return; }
  if (state['listening']) {
    try { state['recognition']['stop'](); } catch (e) {}
  } else {
    stopSpeaking();
    try { state['recognition']['start'](); state['listening'] = true; updateMicBtn(); }
    catch (e) { state['listening'] = false; updateMicBtn(); }
  }
}

function updateMicBtn() {
  var btn = $('paMicBtn');
  if (state['listening']) btn['classList']['add']('active');
  else btn['classList']['remove']('active');
}

/* ========== AI 对话 ========== */
function handleUserText(text) {
  pushSub('user', text);
  state['history']['push']({ role: 'user', content: text });
  var cfg = state['config'];
  if (!cfg['apiKey']) {
    var reply = CONFIG['fallbackReplies'][state['fallbackIdx'] % CONFIG['fallbackReplies']['length']];
    state['fallbackIdx']++;
    setTimeout(function () { aiReplied(reply); }, 400);
    return;
  }
  callAi(text);
}

function callAi(userText) {
  var cfg = state['config'];
  /* 没填模型名，直接提示，不发请求 */
  if (!cfg['model']) {
    aiReplied('请先在设置里填写「模型名称」，例如 SenseChat-5。');
    return;
  }
  var url = cfg['baseUrl']['replace'](/\/+$/, '') + '/chat/completions';
  /* 系统提示词：用户设置的优先，加上联系人名作为上下文 */
  var sysPrompt = cfg['sysPrompt'] || CONFIG['defaultSysPrompt'];
  if (state['currentContact'] && state['currentContact']['name']) {
    sysPrompt = '你正在和「' + state['currentContact']['name'] + '」通电话。\n' + sysPrompt;
  }
  var recent = state['history']['slice'](-CONFIG['maxHistory']);
  var messages = [{ role: 'system', content: sysPrompt }];
  for (var i = 0; i < recent['length']; i++) messages['push'](recent[i]);

  fetch(url, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + cfg['apiKey'] },
    body: JSON['stringify']({ model: cfg['model'], messages: messages })
  })['then'](function (resp) {
    if (!resp['ok']) {
      /* 解析 API 返回的具体错误信息 */
      return resp['json']()['then'](function (errData) {
        var msg = (errData && errData['error'] && (errData['error']['message'] || errData['error']['code'])) || ('HTTP ' + resp['status']);
        throw new Error(msg);
      })['catch'](function () { throw new Error('HTTP ' + resp['status']); });
    }
    return resp['json']();
  })['then'](function (data) {
    var reply = data && data['choices'] && data['choices'][0] && data['choices'][0]['message'] && data['choices'][0]['message']['content'];
    aiReplied(reply || '（没收到回复）');
  })['catch'](function (e) {
    aiReplied('出错了：' + e['message']);
  });
}

function aiReplied(text) {
  var subEl = pushSub('ai', text);
  state['history']['push']({ role: 'assistant', content: text });
  speak(text);
  /* 英文自动翻译 */
  if (state['config']['autoTrans'] && isEnglish(text)) {
    translateText(text, subEl);
  }
}

/* 调用 AI 翻译英文为中文 */
function translateText(enText, subEl) {
  var cfg = state['config'];
  if (!cfg['apiKey']) { appendTrans(subEl, '（需配置 API Key 才能翻译）'); return; }
  var url = cfg['baseUrl']['replace'](/\/+$/, '') + '/chat/completions';
  fetch(url, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + cfg['apiKey'] },
    body: JSON['stringify']({
      model: cfg['model'],
      messages: [
        { role: 'system', content: '你是翻译器，只输出中文译文，不要解释。' },
        { role: 'user', content: '翻译成中文：' + enText }
      ]
    })
  })['then'](function (resp) { return resp['ok'] ? resp['json']() : null; })
  ['then'](function (data) {
    var tr = data && data['choices'] && data['choices'][0] && data['choices'][0]['message'] && data['choices'][0]['message']['content'];
    if (tr) appendTrans(subEl, tr['trim']());
  })['catch'](function () {});
}

/* ========== TTS 朗读 ========== */
function initTts() {
  state['synthSupport'] = typeof window['speechSynthesis'] !== 'undefined';
}

function speak(text) {
  var cfg = state['config'];
  if (cfg['useCloudTts'] && cfg['ttsUrl']) { speakCloud(text); return; }
  speakBrowser(text);
}

/* 浏览器原生 TTS */
function speakBrowser(text) {
  if (!state['synthSupport']) { toast('当前浏览器不支持语音朗读，已切换为文字模式'); return; }
  try {
    window['speechSynthesis']['cancel']();
    var u = new window['SpeechSynthesisUtterance'](text);
    u['lang'] = isEnglish(text) ? 'en-US' : 'zh-CN';
    u['rate'] = 1; u['pitch'] = 1;
    window['speechSynthesis']['speak'](u);
  } catch (e) {}
}

/* 云端 TTS（MiniMax T2A V2），失败时自动降级到浏览器朗读 */
function speakCloud(text) {
  var cfg = state['config'];
  var key = cfg['ttsApiKey'] || cfg['apiKey']; /* MiniMax key，没填就用聊天的 key */
  if (!key) { toast('TTS 需要 API Key，请在设置里填写'); speakBrowser(text); return; }

  var body = JSON['stringify']({
    model: CONFIG['ttsModel'],
    text: text,
    stream: false,
    output_format: 'hex',
    language_boost: 'auto',
    voice_setting: {
      voice_id: cfg['ttsVoiceId'],
      speed: 1,
      vol: 1,
      pitch: 0
    },
    audio_setting: {
      sample_rate: 32000,
      bitrate: 128000,
      format: 'mp3',
      channel: 1
    }
  });

  /* 主接口 + 备用接口，主接口失败自动试备用 */
  var urls = [cfg['ttsUrl']];
  if (cfg['ttsUrl'] !== CONFIG['defaultTtsBackupUrl']) {
    urls['push'](CONFIG['defaultTtsBackupUrl']);
  }

  function tryTts(idx, lastErr) {
    if (idx >= urls['length']) {
      var errMsg = lastErr || '未知错误';
      if (errMsg['indexOf']('Failed to fetch') >= 0 || errMsg['indexOf']('NetworkError') >= 0) {
        errMsg = '网络或跨域(CORS)错误，浏览器无法直连 MiniMax';
      }
      toast('MiniMax TTS 失败：' + errMsg);
      speakBrowser(text); /* 自动降级 */
      return;
    }
    var url = urls[idx] + '?GroupId=' + encodeURIComponent(cfg['ttsGroupId']);
    fetch(url, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer ' + key
      },
      body: body
    })['then'](function (resp) {
      if (!resp['ok']) {
        return resp['text']()['then'](function (body) {
          var msg = 'HTTP ' + resp['status'];
          try {
            var j = JSON['parse'](body);
            if (j && j['base_resp']) msg += '：' + (j['base_resp']['status_msg'] || j['base_resp']['status_code']);
          } catch (e) { msg += '：' + body['slice'](0, 80); }
          throw new Error(msg);
        });
      }
      return resp['json']();
    })['then'](function (data) {
      /* MiniMax 即使业务错误也返回 HTTP 200，需检查 base_resp.status_code */
      var base = data && data['base_resp'];
      if (base && base['status_code'] !== 0) {
        throw new Error('业务错误 ' + base['status_code'] + '：' + (base['status_msg'] || '未知'));
      }
      var hex = data && data['data'] && data['data']['audio'];
      if (!hex) {
        /* 调试：把完整响应打出来 */
        var dump = JSON['stringify'](data)['slice'](0, 200);
        throw new Error('未返回音频数据，响应：' + dump);
      }
      var blob = hexToBlob(hex, 'audio/mpeg');
      var audio = new window['Audio']();
      audio['src'] = URL['createObjectURL'](blob);
      audio['play']();
    })['catch'](function (e) {
      tryTts(idx + 1, e['message'] || String(e)); /* 主接口失败，试备用 */
    });
  }
  tryTts(0);
}

/* hex 字符串转 Blob */
function hexToBlob(hex, mimeType) {
  var bytes = new Uint8Array(hex['length'] / 2);
  for (var i = 0; i < hex['length']; i += 2) {
    bytes[i / 2] = parseInt(hex['substr'](i, 2), 16);
  }
  return new Blob([bytes], { type: mimeType });
}

function stopSpeaking() {
  if (state['synthSupport']) { try { window['speechSynthesis']['cancel'](); } catch (e) {} }
}

/* ========== 头像编辑 ========== */
function onAvatarClick() {
  $('paAvatarFile')['click']();
}

function onAvatarFileChange(e) {
  var file = e['target'] && e['target']['files'] && e['target']['files'][0];
  if (!file) return;
  var reader = new FileReader();
  reader['onload'] = function (ev) {
    var av = $('paCallAvatar');
    av['style']['backgroundImage'] = 'url(' + ev['target']['result'] + ')';
    av['classList']['add']('has-img');
    toast('头像已更换');
  };
  reader['readAsDataURL'](file);
  e['target']['value'] = '';
}

/* ========== 联系人记忆库 ========== */
function loadMemory(contactName) {
  try {
    var all = JSON['parse'](localStorage['getItem'](CONFIG['memoryKey']) || '{}');
    var mem = all[contactName] || [];
    return mem;
  } catch (e) { return []; }
}

function saveMemory(contactName, history) {
  try {
    var all = JSON['parse'](localStorage['getItem'](CONFIG['memoryKey']) || '{}');
    all[contactName] = history['slice'](-CONFIG['memoryMax'] * 2);
    localStorage['setItem'](CONFIG['memoryKey'], JSON['stringify'](all));
  } catch (e) {}
}

function clearMemory(contactName) {
  try {
    var all = JSON['parse'](localStorage['getItem'](CONFIG['memoryKey']) || '{}');
    delete all[contactName];
    localStorage['setItem'](CONFIG['memoryKey'], JSON['stringify'](all));
  } catch (e) {}
}

/* ========== 联系人持久化 ========== */
function loadContacts() {
  try {
    var saved = JSON['parse'](localStorage['getItem']('phone_app_contacts') || '[]');
    if (saved && saved['length']) {
      state['contacts'] = saved;
      return;
    }
  } catch (e) {}
  state['contacts'] = CONFIG['contacts']['map'](function (c) {
    return { name: c['name'], num: c['num'], avatar: c['avatar'], sys: c['sys'], img: '' };
  });
}

function saveContacts() {
  try { localStorage['setItem']('phone_app_contacts', JSON['stringify'](state['contacts'])); } catch (e) {}
}

/* ========== 联系人编辑（Apple 风格） ========== */
var cEditIdx = -1;
var cEditImg = '';

function openContactEdit(idx) {
  cEditIdx = idx;
  var c = state['contacts'][idx];
  if (!c) return;
  cEditImg = c['img'] || '';
  $('paCEditName')['value'] = c['name'];
  $('paCEditNum')['value'] = c['num'];
  $('paCEditLetter')['textContent'] = c['avatar'];
  var av = $('paCEditAvatar');
  if (cEditImg) {
    av['style']['backgroundImage'] = 'url(' + cEditImg + ')';
    av['classList']['add']('has-img');
  } else {
    av['style']['backgroundImage'] = '';
    av['classList']['remove']('has-img');
  }
  $('paCEditMask')['classList']['remove']('phone-app-hidden');
}

function closeContactEdit() { $('paCEditMask')['classList']['add']('phone-app-hidden'); }

function onCEditAvatarClick() { $('paCEditFile')['click'](); }

function onCEditFileChange(e) {
  var file = e['target'] && e['target']['files'] && e['target']['files'][0];
  if (!file) return;
  var reader = new FileReader();
  reader['onload'] = function (ev) {
    cEditImg = ev['target']['result'];
    var av = $('paCEditAvatar');
    av['style']['backgroundImage'] = 'url(' + cEditImg + ')';
    av['classList']['add']('has-img');
    toast('头像已更换，记得点保存');
  };
  reader['readAsDataURL'](file);
  e['target']['value'] = '';
}

function saveContactEdit() {
  if (cEditIdx < 0) return;
  var name = $('paCEditName')['value']['trim']();
  var num = $('paCEditNum')['value']['trim']();
  if (!name) { toast('备注名不能为空'); return; }
  var c = state['contacts'][cEditIdx];
  c['name'] = name;
  c['num'] = num;
  c['avatar'] = name['charAt'](0);
  if (cEditImg) c['img'] = cEditImg;
  saveContacts();
  renderRecents();
  renderContacts();
  closeContactEdit();
  toast('联系人已保存');
}

/* ========== 设置面板 ========== */
function openSettings() {
  var cfg = state['config'];
  $('paBaseUrl')['value'] = cfg['baseUrl'];
  $('paApiKey')['value'] = cfg['apiKey'];
  $('paModel')['value'] = cfg['model'];
  $('paSysPrompt')['value'] = cfg['sysPrompt'];
  $('paUseCloudTts')['checked'] = cfg['useCloudTts'];
  $('paTtsUrl')['value'] = cfg['ttsUrl'];
  $('paTtsApiKey')['value'] = cfg['ttsApiKey'] || '';
  $('paTtsGroupId')['value'] = cfg['ttsGroupId'];
  $('paTtsVoiceId')['value'] = cfg['ttsVoiceId'];
  $('paAutoTrans')['checked'] = cfg['autoTrans'];
  $('paSettingsMask')['classList']['remove']('phone-app-hidden');
}

function closeSettings() { $('paSettingsMask')['classList']['add']('phone-app-hidden'); }

function saveSettings() {
  state['config']['baseUrl'] = $('paBaseUrl')['value']['trim']();
  state['config']['apiKey'] = $('paApiKey')['value']['trim']();
  state['config']['model'] = $('paModel')['value']['trim']();
  state['config']['sysPrompt'] = $('paSysPrompt')['value']['trim']() || CONFIG['defaultSysPrompt'];
  state['config']['useCloudTts'] = $('paUseCloudTts')['checked'];
  state['config']['ttsUrl'] = $('paTtsUrl')['value']['trim']();
  state['config']['ttsApiKey'] = $('paTtsApiKey')['value']['trim']();
  state['config']['ttsGroupId'] = $('paTtsGroupId')['value']['trim']();
  state['config']['ttsVoiceId'] = $('paTtsVoiceId')['value']['trim']();
  state['config']['autoTrans'] = $('paAutoTrans')['checked'];
  saveConfig();
  toast('已保存');
  closeSettings();
}

/* ========== 初始化（带重试机制） ========== */
var bootTries = 0;
function boot() {
  bootTries++;
  if (!$('paRoot')) {
    if (bootTries < 40) setTimeout(boot, 50); /* DOM 未就绪，50ms 后重试 */
    return;
  }
  loadConfig();
  loadContacts();
  renderKeypad();
  renderRecents();
  renderContacts();
  initRecognition();
  initTts();

  /* 底部 tab 切换 */
  var tabs = document['querySelectorAll']('.phone-app-tab');
  for (var i = 0; i < tabs['length']; i++) {
    (function (t) {
      t['addEventListener']('click', function () { switchTab(t['getAttribute']('data-tab')); });
    })(tabs[i]);
  }

  /* 拨号按钮 */
  $('paCallBtn')['addEventListener']('click', function () {
    startCall(state['contacts'][0]);
  });
  /* 挂断 */
  $('paHangupBtn')['addEventListener']('click', hangup);
  /* 麦克风 */
  $('paMicBtn')['addEventListener']('click', toggleMic);
  /* 文本发送 */
  $('paTextSend')['addEventListener']('click', function () {
    var v = $('paTextInput')['value']['trim']();
    if (v) { $('paTextInput')['value'] = ''; handleUserText(v); }
  });
  $('paTextInput')['addEventListener']('keydown', function (e) {
    if (e['key'] === 'Enter') $('paTextSend')['click']();
  });
  /* 静音/免提 */
  $('paMuteBtn')['addEventListener']('click', function () { $('paMuteBtn')['classList']['toggle']('active'); });
  $('paSpeakerBtn')['addEventListener']('click', function () { $('paSpeakerBtn')['classList']['toggle']('active'); });
  /* 头像编辑 */
  $('paCallAvatar')['addEventListener']('click', onAvatarClick);
  $('paAvatarFile')['addEventListener']('change', onAvatarFileChange);
  /* 设置 */
  $('paSettingsBtn')['addEventListener']('click', openSettings);
  $('paCloseSettings')['addEventListener']('click', closeSettings);
  $('paSaveSettings')['addEventListener']('click', saveSettings);
  $('paSettingsMask')['addEventListener']('click', function (e) {
    if (e['target'] === $('paSettingsMask')) closeSettings();
  });
  /* 联系人编辑 */
  $('paCEditClose')['addEventListener']('click', closeContactEdit);
  $('paCEditSave')['addEventListener']('click', saveContactEdit);
  $('paCEditAvatar')['addEventListener']('click', onCEditAvatarClick);
  $('paCEditFile')['addEventListener']('change', onCEditFileChange);
  $('paCEditMask')['addEventListener']('click', function (e) {
    if (e['target'] === $('paCEditMask')) closeContactEdit();
  });
  $('paCEditCall')['addEventListener']('click', function () {
    if (cEditIdx < 0) return;
    var c = state['contacts'][cEditIdx];
    closeContactEdit();
    startCall(c);
  });
  $('paCEditClear')['addEventListener']('click', function () {
    if (cEditIdx < 0) return;
    var c = state['contacts'][cEditIdx];
    clearMemory(c['name']);
    state['history'] = [];
    toast('已清除「' + c['name'] + '」的记忆');
  });
}

if (document['readyState'] === 'loading') {
  document['addEventListener']('DOMContentLoaded', boot);
} else {
  boot();
}
</script>
</body>
</html>
