# Cloudflare Pages 配置
# 项目名(在 Cloudflare 上要唯一,部署时若被占用改名)
name = "my-diary"
compatibility_date = "2024-09-01"
pages_build_output_dir = "."

# D1 数据库绑定
# 数据库名:my-diary-db(部署前先创建,见 README)
# binding 名必须叫 DB,Functions 里用 env.DB 访问
[[d1_databases]]
binding = "DB"
database_name = "my-diary-db"
database_id = "REPLACE_WITH_YOUR_D1_ID"   # 创建后填回,本地 dev 可不填

# 环境变量(非敏感的可以放这里,敏感的放 Pages 设置里)
[vars]
# 前台是否对未登录访客可见(前台浏览不需要密码)
PUBLIC_READ = "1"

# ⚠️ 管理员密码不要写在这里!本地用 .dev.vars,线上用 Pages → Settings → Environment Variables
# ADMIN_PASSWORD = "..."   ← 故意不写,见 .dev.vars.example
