name: Build static pages

on:
  push:
    branches: [main]
    paths:
      - 'posts/**'
      - 'comments/**'
      - 'build.js'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-static-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run build.js
        run: node build.js

      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # 暂存 build.js 生成物:index.json / posts/*.html / sitemap.xml / llms.txt / all-posts.html
          # posts/ 下源 .md 由上游 commit 带入,这里只提交生成物,不会动到 .md
          git add posts/index.json sitemap.xml llms.txt all-posts.html
          git add 'posts/*.html'
          if git diff --cached --quiet; then
            echo "生成物无变化,跳过提交"
          else
            git commit -m "chore: 自动重建静态页/索引/sitemap/llms.txt [skip ci]"
            git push
            echo "已提交生成物"
          fi
